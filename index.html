<style>
  :root {
    --bg: #F5F5F5;
    --surface: #FFFFFF;
    --ink: #222222;
    --muted: #767676;
    --brand: #2F6B4B;
    --brand-light: #E6F0E8;
    --accent: #E8A93B;
    --accent-light: #FBEFD8;
    --danger: #C0533B;
    --border: #EEEEEE;
    --flag-green: #218A4E;
    --flag-sky: #2E9BD6;
    --flag-brown: #8B5E34;
    --flag-navy: #1E3A5F;
    --flag-purple: #7C4DBE;
    --flag-pink: #D6336C;
    --flag-orange: #E8590C;
    --flag-slate: #5C6B73;
    --flag-yellow: #B8901A;
    --flag-blue: #1D5FA8;
    --chrome-ink-deep: #161616;
    --chrome-yellow: #FECD3F;
    --brand-orange: #DE8619;
    --warn-yellow: #F6DF20;
    --warn-black: #141A1E;
    --panel-dark: #323232;
    --text: #4E4E4E;
    --text-sub: #767676;
    --slot-navy: #1E3A5F;
    --tape: 14px; --bar: 56px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 14px 16px; }
  .time-section { margin-bottom: 20px; }
  .time-heading {
    font-size: 19px; font-weight: 800; color: #fff; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--brand); padding: 6px 16px; border-radius: 999px;
  }
  .classroom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(244px, 1fr)); gap: 8px; }
  .classroom-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  .classroom-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .classroom-header .room-title { font-weight: 800; font-size: 16px; color: var(--brand); }
  .classroom-count { font-size: 12px; color: var(--muted); font-weight: 700; }
  .add-student-btn {
    width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    color: var(--brand); font-weight: 800; font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; margin-left: 6px;
  }
  .add-student-btn:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
  .student-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .student-chip { display: flex; flex-direction: column; align-items: center; width: 112px; text-align: center; }
  .student-chip .s-name { font-size: 16px; font-weight: 800; margin-top: 6px; line-height: 1.2; cursor: pointer; }
  .student-chip .s-name:hover { text-decoration: underline; }
  .student-chip .s-age-inline { font-weight: 600; color: var(--muted); font-size: 13px; }
  .student-chip .s-meta-line { font-size: 13px; margin-top: 2px; }
  .student-chip .s-pay-flag { color: var(--danger); font-weight: 800; }
  .avatar-clickable { cursor: pointer; }
  .sample-box-outer {
    width: 108px; height: 108px; border-radius: 14px; border: 3px dashed #000;
    padding: 3px; box-sizing: border-box; cursor: pointer;
  }
  .sample-box {
    width: 100%; height: 100%; border-radius: 10px; border: 3px dashed #E8B800; background: #FFFBEA;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-size: 20px; font-weight: 900; line-height: 1.15; color: #1a1a1a;
  }
  .avatar-wrap { position: relative; display: inline-block; }
  .avatar-flag-badge {
    position: absolute; right: -4px; bottom: -2px; font-size: 11px; font-weight: 800;
    background: #fff; border-radius: 6px; padding: 0px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .sms-checkbox { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; cursor: pointer; z-index: 5; }
  .sms-float-bar {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 45;
    background: var(--ink); color: #fff; padding: 10px 10px 10px 18px; border-radius: 999px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.28); font-size: 13px; font-weight: 700;
  }
  .sms-float-bar button { background: #fff; color: var(--ink); border: none; border-radius: 999px; padding: 7px 16px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .sms-float-bar button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .category-tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .category-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .recipient-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-light); color: var(--brand); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; margin: 3px 4px 0 0; }
  .recipient-chip .x { cursor: pointer; font-weight: 900; }
  .sms-textarea { width: 100%; min-height: 110px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; font-family: inherit; resize: vertical; }
  .mini-btn { margin-top: 5px; font-size: 10px; padding: 3px 7px; border-radius: 7px; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .wrap-gap { display: flex; flex-wrap: wrap; gap: 8px; }
  .gap2 { gap: 8px; } .gap3 { gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .warn-bar {
    height: 10px;
    background: repeating-linear-gradient(90deg,
      var(--warn-yellow) 0 var(--bar), var(--warn-black) var(--bar) calc(var(--bar)*2));
  }
  .warn-frame { position: relative; padding: var(--tape); box-sizing: border-box; }
  .warn-frame .inner { background: #fff; padding: 20px; position: relative; z-index: 1; border-radius: 8px; }
  .warn-frame i { position: absolute; display: block; }
  .warn-frame .l, .warn-frame .r {
    top: 0; bottom: 0; width: var(--tape);
    background: repeating-linear-gradient(180deg,
      var(--warn-yellow) 0 var(--bar), var(--warn-black) var(--bar) calc(var(--bar)*2));
  }
  .warn-frame .l { left: 0; } .warn-frame .r { right: 0; }
  .warn-frame .t, .warn-frame .b {
    left: var(--tape); right: var(--tape); height: var(--tape);
    background: repeating-linear-gradient(90deg,
      var(--warn-yellow) 0 var(--bar), var(--warn-black) var(--bar) calc(var(--bar)*2));
  }
  .warn-frame .t { top: 0; } .warn-frame .b { bottom: 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 8px 14px;
    font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  .btn:hover { border-color: var(--brand-orange); color: var(--brand-orange); }
  .btn-primary { background: var(--brand-orange); color: #fff; border-color: var(--brand-orange); }
  .btn-primary:hover { opacity: .9; color: #fff; }
  .btn-danger { background: var(--chrome-ink-deep); color: var(--warn-yellow); border-color: var(--chrome-ink-deep); }
  .btn-danger:hover { opacity: .88; color: var(--warn-yellow); }
  .pill { border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
  .day-pill { font-size: 16px; font-weight: 800; padding: 8px 18px; }
  .pill.active { background: var(--brand-orange); border-color: var(--brand-orange); color: #fff; }
  .tab { padding: 8px 4px; font-weight: 700; font-size: 14px; color: rgba(34,34,34,.6); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: #161616; border-color: var(--brand); }
  .muted { color: var(--muted); }
  .avatar { border-radius: 999px; object-fit: cover; border: 2px solid var(--border); }
  .avatar-fallback { border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .search-wrap { position: relative; flex: 0 0 140px; }
  .search-wrap-wide { position: relative; flex: 1 1 220px; }
  .search-wrap input, .search-wrap-wide input { width: 100%; padding: 9px 12px 9px 30px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; outline: none; }
  .search-icon { position: absolute; left: 10px; top: 9px; font-size: 13px; color: var(--muted); }
  .header { border-bottom: 1px solid var(--border); background: var(--chrome-yellow); }
  .header-inner { max-width: 1600px; margin: 0 auto; padding: 12px 20px; }
  .topbar-dark { background: var(--chrome-ink-deep); }
  .topbar-dark-inner { max-width: 1600px; margin: 0 auto; padding: 5px 20px; display: flex; gap: 14px; align-items: center; font-size: 11px; color: rgba(255,255,255,.78); flex-wrap: wrap; }
  .banner-warn { background: var(--accent-light); color: #8A5B12; padding: 8px 12px; border-radius: 10px; font-size: 12px; margin-bottom: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.15); color: #fff; background: var(--chrome-ink-deep); font-size: 13px; font-weight: 600; z-index: 60; }
  .toast.error { background: var(--danger); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(32,38,31,0.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 100%; }
  .dropzone { border: 2px dashed var(--border); background: var(--bg); border-radius: 14px; padding: 30px 16px; text-align: center; cursor: pointer; }
  .dropzone.drag { border-color: var(--brand); background: var(--brand-light); }
  input[type="file"] { display: none; }
  .print-title { font-size: 20px; font-weight: 800; margin-bottom: 14px; }
  .list-room-row { padding: 8px 10px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
  .list-room-row-alt { background: #E4E9EC; }
  .list-room-title { min-width: 190px; flex-shrink: 0; font-size: 15px; font-weight: 800; color: var(--ink); background: #E4F2FA; border: 2px solid var(--flag-blue); padding: 2px 10px; border-radius: 8px; align-self: flex-start; }
  .list-room-title .muted { color: var(--muted) !important; }
  .list-room-students { font-size: 14px; line-height: 1.8; padding-top: 4px; color: var(--ink); }
  .list-student-click { cursor: pointer; border-radius: 4px; }
  .list-student-click:hover { background: rgba(0,0,0,.08); }
  .list-time-heading { display: inline-flex; align-items: center; gap: 6px; background: var(--flag-navy); color: #fff; border: 2px solid var(--flag-navy); padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; margin-bottom: 8px; }
  .list-memo-btn { cursor: pointer; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.25); color: #fff; border: 1px solid transparent; }
  .list-time-heading .list-memo-btn { background: rgba(255,255,255,.22); }
  .list-room-memo-btn { cursor: pointer; border-radius: 999px; padding: 1px 8px; font-size: 10px; font-weight: 700; background: var(--bg); color: var(--flag-blue); border: 1px solid var(--flag-blue); margin-left: 6px; flex-shrink: 0; }
  .list-memo-inline-time { font-size: 11px; font-weight: 400; color: var(--muted); }
  .list-memo-inline-room { font-size: 11px; font-weight: 400; font-style: italic; color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; padding-left: 8px; }
  .list-memo-edit-box { margin-top: 6px; width: 100%; flex-basis: 100%; }
  .list-memo-edit-box textarea { min-width: 420px; max-width: 100%; }
  .list-memo-edit-box textarea { width: 100%; min-height: 50px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; font-family: inherit; }
  .list-day-memo-box { margin-top: 20px; background: #fff; border: 2px dashed var(--border); border-radius: 14px; padding: 16px 18px; }
  .list-day-memo-label { font-weight: 800; font-size: 14px; color: var(--ink); }
  .list-day-memo-box textarea { width: 100%; min-height: 110px; margin-top: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid-header { margin-bottom: 6px; }
  .cal-weekday { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 14px; font-weight: 600; position: relative; }
  .cal-cell-empty { visibility: hidden; }
  .cal-cell-clickable { cursor: pointer; }
  .cal-cell-clickable:hover { background: var(--bg); }
  .cal-cell-today .cal-cell-num { background: var(--brand); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .cal-cell-viewing { background: #FFF3D6; border: 2px solid var(--accent); }
  .cal-cell-dot { font-size: 9px; margin-top: 1px; }

  /* 보강 예약 관리 — 달력 + 시간표 */
  .mk-cal-cell { min-height: 84px; border: 1px solid var(--border); border-radius: 8px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; }
  .mk-cal-cell:hover { background: var(--bg); }
  .mk-cal-cell-empty { visibility: hidden; border: none; cursor: default; }
  .mk-cal-cell-today { border: 2px solid var(--brand); }
  .mk-cal-cell-num { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .mk-cal-cell-chips { display: flex; flex-direction: column; gap: 2px; }
  .mk-chip { font-size: 9px; font-weight: 700; border-radius: 5px; padding: 2px 4px; text-align: center; }
  .mk-chip-open { background: var(--accent-light, #e9f9ee); color: #1a7f37; }
  .mk-chip-closed { background: #f0f0f0; color: #888; }
  .mk-chip-candidate { background: #eaf3ff; color: #1a5fb4; }
  .mk-timetable { border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  .mk-tt-row { display: flex; border-top: 1px solid var(--border); }
  .mk-tt-row:first-child { border-top: none; }
  .mk-tt-head { background: var(--bg); font-weight: 700; font-size: 12px; }
  .mk-tt-timecol { width: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; padding: 6px; background: var(--bg); }

const localStore = { roster: null, photos: {}, overrides: {}, additions: {}, manualRooms: {}, smsTemplates: {}, smsQueue: {}, smsConfig: null, attendance: {}, counseling: {}, listMemos: {}, dayLogs: {}, makeupOpenings: {}, bookingSettings: null }; // in-memory store used only in TEST_MODE

  if (dayLetter === "토") return FIXED_TIME_TEMPLATE.saturday;
  if (dayLetter === "월" || dayLetter === "일") return FIXED_TIME_TEMPLATE.none;
  return FIXED_TIME_TEMPLATE.weekday; // 화, 수, 목, 금
}
// 현재 로스터에 등장한 적 있는 모든 반(1~6번)과 그 담당 선생님 목록
function getKnownClassrooms() {
  const map = new Map();
  for (const row of state.roster) {
    const cls = parseClassField(row.classField);
    if (cls) map.set(cls.classNo, cls.teacher);
  }
  return Array.from(map.entries()).map(([classNo, teacher]) => ({ classNo, teacher })).sort((a, b) => a.classNo.localeCompare(b.classNo, "ko"));
}
// 특정 날짜+시간에 이미 존재하는(원래 배정 또는 수동 추가) 반 번호 목록
function getRoomsPresentAtSlot(dateISO, day, time) {
  const studentsIndex = buildStudentsIndex();
  const classNos = new Set();
  for (const s of studentsIndex.values()) {
    if (s.status && s.status !== "재원") continue;
    for (const cls of s.classes) {
      if (cls.day === day && cls.time === time) classNos.add(cls.classNo);
    }
  }
  for (const mr of Object.values(state.manualRooms)) {
    if (mr.dateISO === dateISO && mr.time === time) classNos.add(mr.classNo);
  }
  return classNos;
}

// 등록(additions) 문서가 이 날짜 화면에 해당하는지. 단기(recurring)는 시작일 이후 매주 같은 요일에 반복 표시됨.
// 옛 문서에 startDate가 없으면 "처음부터 계속"으로 봄 (화면마다 다르게 판단하지 않도록 반드시 이 함수만 사용)
function additionMatchesDate(a, dateISO, dayLetter) {
  if (a.recurring) return a.day === dayLetter && (a.startDate || "") <= dateISO;
  return a.dateISO === dateISO;
}

const TYPE_ORDER = ["sample", "newStudent", "makeup", "substitute", "moveIn", "shortterm"];

/* ---------- constants & helpers ---------- */

const KOREAN_BY_JSDAY = ["일", "월", "화", "수", "목", "금", "토"];
const WEEK_ORDER = ["월", "화", "수", "목", "금", "토", "일"];
const AVATAR_PALETTE = [
  { bg: "#E6F0E8", fg: "#2F6B4B" },
  { bg: "#FBEFD8", fg: "#B4791F" },
  { bg: "#F0E3EC", fg: "#8A4D74" },
  { bg: "#E3ECF3", fg: "#3A6588" },
  { bg: "#F3E7E3", fg: "#A0553A" },
  { bg: "#EAF0DE", fg: "#5C7A2E" },
];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function avatarColor(name) {
  return AVATAR_PALETTE[hashStr(name || "?") % AVATAR_PALETTE.length];
}
// 지금 로그인한 사람의 식별자. 구글/이메일 로그인 상관없이 이메일 주소를 그대로 씀 (누가 했는지 기록용)

}
// 이름 끝의 동명이인 구분용 알파벳(예: "김철수B")을 뗀 이름

  return String(name || "").replace(/[A-Za-z]+$/, "").trim();
}

function photoLookupIndex() {
  const idx = new Map();
  for (const k of Object.keys(state.photos)) {

    idx.set(`${(v.phone || "").trim()}::${baseName(v.name)}`, k);

}
// 정확한 키가 없으면 "전화번호+알파벳뗀이름"이 같은 기존 사진 기록을 찾아 재사용
function resolvePhotoKey(phone, name, idx) {
  const exact = makeKey(phone, name);
  if (state.photos[exact]) return exact;
  const lookup = idx || photoLookupIndex();
  return lookup.get(`${(phone || "").trim()}::${baseName(name)}`) || exact;

  if (!raw) return null;

  if (!m) return null;
  return { classNo: m[1].trim(), teacher: m[2].trim(), day: m[3], period: m[4], time: m[5], raw: String(raw).trim() };

  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function formatTimeKorean(t) {
  const [h, m] = t.split(":").map(Number);
  const period = h < 12 ? "오전" : "오후";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${period} ${h12}시${String(m).padStart(2, "0")}분`;
}
// 오늘이 속한 주(월~일)의 실제 날짜를 요일 글자에 매핑
function getWeekDates(base) {
  const d = base ? new Date(base) : new Date();
  const jsDay = d.getDay(); // 0=일 ... 6=토
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  const monday = new Date(d);
  monday.setDate(d.getDate() + mondayOffset);
  monday.setHours(0, 0, 0, 0);
  const map = {};
  WEEK_ORDER.forEach((letter, i) => {
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    map[letter] = dt;
  });
  return map;
}
function toISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

async function resizeImageFile(file, maxDim = 240, quality = 0.82) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = dataUrl;
  });
  let { width, height } = img;
  if (width > height) { if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; } }
  else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return canvas.toDataURL("image/jpeg", quality);
}
function avatarHtml(name, photo, size, borderColor, borderCss) {
  const borderStyle = borderCss ? `border:${borderCss};` : borderColor ? `border:3px solid ${borderColor};` : "";
  if (photo) return `<img class="avatar" src="${photo}" style="width:${size}px;height:${size}px;${borderStyle}" alt="${esc(name)}"/>`;
  const c = avatarColor(name);

  return `<div class="avatar-fallback" style="width:${size}px;height:${size}px;background:${c.bg};${fallbackBorder}">
    <span style="font-size:${Math.round(size * 0.4)}px">🌱</span></div>`;
}

  listMemos: {}, // 리스트 보기의 시간대별/반별 메모. key -> {text, updatedAt}
  dayLogs: {}, // 날짜별로 저장해둔 "그날의 반배정+출결상황" 텍스트 스냅샷. dateISO -> {text, savedAt}

async function handleRosterFile(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    const cleaned = rows.map((r) => ({
      center: String(r["센터명"] || "").trim(),
      name: String(r["원생명"] || "").trim(),
      phone: String(r["연락처"] || "").trim(),
      age: r["나이"],
      status: String(r["상태"] || "").trim(),
      classField: String(r["반"] || "").trim(),
      registeredAt: r["등록일"] || null,
      startDate: r["시작일"] || null,
      sessionsLeft: r["횟수"] !== "" && r["횟수"] != null ? Number(r["횟수"]) : null,
    })).filter((r) => r.name && r.phone);

    const payload = { uploadedAt: Date.now(), fileName: file.name, rows: cleaned };
    if (TEST_MODE) { localStore.roster = payload; }
    else { await setDoc(doc(db, "roster", "current"), payload); }
    state.roster = cleaned;
    state.rosterMeta = { uploadedAt: payload.uploadedAt, fileName: file.name };
    state.viewDate = null; // 새 데이터가 들어오면 날짜 지정도 실제 오늘로 리셋
    state.selectedDay = KOREAN_BY_JSDAY[new Date().getDay()]; // 업로드하면 항상 오늘 요일로 리셋
    render();
    showToast(`반 배정 업데이트 완료 · ${cleaned.length}건 반영됨`);
  } catch (e) {
    console.error(e);
    showToast("엑셀 파일을 읽는 중 문제가 발생했어요", "error");
  }
}

// 반 배정을 새로 올릴 때마다, 그동안 만든 임시 반("+"로 만든 빈 반)과
// 보강/신규/대체/샘플 등록을 정리함. 단기는 "지우기 전까지 계속 유지"가 원래 의도라 제외.
// 반 배정을 새로 올릴 때, "지난 날짜"의 임시 반("+"로 만든 빈 반)과
// 보강/신규/대체/샘플 등록만 정리함. 오늘·미래 날짜 것은 자주 업로드해도 안전하게 남김.
// 단기는 "지우기 전까지 계속 유지"가 원래 의도라 날짜와 무관하게 항상 제외.
async function clearStaleWeeklyData() {
  const todayISO = toISODate(new Date());
  const manualKeys = Object.keys(state.manualRooms).filter((k) => state.manualRooms[k].dateISO < todayISO);
  const additionKeys = Object.keys(state.additions).filter((k) => {
    const a = state.additions[k];
    return a.type !== "shortterm" && a.dateISO < todayISO;
  });
  const deletions = [];
  for (const k of manualKeys) {
    if (TEST_MODE) { delete localStore.manualRooms[k]; }
    else { deletions.push(deleteDoc(doc(db, "manualRooms", k))); }
    delete state.manualRooms[k];
  }
  for (const k of additionKeys) {
    if (TEST_MODE) { delete localStore.additions[k]; }
    else { deletions.push(deleteDoc(doc(db, "additions", k))); }
    delete state.additions[k];
  }
  if (deletions.length > 0) {
    try { await Promise.all(deletions); } catch (e) { console.error(e); }
  }
  return manualKeys.length + additionKeys.length;
}

function parseDateValue(v) {
  if (!v) return null;
  if (typeof v.toDate === "function") return v.toDate(); // Firestore Timestamp
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === "number") { // Excel serial date fallback
    const epoch = new Date(Date.UTC(1899, 11, 30));
    return new Date(epoch.getTime() + v * 86400000);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function enrollDurationLabel(dateVal) {
  const d = parseDateValue(dateVal);
  if (!d) return "";
  const now = new Date();
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) months -= 1;
  if (months < 0) months = 0;
  if (months < 1) return "1개월 미만";
  if (months < 12) return `${months}개월`;
  const years = Math.floor(months / 12);
  const rem = months % 12;
  return rem === 0 ? `${years}년` : `${years}년${rem}개월`;
}

function buildStudentsIndex() {
  const map = new Map();
  for (const row of state.roster) {
    const key = makeKey(row.phone, row.name);
    const cls = parseClassField(row.classField);
    if (!map.has(key)) map.set(key, { key, name: row.name, phone: row.phone, age: row.age, center: row.center, status: row.status, classes: [], parseFailed: [], registeredAt: row.registeredAt || null, startDate: row.startDate || null, sessionsLeft: row.sessionsLeft, _latestDate: parseDateValue(row.registeredAt) });
    const entry = map.get(key);
    if (row.status) entry.status = row.status;
    if (row.registeredAt) {
      const cur = parseDateValue(entry.registeredAt);
      const rowDate = parseDateValue(row.registeredAt);
      if (rowDate && (!cur || rowDate < cur)) entry.registeredAt = row.registeredAt;
      if (rowDate && (!entry._latestDate || rowDate >= entry._latestDate)) {
        entry._latestDate = rowDate;
        entry.sessionsLeft = row.sessionsLeft;
        entry.startDate = row.startDate || entry.startDate;
        entry.status = row.status || entry.status;
      }
    }
    if (cls) {
      if (!entry.classes.find((c) => c.day === cls.day && c.time === cls.time && c.classNo === cls.classNo)) entry.classes.push(cls);
    } else if (row.classField && !entry.parseFailed.includes(row.classField)) {
      entry.parseFailed.push(row.classField);
    }
  }
  return map;
}

const IMPORT_STATUS_KEYWORDS = ["해외단기", "보강", "연장", "대체", "재", "트", "신", "IN", "OUT", "결"];
const IMPORT_CASE_INSENSITIVE_KEYWORDS = new Set(["IN", "OUT"]);
const IMPORT_STUDENT_START_RE = /[가-힣]{2,4}[A-Z]?\d{1,2}/g;
const IMPORT_MULTICHAR_KEYWORDS = new Set(["대체", "보강", "해외단기", "연장"]);

// SheetJS의 cell.r(rich text XML)을 {text, color}[] 로 분해
function importParseRichRuns(richXml, fallbackPlainText) {
  if (!richXml) return [{ text: fallbackPlainText || "", color: null }];
  const runs = [];
  const runRe = /<r>([\s\S]*?)<\/r>/g;
  let m;
  while ((m = runRe.exec(richXml))) {
    const block = m[1];
    const textMatch = block.match(/<t[^>]*>([\s\S]*?)<\/t>/);
    if (!textMatch) continue;
    const text = textMatch[1];
    const colorMatch = block.match(/<color rgb="([0-9A-Fa-f]{8})"/);
    const color = colorMatch ? colorMatch[1].slice(2).toUpperCase() : null;
    runs.push({ text, color });
  }
  return runs.length ? runs : [{ text: fallbackPlainText || "", color: null }];
}
function importFlattenRuns(runs) {
  let text = "";
  const colorAt = [];
  for (const r of runs) { for (const ch of r.text) { text += ch; colorAt.push(r.color); } }
  return { text, colorAt };
}
function importDominantColor(colorAt, start, end) {
  const counts = {};
  for (let i = start; i < end; i++) { const c = colorAt[i]; if (c) counts[c] = (counts[c] || 0) + 1; }
  let best = null, bestCount = 0;
  for (const [c, n] of Object.entries(counts)) { if (n > bestCount) { best = c; bestCount = n; } }
  return best;
}
function importParseDates(text) {
  const results = [];
  const patterns = [/(\d{1,2})\s*월\s*(\d{1,2})\s*일/g, /(\d{1,2})[\/\.\-](\d{1,2})/g, /\b(\d{2})(\d{2})\b/g];
  for (const re of patterns) {
    let m; let found = false;
    const r = new RegExp(re);
    while ((m = r.exec(text))) { found = true; results.push({ month: parseInt(m[1], 10), day: parseInt(m[2], 10) }); }
    if (found) break;
  }
  return results;
}
function importSplitStudentSegments(maskedText) {
  const starts = [];
  let m;
  const re = new RegExp(IMPORT_STUDENT_START_RE);
  while ((m = re.exec(maskedText))) {
    const nameOnly = m[0].match(/^[가-힣]{2,4}/)[0];
    if (IMPORT_MULTICHAR_KEYWORDS.has(nameOnly)) continue;
    const before = maskedText.slice(Math.max(0, m.index - 3), m.index);
    starts.push({ idx: m.index, hasHyuPrefix: /휴\)\s*$/.test(before) });
  }
  if (starts.length === 0) return [];
  const segments = [];
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i].idx;
    const end = i + 1 < starts.length ? starts[i + 1].idx : maskedText.length;
    segments.push({ text: maskedText.slice(start, end), start, end, hasHyuPrefix: starts[i].hasHyuPrefix });
  }
  return segments;
}
function importFindKeywordOccurrences(rest) {
  const occurrences = [];
  for (const kw of IMPORT_STATUS_KEYWORDS) {
    const haystack = IMPORT_CASE_INSENSITIVE_KEYWORDS.has(kw) ? rest.toUpperCase() : rest;
    const needle = IMPORT_CASE_INSENSITIVE_KEYWORDS.has(kw) ? kw.toUpperCase() : kw;
    let idx = 0;
    while ((idx = haystack.indexOf(needle, idx)) !== -1) { occurrences.push({ kw, idx }); idx += needle.length; }
  }
  occurrences.sort((a, b) => a.idx - b.idx || b.kw.length - a.kw.length);
  const filtered = [];
  for (const occ of occurrences) {
    const overlaps = filtered.some((f) => occ.idx >= f.idx && occ.idx < f.idx + f.kw.length);
    if (!overlaps) filtered.push(occ);
  }
  filtered.sort((a, b) => a.idx - b.idx);
  return filtered;
}
// 셀 하나(rich text) -> 학생별 {name, age, statuses[], excluded}
function importParseCell(richXml, plainText) {
  const runs = importParseRichRuns(richXml, plainText);
  return importParseCellFromRuns(runs);
}

// 브라우저 클립보드로 붙여넣은 HTML(엑셀에서 복사한 셀)을 {text, color}[] 런 배열로 분해
// 붙여넣은 HTML 안의 <style> 블록에서 클래스별 색상 매핑을 뽑아냄 (엑셀은 글자마다 직접 색을 안 붙이고
// class="font5" 같은 걸 붙이고, 그 클래스의 색은 <style> 블록에 따로 정의해두는 경우가 많음)
function importExtractClassColorMap(htmlFragment) {
  const map = {};
  const styleRe = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  let sm;
  while ((sm = styleRe.exec(htmlFragment))) {
    const css = sm[1];
    const ruleRe = /\.([\w-]+)\s*\{([^}]*)\}/g;
    let rm;
    while ((rm = ruleRe.exec(css))) {
      const className = rm[1];
      const body = rm[2];
      const colorMatch = body.match(/(?:^|[^-])color\s*:\s*#?([0-9A-Fa-f]{6})/);
      if (colorMatch) map[className] = colorMatch[1].toUpperCase();
    }
  }
  return map;
}
function importParseRunsFromHtmlNode(node, classColorMap) {
  const runs = [];
  function colorFromStyle(el) {
    const style = el.getAttribute && el.getAttribute("style");
    if (style) {
      const m = style.match(/(?:^|[;\s])color\s*:\s*#?([0-9A-Fa-f]{6})/) || style.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if (m) {
        if (m.length === 2) return m[1].toUpperCase();
        const [, r, g, b] = m;
        return [r, g, b].map((n) => parseInt(n, 10).toString(16).padStart(2, "0")).join("").toUpperCase();
      }
    }
    const fontColor = el.getAttribute && el.getAttribute("color");
    if (fontColor) return fontColor.replace("#", "").toUpperCase();
    // 인라인 색이 없으면, class="font5" 같은 클래스에 <style> 블록에서 정의된 색이 있는지 확인
    const classAttr = el.getAttribute && el.getAttribute("class");
    if (classAttr && classColorMap) {
      for (const cls of classAttr.split(/\s+/)) { if (classColorMap[cls]) return classColorMap[cls]; }
    }
    // 위 방법으로도 못 찾았고, 이 요소가 실제 화면(DOM)에 붙어있는 상태면 브라우저가 최종
    // 계산한 색상을 그대로 신뢰함 (엑셀이 색을 넣는 방식이 다양해서 이게 제일 안전함)
    if (el.isConnected && window.getComputedStyle) {
      try {
        const computed = window.getComputedStyle(el).color;
        const m2 = computed && computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (m2 && !(m2[1] === "0" && m2[2] === "0" && m2[3] === "0")) {
          return [m2[1], m2[2], m2[3]].map((n) => parseInt(n, 10).toString(16).padStart(2, "0")).join("").toUpperCase();
        }
      } catch (e) { /* 무시 */ }
    }
    return null;
  }
  function walk(n, inheritedColor) {
    if (n.nodeType === 3) { // 텍스트 노드
      if (n.textContent) runs.push({ text: n.textContent, color: inheritedColor });
      return;
    }
    if (n.nodeType !== 1) return;
    const myColor = colorFromStyle(n) || inheritedColor;
    for (const child of n.childNodes) walk(child, myColor);
  }
  walk(node, null);
  return runs;
}
// 붙여넣은 셀 하나(HTML 조각) -> 학생별 파싱 결과
function importParseCellFromHtml(htmlFragment, classColorMap) {
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "position:fixed;top:-9999px;left:-9999px;visibility:hidden;pointer-events:none;";
  wrapper.innerHTML = htmlFragment;
  document.body.appendChild(wrapper);
  let runs;
  try {
    runs = importParseRunsFromHtmlNode(wrapper, classColorMap);
  } finally {
    document.body.removeChild(wrapper);
  }
  return importParseCellFromRuns(runs);
}

function importParseCellFromRuns(runs) {
  const { text, colorAt } = importFlattenRuns(runs);
  const maskedText = text.replace(/\(\s*\d+\s*\)/g, (m) => " ".repeat(m.length)); // 숫자만 있는 괄호는 무시

  const segments = importSplitStudentSegments(maskedText);
  const results = [];
  for (const seg of segments) {
    const headMatch = seg.text.match(/^([가-힣]{2,4})([A-Z])?(\d{1,2})/);
    if (!headMatch) continue;
    const [, name, letter, age] = headMatch;
    const displayName = name + (letter || "");
    const restStart = seg.start + headMatch[0].length;
    const rest = maskedText.slice(restStart, seg.end);

    const nameColor = importDominantColor(colorAt, seg.start, seg.start + headMatch[0].length);

    const filtered = importFindKeywordOccurrences(rest);
    const statuses = [];
    if (seg.hasHyuPrefix && filtered.length === 0) {
      const dates = importParseDates(rest);
      if (dates.length) statuses.push({ keyword: "보강(휴원복귀)", type: "makeup", kind: "addition", dates, uncertain: /\?/.test(rest), source: "휴)규칙" });
    }
    for (let i = 0; i < filtered.length; i++) {
      const { kw, idx } = filtered[i];
      const segStart = restStart + idx + kw.length;
      const segEndAbs = i + 1 < filtered.length ? restStart + filtered[i + 1].idx : seg.end;
      const dateTextRaw = maskedText.slice(segStart, segEndAbs);
      const hasQuestion = /\?/.test(dateTextRaw);
      const dateText = dateTextRaw.replace(/\?/g, "").trim();
      const dates = importParseDates(dateText);
      const meta = IMPORT_STATUS_MAP[kw];
      if (meta.kind === "exclude") continue; // 연장 등: 무시
      statuses.push({ keyword: kw, type: meta.type, kind: meta.kind, dates, uncertain: hasQuestion, source: "키워드" });
    }
    if (statuses.length === 0 && !seg.hasHyuPrefix) {
      const bareDates = importParseDates(rest);
      if (bareDates.length) {
        const dateColor = importDominantColor(colorAt, restStart, seg.end);
        const colorMeta = dateColor && IMPORT_COLOR_STATUS[dateColor];
        if (colorMeta && colorMeta.kind !== "exclude" && colorMeta.type !== "moveInOrOut") {
          statuses.push({ keyword: `(색상:${colorMeta.label})`, type: colorMeta.type, kind: colorMeta.kind, dates: bareDates, uncertain: /\?/.test(rest), source: "색상" });
        }
      }
    }
    // 키워드로도 색상으로도 아무 상태가 안 잡혔는데, 이름 자체가 핑크/빨강이면 현재 상태가 있는 학생임.
    // 핑크 = 휴원중(다시 돌아올 예정), 빨강 = 퇴원중. 조용히 건너뛰지 않고 명확히 등록해서 미리보기에서 확인 가능하게 함
    // (이름 빨강 + 뒤에 다른 색 날짜가 붙어서 위에서 이미 보강 등으로 잡힌 경우는 여기 안 옴 = 그 날짜에 보강하러 오는 것)
    if (statuses.length === 0 && (nameColor === "FF66FF" || nameColor === "FF0000")) {
      statuses.push(nameColor === "FF66FF"
        ? { keyword: "(색상:휴원중-핑크)", type: "leave", kind: "override", dates: [], uncertain: false, source: "이름색상", impliedTarget: true }
        : { keyword: "(색상:퇴원-빨강)", type: "withdrawn", kind: "override", dates: [], uncertain: false, source: "이름색상", impliedTarget: true });
    }
    results.push({ name: displayName, age, statuses, excluded: false });
  }
  return results;
}
function importMatchesTarget(dates, targetMonth, targetDay) {
  return dates.some((d) => d.month === targetMonth && d.day === targetDay);
}

// 평촌 스케줄 원본 시트에서 요일별 (선생님열, 학생열) 쌍
const IMPORT_DAY_COLUMNS = { "화": ["B", "C"], "수": ["D", "E"], "목": ["F", "G"], "금": ["H", "I"], "토": ["J", "K"] };
// 이 요일에 실제로 있는 시간대들 (원의 정규 시간표와 다를 수 있어 이 기능 전용으로 따로 관리)
const IMPORT_DAY_TIMES = {
  "화": ["13:30", "15:10", "16:50", "18:30"],
  "수": ["13:30", "15:10", "16:50", "18:30"],
  "목": ["13:30", "15:10", "16:50", "18:30"],
  "금": ["13:30", "15:10", "16:50"], // 금요일은 마지막 타임(18:30)이 없음
  "토": ["09:20", "11:00", "13:30", "15:10", "16:50"],
};
// 지금 업로드된 반 배정에 실제로 존재하는 교실 수(=한 시간대당 줄 수). 평촌/반포=6, 대치=5 등 원마다 다름
function importRoomCount() {
  const n = getKnownClassrooms().length;
  return n > 0 ? n : 6;
}

function colToIndex(col) { return col.charCodeAt(0) - 64; } // A=1

// 엑셀 시간 형식("9:20","1:30" 등)을 그 요일의 정규 시간표(FIXED_TIME_TEMPLATE)와 대조해서 24시간제로 정확히 맞춤
function importNormalizeTime(rawHM, dayLetter) {
  const [h, m] = rawHM.split(":").map((x) => parseInt(x, 10));
  const candidates = [`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`, `${String(h + 12).padStart(2, "0")}:${String(m).padStart(2, "0")}`];
  const template = getTemplateTimesForDay(dayLetter);
  for (const c of candidates) { if (template.includes(c)) return c; }
  return candidates[0]; // 템플릿에 없으면 원본 그대로(수동 확인 필요하게 미리보기에서 표시)
}

// 그 요일+시간에 그 선생님이 맡은 반 번호를 현재 반배정에서 찾음. 모호하거나 없으면 null
function findClassNoForTeacherTime(teacher, dayLetter, time) {
  const found = new Set();
  for (const row of state.roster) {
    const cls = parseClassField(row.classField);
    if (cls && cls.teacher === teacher && cls.day === dayLetter && cls.time === time) found.add(cls.classNo);
  }
  if (found.size === 1) return Array.from(found)[0];
  return null;
}

// 이름(및 구분알파벳)으로 현재 DB에서 학생을 찾음. 정확히 1명 매칭되면 그 학생, 아니면 null(모호/없음)
function findStudentByDisplayName(displayName) {
  const idx = buildStudentsIndex();
  const exact = Array.from(idx.values()).filter((s) => s.name === displayName);
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return null; // 동명이인 모호
  return null;
}
// 이 학생이 이미 그 반(요일+시간+반번호)에 정규생으로 등록되어 있는지 확인 (중복 등록 방지용)
function isAlreadyRegularInClass(studentKey, dayLetter, time, classNo) {
  const studentsIndex = buildStudentsIndex();
  const student = studentsIndex.get(studentKey);
  if (!student) return false;
  return student.classes.some((c) => c.day === dayLetter && c.time === time && c.classNo === classNo);
}

// 엑셀 파일(File) -> 파싱된 스테이징 항목 배열
async function parseScheduleImportFile(file, targetDateISO) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellStyles: true, cellHTML: true });
  const wsName = wb.SheetNames.includes("01정규") ? "01정규" : (wb.SheetNames.includes("Sheet1") ? "Sheet1" : wb.SheetNames[0]);
  const ws = wb.Sheets[wsName];
  const range = XLSX.utils.decode_range(ws["!ref"]);

  const dateObj = new Date(targetDateISO + "T00:00:00");
  const dayLetter = KOREAN_BY_JSDAY[dateObj.getDay()];
  const targetMonth = dateObj.getMonth() + 1;
  const targetDay = dateObj.getDate();
  const cols = IMPORT_DAY_COLUMNS[dayLetter];
  if (!cols) return { error: `${dayLetter}요일은 이 원본 파일에서 지원하지 않아요 (화/수/목/금/토만 가능).`, entries: [] };
  const teacherColIdx = colToIndex(cols[0]);
  const studentColIdx = colToIndex(cols[1]);

  const entries = [];
  let currentTimeRaw = null;
  for (let r = range.s.row; r <= range.e.row; r++) {
    const timeCellAddr = XLSX.utils.encode_cell({ r, c: 0 }); // A열
    const timeCell = ws[timeCellAddr];
    if (timeCell && timeCell.w && /^\d{1,2}:\d{2}$/.test(timeCell.w.trim())) {
      currentTimeRaw = timeCell.w.trim();
    }
    if (!currentTimeRaw) continue;

    const teacherAddr = XLSX.utils.encode_cell({ r, c: teacherColIdx - 1 });
    const teacherCell = ws[teacherAddr];
    const teacher = teacherCell && typeof teacherCell.v === "string" ? teacherCell.v.trim() : "";
    if (!teacher || teacher === "신규" || teacher === "메모" || teacher === "체크" || /요일/.test(teacher)) continue;

    const studentAddr = XLSX.utils.encode_cell({ r, c: studentColIdx - 1 });
    const studentCell = ws[studentAddr];
    if (!studentCell || !studentCell.v) continue;

    const time24 = importNormalizeTime(currentTimeRaw, dayLetter);
    const parsedStudents = importParseCell(studentCell.r, String(studentCell.v));

    for (const ps of parsedStudents) {
      if (ps.excluded) continue;
      const applicable = ps.statuses.filter((s) => !s.uncertain && (s.impliedTarget || importMatchesTarget(s.dates, targetMonth, targetDay)));
      if (applicable.length === 0) continue;
      for (const st of applicable) {
        const displayName = ps.name;
        const matched = findStudentByDisplayName(displayName);
        const classNo = st.kind === "addition" ? findClassNoForTeacherTime(teacher, dayLetter, time24) : null;
        const alreadyRegular = st.kind === "addition" && matched && classNo && isAlreadyRegularInClass(matched.key, dayLetter, time24, classNo);
        entries.push({
          id: `${teacher}_${time24}_${displayName}_${st.type}_${Math.random().toString(36).slice(2, 7)}`,
          name: displayName, age: ps.age, teacher, time: time24, day: dayLetter, classNo,
          kind: st.kind, type: st.type, keywordSource: st.keyword,
          matchedKey: matched ? matched.key : null, matchedPhone: matched ? matched.phone : null,
          manualPhone: "", include: !alreadyRegular, alreadyRegular,
        });
      }
    }
  }
  return { error: null, entries, dayLetter, targetDateISO };
}

// 엑셀에서 "선생님+학생" 열만 복사해서 붙여넣은 내용(HTML) -> 스테이징 항목 배열
// 시간 열이 없으므로 time은 사용자가 직접 고른 값을 그대로 씀
function parseScheduleImportPaste(html, plainText, targetDateISO, dayLetter) {
  const dateObj = new Date(targetDateISO + "T00:00:00");
  const targetMonth = dateObj.getMonth() + 1;
  const targetDay = dateObj.getDate();
  const roomCount = importRoomCount();
  const times = IMPORT_DAY_TIMES[dayLetter] || [];

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html || "";
  const classColorMap = importExtractClassColorMap(html || "");
  const styleBlockMatch = (html || "").match(/<style[\s\S]*?<\/style>/i);
  const styleBlockHtml = styleBlockMatch ? styleBlockMatch[0] : "";
  let rowPairs = []; // [teacherText, studentHtml][] - 붙여넣은 순서 그대로, 신규/메모 줄도 포함해서 자리를 유지해야 시간 계산이 맞음
  const trs = Array.from(wrapper.querySelectorAll("tr"));
  if (trs.length > 0) {
    for (const tr of trs) {
      const cells = Array.from(tr.querySelectorAll("td,th"));
      if (cells.length < 2) continue;
      rowPairs.push([cells[0].textContent.trim(), cells[1].innerHTML]);
    }
  } else if (plainText && plainText.includes("\t")) {
    for (const line of plainText.split(/\r?\n/)) {
      const parts = line.split("\t");
      if (parts.length < 2) continue;
      rowPairs.push([parts[0].trim(), esc(parts.slice(1).join(" "))]);
    }
  }

  const entries = [];
  let skippedNoTime = 0;
  rowPairs.forEach(([teacherRaw, studentHtml], i) => {
    const timeSlotIndex = Math.floor(i / roomCount);
    const time = times[timeSlotIndex];
    if (!time) { skippedNoTime++; return; } // 예상 시간대 개수를 넘어가는 줄 (붙여넣기 범위 확인 필요)
    if (!teacherRaw || teacherRaw === "신규" || teacherRaw === "메모" || teacherRaw === "체크" || /요일/.test(teacherRaw)) return;

    // 선생님 이름 앞에 반 번호가 붙어있으면("3.김민석", "3번 김민석" 등) 그걸 그대로 반 번호로 씀
    const prefixMatch = teacherRaw.match(/^(\d+)\s*[.\번]?\s*(.+)$/);
    const classNoFromPrefix = prefixMatch ? prefixMatch[1] : null;
    const teacher = prefixMatch ? prefixMatch[2].trim() : teacherRaw;

    const parsedStudents = importParseCellFromHtml(styleBlockHtml + studentHtml, classColorMap);
    for (const ps of parsedStudents) {
      if (ps.excluded) continue;
      const applicable = ps.statuses.filter((s) => !s.uncertain && (s.impliedTarget || importMatchesTarget(s.dates, targetMonth, targetDay)));
      for (const st of applicable) {
        const matched = findStudentByDisplayName(ps.name);
        const classNo = st.kind === "addition" ? (classNoFromPrefix || findClassNoForTeacherTime(teacher, dayLetter, time)) : null;
        const alreadyRegular = st.kind === "addition" && matched && classNo && isAlreadyRegularInClass(matched.key, dayLetter, time, classNo);
        entries.push({
          id: `${teacher}_${time}_${ps.name}_${st.type}_${Math.random().toString(36).slice(2, 7)}`,
          name: ps.name, age: ps.age, teacher, time, day: dayLetter, classNo,
          kind: st.kind, type: st.type, keywordSource: st.keyword,
          matchedKey: matched ? matched.key : null, matchedPhone: matched ? matched.phone : null,
          manualPhone: "", include: !alreadyRegular, alreadyRegular,
        });
      }
    }
  });
  return { entries, skippedNoTime, totalRows: rowPairs.length, roomCount, expectedRows: roomCount * times.length };
}

const OVERRIDE_META = {
  absent: { label: "결석", badge: "결석", color: "var(--danger)", border: "3px solid var(--danger)", circle: "🔴" },

function countAttType(logs, type) {
  return (logs || []).filter((l) => l.type === type).length;

function computeRemainingMakeup(att) {
  const logs = att.logs || [];
  const absent = countAttType(logs, "absent");

/* ============================================================
   보강 예약 관리 (관리자 쪽) — 학부모용 예약 페이지는 별도의
   Cloud Function을 통해서만 이 데이터에 쓰기를 하며(직접 Firestore
   접근 없음), 여기서는 관리자가 보강 자리를 열고/닫고/정책을
   설정하는 부분만 다룸.
   ============================================================ */
function defaultBookingSettings() {
  return {
    configured: false,
    times: ["09:20", "11:00", "13:30", "15:10", "16:50", "18:30"],
    rooms: [1, 2, 3, 4, 5, 6],
    allowed: {}, // { "0"(일)~"6"(토): [허용 시간들] }
    weeklyLimit: 2,
    minimumLessons: 8,
    blockConsecutive: true,
    policies: [],
  };
}
function getBookingSettings() {
  return state.bookingSettings || defaultBookingSettings();
}
// 설정 화면의 "09:20, 11:00" / "1, 2, 3" 같은 쉼표 목록 문자열 -> 배열
function parseBookingTimesText(text) {
  return String(text || "").split(",").map((s) => s.trim()).filter(Boolean);
}
function parseBookingRoomsText(text) {
  return String(text || "").split(",").map((s) => s.trim()).filter(Boolean).map(Number).filter((n) => Number.isInteger(n));
}
function validateBookingSettings(s) {
  if (!s.times.length || new Set(s.times).size !== s.times.length || s.times.some((t) => !/^([01]\d|2[0-3]):[0-5]\d$/.test(t)))
    throw new Error("수업 시간은 09:20 형식으로, 중복 없이 입력해 주세요.");
  if (!s.rooms.length || new Set(s.rooms).size !== s.rooms.length || s.rooms.some((n) => !Number.isInteger(n) || n < 1))
    throw new Error("반(교실) 번호는 1 이상의 정수로, 중복 없이 입력해 주세요.");
  if (!Number.isInteger(s.weeklyLimit) || s.weeklyLimit < 1 || !Number.isInteger(s.minimumLessons) || s.minimumLessons < 0)
    throw new Error("주간 제한 횟수와 적응 기간(회차)을 다시 확인해 주세요.");
  if (!Object.values(s.allowed).some((a) => a.length))
    throw new Error("보강을 허용할 요일과 시간을 하나 이상 선택해 주세요.");
  if (!s.policies.length || s.policies.some((p) => !p.trim()))
    throw new Error("학부모에게 안내할 보강 규정을 최소 1개 이상 입력해 주세요.");
}
async function saveBookingSettings(draft) {
  const { timesText, roomsText, ...rest } = draft; // 입력창에 타이핑 중인 원문 문자열은 저장 대상이 아님
  const times = [...new Set(rest.times)].filter(Boolean);
  const s = {
    ...rest,
    times,
    rooms: [...new Set(rest.rooms)].filter((n) => Number.isInteger(n)),
    // 수업 시간 목록에서 지운 시간이 요일별 허용 시간에 남아있지 않게 정리
    allowed: Object.fromEntries(Object.entries(rest.allowed || {}).map(([day, list]) => [day, (list || []).filter((t) => times.includes(t))])),
    weeklyLimit: Number(rest.weeklyLimit),
    minimumLessons: Number(rest.minimumLessons),
    policies: rest.policies.filter((p) => p.trim()),
  };
  try {
    validateBookingSettings(s);
  } catch (e) {
    showToast(e.message, "error");
    return false;
  }
  const value = { ...s, configured: true, updateTime: new Date().toISOString(), updatedBy: currentUserLabel() };
  try {
    if (TEST_MODE) { localStore.bookingSettings = value; }
    else { await setDoc(doc(db, "bookingSettings", "current"), value); }
    state.bookingSettings = value;
    showToast("보강 예약 설정을 저장했어요");
    return true;
  } catch (e) {
    console.error(e);
    showToast("설정 저장에 실패했어요", "error");
    return false;
  }
}

function centerAllowsTime(settings, dateISO, time) {
  if (!settings.configured) return false;
  const day = new Date(dateISO + "T00:00:00").getDay();
  return (settings.allowed[String(day)] || []).includes(time);
}
function openingId(o) { return `opening_${o.date}_${o.time.replace(":", "")}_${o.roomNo}`; }

// 반(classNo) 문자열에서 숫자만 뽑아 반 번호로 씀 (반은 항상 "1반","2반"처럼 숫자로 되어 있음)
function parseRoomNo(classNo) {
  const m = String(classNo || "").match(/\d+/);
  return m ? Number(m[0]) : null;
}
const MAKEUP_ABSENT_TYPES = new Set(["absent", "sickLeave", "noshow", "moveOut", "leave", "withdrawn"]);

// 특정 날짜·시간·반에 "실제로 결석 등으로 생긴 빈자리"가 몇 개인지 계산.
// (관리자가 정원을 임의로 입력하는 게 아니라, 그날 실제 결석 수 - 이미 들어온 보강생 수로 자동 계산함)
function computeSlotVacancy(dateISO, dayLetter, time, roomNo, studentsIndex) {
  let absentCount = 0;
  const presentKeys = new Set();
  for (const entry of studentsIndex.values()) {
    const matches = entry.classes.some((c) => c.day === dayLetter && c.time === time && parseRoomNo(c.classNo) === roomNo);
    if (!matches) continue;
    const ov = state.overrides[`${dateISO}::${entry.key}`];
    if (ov && MAKEUP_ABSENT_TYPES.has(ov.type)) absentCount++;
    else presentKeys.add(entry.key);
  }
  let incomingCount = 0;
  for (const a of Object.values(state.additions)) {
    // 보강뿐 아니라 대체/반이동in/단기/신규/샘플로 들어온 인원도 실제로 자리를 차지하고 있으니 다 셈
    // (단, 보강인데 "보강결석"으로 표시된 경우는 실제로 안 왔다는 뜻이라 자리를 다시 비운 걸로 침)
    if (a.type === "makeup" && a.attendanceStatus === "absent") continue;
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate || a.time !== time || parseRoomNo(a.classNo) !== roomNo) continue;
    const k = a.studentKey || makeKey(a.phone, a.name);
    if (!presentKeys.has(k)) incomingCount++;
  }
  return Math.max(0, absentCount - incomingCount);
}

// 이 보강 자리에 지금 몇 명이 예약(등록)돼 있는지 — 별도 필드로 저장해두지 않고,
// additions 컬렉션을 그때그때 세어서 계산함 (저장된 숫자가 실제와 어긋나는 버그를 원천 차단).
// 취소는 이 앱에서 문서를 아예 지우는 방식(removeAddition)이라 "취소됨" 상태를 따로 걸러낼 필요 없음.
function computeBookedCount(o) {
  return Object.values(state.additions).filter((a) => a.type === "makeup" && a.dateISO === o.date && a.time === o.time && parseRoomNo(a.classNo) === o.roomNo).length;
}

// 이 (날짜,시간,반)에 실제로 배정된 학생들과 그날 상태를 반환 (정규생 + 보강 등으로 들어온 추가 인원)
function getSlotStudents(dateISO, dayLetter, time, roomNo, studentsIndex) {
  const list = [];
  const seen = new Set();
  for (const entry of studentsIndex.values()) {
    if (!entry.classes.some((c) => c.day === dayLetter && c.time === time && parseRoomNo(c.classNo) === roomNo)) continue;
    if (seen.has(entry.key)) continue;
    seen.add(entry.key);
    const ov = state.overrides[`${dateISO}::${entry.key}`];
    const status = ov && OVERRIDE_META[ov.type] ? OVERRIDE_META[ov.type].label : "출석 예정";
    list.push({ key: entry.key, name: entry.name, age: entry.age, phone: entry.phone, status, isProblem: !!(ov && MAKEUP_ABSENT_TYPES.has(ov.type)) });
  }
  for (const [docKey, a] of Object.entries(state.additions)) {
    if (parseRoomNo(a.classNo) !== roomNo) continue;
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate || a.time !== time) continue;
    const k = a.studentKey || makeKey(a.phone, a.name);
    if (seen.has(k)) continue;
    seen.add(k);
    const meta = TYPE_META[a.type] || { label: a.type || "추가" };
    const label = a.type === "makeup" && a.attendanceStatus === "absent" ? "보강결석" : meta.label;
    list.push({ key: k, name: a.name, age: a.age, phone: a.phone, status: label, isProblem: false, docKey, isBooking: a.type === "makeup", occupiesSeat: true });
  }
  return list;
}
function rosterBirthYearClient(age, uploadedAt) {
  if (age === null || age === undefined || String(age).trim() === "" || !uploadedAt) return null;
  const n = Number(age);
  if (!Number.isInteger(n) || n < 1 || n > 20) return null;
  return new Date(uploadedAt).getFullYear() - n - 2000;
}
// 연생 코드(예: 19)를 화면에 보여줄 나이로 역변환 (표시만 나이로, 내부 저장은 계속 연생 코드 그대로 씀)
function birthYearToAgeClient(birthYear, uploadedAt) {
  if (birthYear === null || birthYear === undefined || !uploadedAt) return null;
  return new Date(uploadedAt).getFullYear() - 2000 - birthYear;
}
function formatBirthYearsAsAges(birthYears, uploadedAt) {
  if (!birthYears || !birthYears.length) return "제한 없음";
  return birthYears
    .map((y) => birthYearToAgeClient(y, uploadedAt))
    .filter((a) => a !== null)
    .sort((a, b) => a - b)
    .map((a) => `${a}세`)
    .join(", ");
}
// 그 반의 "가장 어린 정규생" 기준으로 예약 가능 연생 3개를 추천 (직원분 로직과 동일한 방식)
function suggestedBirthYearsForSlot(dateISO, dayLetter, time, roomNo, studentsIndex) {
  const uploadedAt = state.rosterMeta ? state.rosterMeta.uploadedAt : 0;
  const years = [];
  for (const entry of studentsIndex.values()) {
    if (!entry.classes.some((c) => c.day === dayLetter && c.time === time && parseRoomNo(c.classNo) === roomNo)) continue;
    const ov = state.overrides[`${dateISO}::${entry.key}`];
    if (ov && ["withdrawn", "leave", "moveOut"].includes(ov.type)) continue;
    const y = rosterBirthYearClient(entry.age, uploadedAt);
    if (y !== null) years.push(y);
  }
  if (!years.length) return [];
  const youngest = Math.max(...years);
  return [youngest - 2, youngest - 1, youngest].filter((y) => y >= 13);
}

// 자동 보강 자리 열기 — 학생 나이 "평균"을 기준으로 앞뒤 범위(10세 미만은 ±1년, 10세 이상은 ±1.5년) 안의 연생을 전부 반환
const MAKEUP_MIN_AGE = 5; // 보강 예약 대상 연령 하한 (1~4세는 없음)
const MAKEUP_MAX_AGE = 15; // 보강 예약 대상 연령 상한

function computeAgeAverageBirthYears(dayLetter, time, roomNo, studentsIndex) {
  const uploadedAt = state.rosterMeta ? state.rosterMeta.uploadedAt : 0;
  const ages = [];
  for (const entry of studentsIndex.values()) {
    if (!entry.classes.some((c) => c.day === dayLetter && c.time === time && parseRoomNo(c.classNo) === roomNo)) continue;
    const n = Number(entry.age);
    if (Number.isFinite(n) && n > 0) ages.push(n);
  }
  if (!ages.length) return { avgAge: null, birthYears: [] };
  const avgAge = ages.reduce((a, b) => a + b, 0) / ages.length;
  const buffer = avgAge >= 10 ? 1.5 : 1;
  const minAge = Math.max(MAKEUP_MIN_AGE, Math.floor(avgAge - buffer));
  const maxAge = Math.min(MAKEUP_MAX_AGE, Math.ceil(avgAge + buffer));
  const birthYears = [];
  for (let age = minAge; age <= maxAge; age++) {
    const y = rosterBirthYearClient(age, uploadedAt);
    if (y !== null) birthYears.push(y);
  }
  return { avgAge, birthYears };
}


const AUTO_OPEN_FULL_SIZE = 4; // 한 반의 정원을 4명으로 가정
const AUTO_OPEN_SEATS_MAP = { 1: 2, 2: 1, 3: 1 }; // 그 시간에 실제 수업하는 인원 수 -> 자동으로 오픈할 보강 자리 수

// 그날 그 반의 "실제 인원"을 지정된 규칙대로 계산 (정규생/보강/대체/반이동in/신규 = +1, 결석/휴원 = -1)
function computeAutoOpenOccupancy(dateISO, dayLetter, time, roomNo, studentsIndex) {
  let occupied = 0;
  for (const entry of studentsIndex.values()) {
    if (!entry.classes.some((c) => c.day === dayLetter && c.time === time && parseRoomNo(c.classNo) === roomNo)) continue;
    const ov = state.overrides[`${dateISO}::${entry.key}`];
    if (ov && (ov.type === "absent" || ov.type === "leave")) occupied -= 1;
    else occupied += 1;
  }
  for (const a of Object.values(state.additions)) {
    if (!["makeup", "substitute", "moveIn", "newStudent"].includes(a.type)) continue; // 보강/대체/반이동in/신규만 +1 (샘플·단기는 제외)
    if (a.type === "makeup" && a.attendanceStatus === "absent") continue; // 보강결석(안 옴)은 자리 차지 안 함
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate || a.time !== time || parseRoomNo(a.classNo) !== roomNo) continue;
    occupied += 1;
  }
  return occupied;
}

function addDaysISOClient(dateISO, days) {
  const d = new Date(dateISO + "T00:00:00");
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

// 지정된 날짜 범위 전체를 훑어서, 자동으로 열면 좋을 보강 후보 목록을 만듦
function computeAutoOpenCandidates(startDate, endDate, studentsIndex) {
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const s = getBookingSettings();
  if (!s.configured || !startDate || !endDate || startDate > endDate) return [];
  const todayISO = toISODate(new Date());
  const candidates = [];
  for (let d = startDate; d <= endDate; d = addDaysISOClient(d, 1)) {
    if (d < todayISO) continue;
    const dayLetter = days[new Date(d + "T00:00:00").getDay()];
    const allowedTimes = new Set(s.allowed[String(new Date(d + "T00:00:00").getDay())] || []);
    for (const time of s.times) {
      if (!allowedTimes.has(time)) continue;
      if (Date.parse(`${d}T${time}:00+09:00`) <= Date.now()) continue;
      for (const roomNo of s.rooms) {
        const alreadyOpen = Object.values(state.makeupOpenings).some((o) => o.open && o.date === d && o.time === time && o.roomNo === roomNo);
        if (alreadyOpen) continue;
        const occupied = computeAutoOpenOccupancy(d, dayLetter, time, roomNo, studentsIndex);
        const remaining = AUTO_OPEN_FULL_SIZE - occupied;
        const seatsToOpen = AUTO_OPEN_SEATS_MAP[occupied] || 0;
        if (seatsToOpen <= 0) continue;
        const { avgAge, birthYears } = computeAgeAverageBirthYears(dayLetter, time, roomNo, studentsIndex);
        if (!birthYears.length) continue;
        candidates.push({ date: d, time, roomNo, occupied, remaining, seatsToOpen, avgAge, birthYears });
      }
    }
  }
  return candidates.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.roomNo - b.roomNo);
}

function computeOpeningCandidates(dateISO, studentsIndex) {
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const dayLetter = days[new Date(dateISO + "T00:00:00").getDay()];
  const s = getBookingSettings();
  if (!s.configured) return [];
  const allowedTimes = new Set(s.allowed[String(new Date(dateISO + "T00:00:00").getDay())] || []);
  const now = Date.now();
  const candidates = [];
  for (const time of s.times) {
    if (!allowedTimes.has(time)) continue;
    if (Date.parse(`${dateISO}T${time}:00+09:00`) <= now) continue; // 이미 시작한 수업은 후보에서 제외
    for (const roomNo of s.rooms) {
      const alreadyOpen = Object.values(state.makeupOpenings).some((o) => o.open && o.date === dateISO && o.time === time && o.roomNo === roomNo);
      if (alreadyOpen) continue;
      const vacancy = computeSlotVacancy(dateISO, dayLetter, time, roomNo, studentsIndex);
      if (vacancy > 0) candidates.push({ date: dateISO, time, roomNo, vacancy });
    }
  }
  return candidates.sort((a, b) => a.time.localeCompare(b.time) || a.roomNo - b.roomNo);
}

async function createOpening(o, birthYearsStr) {
  const capacity = Number(o.capacity);
  if (!Number.isInteger(capacity) || capacity < 1) { showToast("정원은 1 이상의 정수여야 해요", "error"); return; }
  const birthYears = String(birthYearsStr || "").split(",").map((s) => s.trim()).filter(Boolean).map(Number).filter((n) => Number.isInteger(n));
  const id = openingId(o);
  const value = { id, date: o.date, time: o.time, roomNo: Number(o.roomNo), birthYears, capacity, open: true, createdAt: Date.now(), updateTime: new Date().toISOString(), createdBy: currentUserLabel() };
  try {
    if (TEST_MODE) { localStore.makeupOpenings[id] = value; }
    else { await setDoc(doc(db, "makeupOpenings", id), value); }
    state.makeupOpenings[id] = value;
    showToast("보강 자리를 열었어요");
  } catch (e) {
    console.error(e);
    showToast("저장에 실패했어요", "error");
  }
}

function exportAllStudentsCounselingToExcel() {
  const idx = buildStudentsIndex();
  if (idx.size === 0) { showToast("반배정 명단이 없어요", "error"); return; }
  const rows = [];
  for (const entry of idx.values()) {
    const teacherInfo = [...new Set(entry.classes.map((cl) => cl.teacher))].join(", ");
    const classInfo = entry.classes.map((cl) => `${cl.classNo}(${cl.day} ${cl.time})`).join(", ");
    const records = (getCounseling(entry.key).records || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const content = records.map((r) => `[${r.date}] ${r.content}`).join("\n");
    rows.push({
      "교사정보": teacherInfo,
      "수업정보": classInfo,
      "학생이름": entry.name,
      "연락처": entry.phone,

  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 14 }, { wch: 20 }, { wch: 10 }, { wch: 14 }, { wch: 60 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "전체명단 상담내용");
  XLSX.writeFile(wb, `전체명단_상담내용_${toISODate(new Date())}.xlsx`);
}

// 특정 날짜에 기록된 상담 내역을 전부 모아 사람이 읽기 좋은 텍스트로 만듦 (일일보고와 비슷한 용도)
function buildCounselingDayText(dateISO) {
  const idx = buildStudentsIndex();
  const items = [];
  for (const [key, c] of Object.entries(state.counseling)) {
    for (const r of (c.records || [])) {
      if (r.date !== dateISO) continue;
      const entry = idx.get(key);
      items.push({
        name: entry ? entry.name : (key.split("__").slice(1).join("__") || key),
        age: entry ? entry.age || "" : "",
        classInfo: entry ? entry.classes.map((cl) => cl.classNo).join(", ") : "",
        teacherInfo: entry ? [...new Set(entry.classes.map((cl) => cl.teacher))].join(", ") : "",
        content: r.content,
        createdAt: r.createdAt || 0,
      });
    }
  }
  items.sort((a, b) => a.createdAt - b.createdAt);
  const d = new Date(dateISO);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const header = `${d.getMonth() + 1}월 ${d.getDate()}일(${days[d.getDay()]}) 상담 내역 (총 ${items.length}명)`;
  if (items.length === 0) return `${header}\n\n그날 등록된 상담 기록이 없어요.`;
  const body = items.map((it) => {
    const meta = [it.age ? `${it.age}세` : "", it.classInfo, it.teacherInfo].filter(Boolean).join(" · ");
    return `■ ${it.name}${meta ? ` (${meta})` : ""}\n${it.content}`;
  }).join("\n\n");
  return `${header}\n\n${body}`;
}

// 전체 학생의 상담 기록을 엑셀 한 장으로 내보냄 (교사정보/수업정보는 반배정 엑셀 기준 현재 배정을 사용)
function exportCounselingToExcel() {
  const idx = buildStudentsIndex();
  const rows = [];
  for (const [key, c] of Object.entries(state.counseling)) {
    const records = (c.records || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    if (records.length === 0) continue;
    const entry = idx.get(key);
    let name, phone;
    if (entry) { name = entry.name; phone = entry.phone; }
    else { const [p, ...rest] = key.split("__"); phone = p || ""; name = rest.join("__") || ""; }
    const teacherInfo = entry ? [...new Set(entry.classes.map((cl) => cl.teacher))].join(", ") : "";
    const classInfo = entry ? entry.classes.map((cl) => `${cl.classNo}(${cl.day} ${cl.time})`).join(", ") : "";
    for (const r of records) {
      rows.push({
        "교사정보": teacherInfo,
        "수업정보": classInfo,
        "학생이름": name,
        "연락처": phone,
        "상담일자": r.date,
        "상담내용": r.content,
      });
    }
  }
  if (rows.length === 0) { showToast("내보낼 상담 기록이 없어요", "error"); return; }
  const ws = XLSX.utils.json_to_sheet(rows);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "상담기록");
  XLSX.writeFile(wb, `상담기록_${toISODate(new Date())}.xlsx`);

// 학생의 전화번호(또는 이름)가 바뀌어 기록의 키(전화번호__이름)가 달라진 경우,
// 옛 키의 출결·상담 기록과 사진을 새 키로 합쳐주는 도구. 출결은 같은 날짜(+계열)가 겹치면 새 키 쪽을 우선함.
function computeKeyMigrationPreview(m) {
  const oldKey = makeKey(m.oldPhone, m.oldName);
  const newKey = makeKey(m.newPhone, m.newName);
  const oldAtt = state.attendance[oldKey] || null;
  const newAtt = state.attendance[newKey] || null;
  const oldCounseling = state.counseling[oldKey] || null;
  const newCounseling = state.counseling[newKey] || null;
  const { oldPhotoKey, oldPhoto, newPhotoExists } = resolveMigrationPhotos(m, newKey);
  return {
    oldKey, newKey,
    sameKey: oldKey === newKey,
    oldAttExists: !!oldAtt,
    oldLogCount: oldAtt ? (oldAtt.logs || []).length : 0,
    newLogCount: newAtt ? (newAtt.logs || []).length : 0,
    oldCounselingExists: !!oldCounseling,
    oldCounselingCount: oldCounseling ? (oldCounseling.records || []).length : 0,
    newCounselingCount: newCounseling ? (newCounseling.records || []).length : 0,
    oldPhotoExists: !!oldPhoto,
    newPhotoExists,
    oldExists: !!(oldAtt || oldCounseling || oldPhoto),
  };
}
// 사진 문서는 정확한 키가 아니라 "전화번호+알파벳 뗀 이름" 별칭 키로 연결돼 있을 수 있어서(resolvePhotoKey), 그 규칙으로 찾음.
// 옛 정보와 새 정보가 이미 같은 사진 문서를 가리키면(예: 이름 뒤 구분 알파벳만 바뀜) 옮길 게 없는 것으로 봄
function resolveMigrationPhotos(m, newKey) {
  const oldPhotoKey = resolvePhotoKey(m.oldPhone, m.oldName);
  const newPhotoKey = resolvePhotoKey(m.newPhone, m.newName);
  const shared = oldPhotoKey === newPhotoKey;
  const oldPhoto = !shared && state.photos[oldPhotoKey] ? state.photos[oldPhotoKey] : null;
  const newPhotoExists = !!state.photos[newPhotoKey];
  return { oldPhotoKey, oldPhoto, newPhotoKey, newPhotoExists };
}

async function executeKeyMigration(m) {
  const oldKey = makeKey(m.oldPhone, m.oldName);
  const newKey = makeKey(m.newPhone, m.newName);
  if (oldKey === newKey) { showToast("옛 정보와 새 정보가 같아요. 바뀐 전화번호/이름을 다시 확인해 주세요.", "error"); return; }
  const oldAtt = state.attendance[oldKey] || null;
  const oldCounseling = state.counseling[oldKey] || null;
  const { oldPhotoKey, oldPhoto, newPhotoExists } = resolveMigrationPhotos(m, newKey);
  if (!oldAtt && !oldCounseling && !oldPhoto) { showToast("옛 전화번호·이름으로 된 기록(출결·상담·사진)을 찾지 못했어요.", "error"); return; }

  try {
    const movedLogs = oldAtt ? await migrateAttendanceToKey(oldAtt, oldKey, newKey) : 0;
    const movedCounseling = oldCounseling ? await migrateCounselingToKey(oldCounseling, oldKey, newKey) : 0;
    const movedPhoto = oldPhoto ? await migratePhotoToKey(oldPhoto, oldPhotoKey, newKey, newPhotoExists, m.newName.trim(), m.newPhone.trim()) : false;
    const parts = [];
    if (oldAtt) parts.push(`출결 ${movedLogs}건`);
    if (oldCounseling) parts.push(`상담 ${movedCounseling}건`);
    if (oldPhoto) parts.push(movedPhoto ? "사진" : "사진(새 정보 쪽 사진 유지)");
    showToast(`${parts.join(" · ")}을 새 정보로 옮겼어요`);
    state.keyMigration = null;
    render();
  } catch (e) {
    console.error(e);
    showToast("이전 작업에 실패했어요", "error");
  }
}

// 옛 키의 출결 문서를 새 키 문서와 합쳐 저장하고 옛 문서는 지움. 옮긴 옛 로그 수를 돌려줌
async function migrateAttendanceToKey(oldAtt, oldKey, newKey) {
  const newAtt = state.attendance[newKey] || defaultAttendance();

  // 새 키(현재 사용 중인 쪽) 로그를 기준으로, 옛 키 로그 중 "같은 로그"(attLogMatches 기준: 같은 날짜·계열, 보강은 시간까지)가
  // 새 쪽에 없는 것만 가져옴. 같은 날짜라도 결석 계열과 보강 계열은 서로 다른 기록이라 둘 다 남김
  const newLogs = [...(newAtt.logs || [])];
  const oldOnly = (oldAtt.logs || []).filter((o) => !newLogs.some((n) => attLogMatches(n, o.date, attLogFamily(o.type), o.time || null)));
  const mergedLogs = [...newLogs, ...oldOnly];

  // 연도별 마감 보관함(archives)도 옛 키에만 있는 연도가 있으면 가져옴
  const mergedArchives = { ...(oldAtt.archives || {}), ...(newAtt.archives || {}) };

  const merged = {
    logs: mergedLogs,
    lastYearRemaining: newAtt.lastYearRemaining || oldAtt.lastYearRemaining || 0,
    adminAdjustment: newAtt.adminAdjustment || oldAtt.adminAdjustment || 0,
    memo: newAtt.memo || oldAtt.memo || "",
    archives: mergedArchives,
  };

  if (TEST_MODE) { localStore.attendance[newKey] = merged; }
  else { await setDoc(doc(db, "attendance", newKey), merged); }
  state.attendance[newKey] = merged;
  if (TEST_MODE) { delete localStore.attendance[oldKey]; }
  else { await deleteDoc(doc(db, "attendance", oldKey)); }
  delete state.attendance[oldKey];
  return (oldAtt.logs || []).length;
}

// 옛 키의 상담 기록을 새 키 기록 뒤에 이어붙여 저장하고(같은 id는 한 번만) 옛 문서는 지움. 옮긴 기록 수를 돌려줌
async function migrateCounselingToKey(oldCounseling, oldKey, newKey) {
  const newRecords = (state.counseling[newKey] && state.counseling[newKey].records) || [];
  const seenIds = new Set(newRecords.map((r) => r.id));
  const oldRecords = (oldCounseling.records || []).filter((r) => !seenIds.has(r.id));
  const merged = { records: [...newRecords, ...oldRecords] };
  if (TEST_MODE) { localStore.counseling[newKey] = merged; }
  else { await setDoc(doc(db, "counseling", newKey), merged); }
  state.counseling[newKey] = merged;
  if (TEST_MODE) { delete localStore.counseling[oldKey]; }
  else { await deleteDoc(doc(db, "counseling", oldKey)); }
  delete state.counseling[oldKey];
  return oldRecords.length;
}

// 옛 사진 문서(oldPhotoKey)를 새 키로 옮김(이름·전화번호도 새 정보로 갱신). 새 정보 쪽에 이미 사진이 있으면 그걸 유지하고 옛 문서만 지움.
// 실제로 사진을 옮겼으면 true
async function migratePhotoToKey(oldPhoto, oldKey, newKey, newPhotoExists, newName, newPhone) {
  let moved = false;
  if (!newPhotoExists) {
    const value = { ...oldPhoto, name: newName, phone: newPhone, updatedAt: Date.now() };
    if (TEST_MODE) { localStore.photos[newKey] = value; }
    else { await setDoc(doc(db, "photos", newKey), value); }
    state.photos[newKey] = value;
    moved = true;
  }
  if (TEST_MODE) { delete localStore.photos[oldKey]; }
  else { await deleteDoc(doc(db, "photos", oldKey)); }
  delete state.photos[oldKey];
  return moved;
}

// 그날의 반배정+출결상황을 통째로 텍스트로 스냅샷 저장 (나중에 반배정이 바뀌어도 이 기록은 안 바뀜)
// 일일보고 초안을 자동으로 만듦: I. 출결상황(샘플/보강/대체/결석/병결/무단결석/반이동/휴원/퇴원/연장) + II. 특이사항(직원이 직접 작성)
function buildDailyReportDraft(dateISO, dayLetter) {
  const savedFilter = state.teacherFilter;
  state.teacherFilter = new Set(); // 전체 기록을 남기기 위해 현재 선생님 필터는 무시함
  const studentsIndex = buildStudentsIndex();
  const items = [];
  for (const student of studentsIndex.values()) {
    if (student.status && student.status !== "재원") continue;
    for (const cls of student.classes) { if (cls.day === dayLetter) items.push({ student, cls }); }
  }

  const nameLabel = (name, age) => `${name}${age || ""}`;
  const buckets = { sample: [], makeup: [], makeupAbsent: [], substitute: [], newStudent: [], shortterm: [], absent: [], sickLeave: [], noshow: [], moveIn: [], moveOut: [], leave: [], withdrawn: [], extension: [] };

  for (const it of items) {
    const ov = state.overrides[`${dateISO}::${it.student.key}`];
    if (ov && buckets[ov.type]) {
      const label = nameLabel(it.student.name, it.student.age);
      if (!buckets[ov.type].includes(label)) buckets[ov.type].push(label);
    }
  }
  for (const a of Object.values(state.additions)) {
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate) continue;
    const label = nameLabel(a.name, a.age);
    if (a.type === "sample") buckets.sample.push(label);
    else if (a.type === "makeup") { (a.attendanceStatus === "absent" ? buckets.makeupAbsent : buckets.makeup).push(label); }
    else if (a.type === "substitute") buckets.substitute.push(label);
    else if (a.type === "newStudent") buckets.newStudent.push(label);
    else if (a.type === "shortterm") { if (!buckets.shortterm.includes(label)) buckets.shortterm.push(label); } // 같은 날 두 시간대에 등록돼 있어도 한 번만
    // "+"로 등록한 반이동 in도, 정규생에게 표시한 반이동 in(override)과 같은 항목으로 모음 (같은 학생이 양쪽에 있으면 한 번만)
    else if (a.type === "moveIn") { if (!buckets.moveIn.includes(label)) buckets.moveIn.push(label); }
  }
  state.teacherFilter = savedFilter;

  const lines = [`${dateISO} 일일보고`, "", "I. 출결상황"];
  const section = (title, arr) => { if (arr.length) lines.push(`${title}\n${arr.join(", ")}`); };
  section("#샘플", buckets.sample);
  section("#보강", buckets.makeup);
  section("#보강결석", buckets.makeupAbsent);
  section("#대체", buckets.substitute);
  section("#신규", buckets.newStudent);
  section("#단기", buckets.shortterm);
  section("<결석>", buckets.absent);
  section("<병결>", buckets.sickLeave);
  section("<무단결석>", buckets.noshow);
  section("<반이동in>", buckets.moveIn);
  section("<반이동out>", buckets.moveOut);
  section("<휴원>", buckets.leave);
  section("<퇴원>", buckets.withdrawn);
  section("<연장>", buckets.extension);
  lines.push("", "II. 특이사항", "");
  return lines.join("\n");
}

// 출결 로그는 "결석 계열"(결석/병결/무단결석 = 정규 수업 출결 표시)과 "보강 계열"(보강/보강결석 = 보강 등록)로 나뉨.
// 같은 날짜라도 계열이 다르면 서로 다른 사건이라(예: 오전 정규수업 결석 + 같은 날 오후 보강) 서로 덮어쓰거나 지우면 안 됨.
// 보강 계열은 같은 날 다른 시간에 보강이 두 번 있을 수도 있어서, 시간 정보가 양쪽에 다 있으면 시간까지 같아야 같은 로그로 봄.
const MAKEUP_LOG_TYPES = new Set(["makeup", "makeupAbsent"]);
function attLogFamily(type) { return MAKEUP_LOG_TYPES.has(type) ? "makeup" : "absence"; }
function attLogMatches(log, date, family, time) {
  if (log.date !== date || attLogFamily(log.type) !== family) return false;
  if (family === "makeup" && time && log.time && log.time !== time) return false;
  return true;
}
async function upsertAttendanceLog(key, date, type, extra) {
  const att = { ...defaultAttendance(), ...getAttendance(key) };
  const time = (extra && extra.time) || null;
  const logs = (att.logs || []).filter((l) => !attLogMatches(l, date, attLogFamily(type), time));
  const entry = { id: `${date}_${type}_${Math.random().toString(36).slice(2, 6)}`, type, date, by: currentUserLabel() };
  if (extra && extra.teacher) entry.teacher = extra.teacher;
  if (time) entry.time = time;
  logs.push(entry);
  att.logs = logs;
  await saveAttendanceDoc(key, att);
}
// 그 날짜의 해당 계열 로그만 지움 (다른 계열 로그는 그대로 둠)
async function removeAttendanceLog(key, date, family, time) {
  if (!state.attendance[key]) return;
  const att = { ...state.attendance[key] };
  const kept = (att.logs || []).filter((l) => !attLogMatches(l, date, family, time || null));
  if (kept.length === (att.logs || []).length) return; // 지울 게 없으면 저장도 안 함
  att.logs = kept;
  await saveAttendanceDoc(key, att);
}

// 한글 등 비ASCII 문자는 2바이트로 계산 (국내 SMS 업체들이 흔히 쓰는 EUC-KR 기준 90바이트 = 단문 한도)
function smsByteLength(str) {
  let len = 0;
  for (const ch of String(str || "")) len += ch.codePointAt(0) > 127 ? 2 : 1;
  return len;
}

// {이름}{월}{일}{요일}{시}{분} 자동완성 - 이름은 동명이인 구분용 알파벳을 뗀 이름,

function renderSmsTokens(template, recipient) {
  if (!template) return "";
  let month = "", day = "", weekday = "", hour = "", minute = "";
  if (recipient.dateISO) {
    const d = new Date(recipient.dateISO);
    if (!isNaN(d)) {
      month = String(d.getMonth() + 1);
      day = String(d.getDate());
      weekday = `${WEEK_ORDER[(d.getDay() + 6) % 7]}요일`;
    }
  }
  if (recipient.time) {
    const [h, m] = recipient.time.split(":").map(Number);
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    hour = String(h12);
    minute = String(m).padStart(2, "0");
  }
  const displayName = baseName(recipient.name);
  return template
    .split("{이름}").join(displayName)
    .split("{월}").join(month)
    .split("{일}").join(day)
    .split("{요일}").join(weekday)
    .split("{시}").join(hour)
    .split("{분}").join(minute);
}

// 예약 발송 시 매번 직접 고르지 않아도 되도록, 설정해둔 기본 날짜/시각으로 채워줌
// 기본값이 이미 지난 시각이면(예: "오늘 09:00"인데 지금이 오후) 같은 시각의 다음 날로 넘겨서 항상 미래 시각이 채워지게 함
function defaultScheduleAtValue() {
  const cfg = state.smsConfig || {};
  const offset = Number(cfg.defaultDayOffset || 0);
  const time = cfg.defaultTime || "09:00";
  const [hh, mm] = time.split(":").map(Number);
  const d = new Date();
  d.setDate(d.getDate() + offset);
  d.setHours(hh || 0, mm || 0, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (x) => `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`;
  // 발송 검증(isScheduleAtPast)과 똑같이 KST 기준으로 "이미 지난 시각"인지 보고, 지났으면 같은 시각의 다음 날로 넘김
  // (브라우저 시간대가 KST가 아니어도 기본값이 검증에 걸리지 않게 같은 함수로 판단)
  let out = fmt(d);
  for (let i = 0; i < 3 && isScheduleAtPast(out); i++) { d.setDate(d.getDate() + 1); out = fmt(d); }
  return out;
}

// <input type="datetime-local">에서 나오는 값("2026-09-08T19:00")은 타임존 정보가 없는 문자열이라,
// 서버(보통 UTC로 도는 컨테이너)가 이걸 그대로 읽으면 "UTC 19:00"으로 오해해서 실제로는
// 한국시간 새벽(다음날 04:00)에 발송되는 사고가 났었음. 그래서 저장하기 전에 "이 값은 항상
// 한국시간(KST, UTC+9)"이라고 명시적으로 UTC 절대시각으로 변환해서 저장함 — 그러면 서버가
// 어느 타임존으로 돌아가든 정확한 시각으로 해석됨.
function kstLocalToUtcISOString(localStr) {
  if (!localStr) return null;
  const [datePart, timePart] = localStr.split("T");
  const [y, m, d] = datePart.split("-").map(Number);
  const [hh, mm] = (timePart || "0:0").split(":").map(Number);
  return new Date(Date.UTC(y, m - 1, d, hh - 9, mm || 0, 0)).toISOString();
}
// 예약 시각(datetime-local 문자열, 한국시간)이 이미 지났는지. 서버가 해석하는 것과 같은 기준(KST)으로 판단함
function isScheduleAtPast(localStr) {
  const iso = kstLocalToUtcISOString(localStr);
  if (!iso) return false;
  const t = Date.parse(iso);
  return !isNaN(t) && t <= Date.now();
}

// 실제 문자 발송은 이 화면(정적 웹페이지)에서 SMS 업체 API를 직접 호출할 수 없어요(CORS/보안 정책).
// 여기서는 발송 내용을 대기열에 기록해두고, 실제 발송은 서버 연동(Aligo 등) 완료 후 처리돼요.
async function queueSms(recipients, messageTemplate, subjectTemplate, scheduleAt) {
  const docKey = `sms_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  // 수신자별로 {이름}{월}{일}{요일}{시}{분}을 각자의 수업 날짜/시간 기준으로 치환해 최종 메시지를 만듦
  const personalized = recipients.map((r) => ({
    name: r.name, phone: r.phone,
    message: renderSmsTokens(messageTemplate, r),
    subject: renderSmsTokens(subjectTemplate, r),
  }));
  const value = { recipients: personalized, messageTemplate, subjectTemplate: subjectTemplate || "", scheduleAt: kstLocalToUtcISOString(scheduleAt), createdAt: Date.now(), status: "pending", center: selectedCenter?.smsQueueCenterLabel || selectedCenter?.name || null, source: "jp-schedule" };
  try {
    if (TEST_MODE) { localStore.smsQueue[docKey] = value; }
    else { await setDoc(doc(db, "smsQueue", docKey), value); }
    showToast(
      scheduleAt
        ? `${recipients.length}명 예약 발송 대기열에 등록했어요 (실제 발송 연동 필요)`
        : `${recipients.length}명 발송 대기열에 등록했어요 (실제 발송 연동 필요)`
    );
  } catch (e) {
    console.error(e);
    showToast("등록에 실패했어요", "error");
  }
}

// 한글 조합(IME) 중에 화면을 통째로 다시 그리면 입력창이 새로 만들어지면서 조합 중이던 글자가 깨짐.
// 키 입력뿐 아니라 토스트 타이머, Firestore 실시간 수신, 저장 완료 후 render() 같은 비동기 호출도
// 전부 여기서 걸러서 조합이 끝날 때까지 미뤄둠 (compositionend에서 밀린 render를 한 번 실행함).
let isComposing = false;
let renderPending = false; // 조합/클릭 때문에 미뤄둔 render가 있는지
// 마우스/터치를 누르고 있는 동안(pointerdown~pointerup 사이)에도 다시 그리지 않음.
// 입력창에서 조합 중이던 글자가 포커스 이탈로 확정되면서 render가 일어나면, 누르고 있던 버튼이
// 새 DOM으로 바뀌어 mouseup이 다른 요소에 떨어지고 click이 아예 발생하지 않는 문제가 있었음.
let pointerDownAt = 0;
function isPointerHeld() { return pointerDownAt > 0 && Date.now() - pointerDownAt < 1500; } // 1.5초 넘게 누르고 있으면 안전하게 다시 그림
function render() {
  if (isComposing || isPointerHeld()) { renderPending = true; return; }
  renderPending = false;
  const root = document.getElementById("root");
  const focus = captureFocus();
  if (!CENTER_PICKED) {
    root.innerHTML = renderCenterPicker();
    return;
  }
  if (!state.authReady) {
    root.innerHTML = `<div class="login-shell"><div class="muted">불러오는 중...</div></div>`;
    return;
  }
  if (!state.user) {
    root.innerHTML = renderLogin();
    restoreFocus(focus);
    return;
  }
  root.innerHTML = renderApp();
  armToastTimer();
  restoreFocus(focus);
}

function captureFocus() {
  const el = document.activeElement;
  const scrollY = window.scrollY;
  if (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
    return { id: el.id, start: el.selectionStart, end: el.selectionEnd, scrollY };
  }
  return { scrollY };
}
function restoreFocus(f) {
  if (!f) return;
  if (f.id) {
    const el = document.getElementById(f.id);
    if (el) {
      el.focus({ preventScroll: true }); // 다시 그릴 때마다 포커스를 이 요소로 되돌리는데, 기본 동작이면 브라우저가 스크롤을 맨 위로 튕겨버릴 수 있어 막아둠
      try { el.setSelectionRange(f.start, f.end); } catch (e) {}
    }
  }
  // innerHTML을 통째로 갈아끼우는 순간, 기존에 포커스돼 있던 요소가 사라지면서
  // 브라우저가 포커스를 <body>로 되돌리며 스크롤을 맨 위로 튕기는 경우가 있어 명시적으로 복구함
  if (typeof f.scrollY === "number" && window.scrollY !== f.scrollY) {
    window.scrollTo(0, f.scrollY);
  }
}
