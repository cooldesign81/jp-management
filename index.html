function drawListViewCanvas(cache) {
  const W = 900;
  const PAD = 28;
  const ROOM_W = 190;
  const LINE_H = 26;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const scale = 2; // 선명하게

  // 1차 패스: 필요한 높이 계산
  ctx.font = "600 13px sans-serif";
  function wrapWidth(students) {
    const maxW = W - PAD * 2 - ROOM_W - 16;
    let lines = 1, x = 0;
    for (const s of students) {
      const text = s.name + s.age + (s.tag ? `(${s.tag})` : "") + ", ";
      const w = ctx.measureText(text).width;
      if (x + w > maxW && x > 0) { lines++; x = 0; }
      x += w;
    }
    return lines;
  }

  let heightEstimate = PAD * 2 + 40; // 제목
  const layout = [];
  for (const section of cache.sections) {
    if (section.dayTitle) { heightEstimate += 30; layout.push({ type: "dayTitle", text: section.dayTitle }); }
    for (const block of section.blocks) {
      heightEstimate += 38; // 시간 헤더
      const roomLines = block.rooms.map((r) => ({ r, lines: wrapWidth(r.students) }));
      for (const { lines } of roomLines) heightEstimate += Math.max(lines * LINE_H, 32) + 4;
      heightEstimate += 12;
      layout.push({ type: "block", time: block.timeLabel, rooms: roomLines });
    }
  }

  canvas.width = W * scale;
  canvas.height = heightEstimate * scale;
  ctx.scale(scale, scale);

  // 배경
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, heightEstimate);

  let y = PAD;
  ctx.textBaseline = "top";
  ctx.fillStyle = "#20261F";
  ctx.font = "800 20px sans-serif";
  ctx.fillText(`${cache.center} · ${cache.title}`, PAD, y);
  y += 40;

  for (const item of layout) {
    if (item.type === "dayTitle") {
      ctx.fillStyle = "#20261F";
      ctx.font = "800 16px sans-serif";
      ctx.fillText(item.text, PAD, y);
      y += 30;
      continue;
    }
    // 시간 헤더 (흰 배경, 남색 테두리 알약)
    ctx.font = "700 13px sans-serif";
    const label = `🕐 ${item.time}`;
    const labelW = ctx.measureText(label).width + 20;
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#1E3A5F";
    ctx.lineWidth = 2;
    roundRect(ctx, PAD, y, labelW, 26, 13);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#20261F";
    ctx.fillText(label, PAD + 10, y + 6);
    y += 38;

    item.rooms.forEach(({ r, lines }, rowIdx) => {
      const rowH = Math.max(lines * LINE_H, 32);
      // 줄무늬 배경 (뚜렷하게 구분되도록 진한 회색)
      if (rowIdx % 2 === 1) {
        ctx.fillStyle = "#E4E9EC";
        ctx.fillRect(PAD - 8, y - 4, W - PAD * 2 + 16, rowH + 8);
      }
      // 반 라벨 (옅은 하늘색 배경, 파란 테두리 박스)
      ctx.font = "800 13px sans-serif";
      const roomLabel = `${r.classNo} · ${r.teacher} (${r.count}명)`;
      ctx.fillStyle = "#E4F2FA";
      ctx.strokeStyle = "#1D5FA8";
      ctx.lineWidth = 2;
      roundRect(ctx, PAD, y, ROOM_W - 10, 24, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#20261F";
      ctx.save();
      ctx.beginPath();
      ctx.rect(PAD + 6, y, ROOM_W - 22, 24);
      ctx.clip();
      ctx.fillText(roomLabel, PAD + 6, y + 5);
      ctx.restore();

      // 학생 목록 (줄바꿈)
      let sx = PAD + ROOM_W, sy = y;
      const maxW = W - PAD * 2 - ROOM_W - 16;
      ctx.font = "600 13px sans-serif";
      for (const s of r.students) {
        const nameText = s.name + s.age;
        const tagText = s.tag ? `(${s.tag})` : "";
        const fullText = nameText + tagText + ", ";
        const w = ctx.measureText(fullText).width;
        if (sx - (PAD + ROOM_W) + w > maxW && sx > PAD + ROOM_W) { sy += LINE_H; sx = PAD + ROOM_W; }
        ctx.fillStyle = LIST_NAME_HEX_OVERRIDE[s.tagType] || "#111";
        ctx.fillText(nameText, sx, sy + 4);
        sx += ctx.measureText(nameText).width;
        if (tagText) {
          ctx.fillStyle = LIST_TAG_HEX[s.tagType] || "#111";
          ctx.fillText(tagText, sx, sy + 4);
          sx += ctx.measureText(tagText).width;
        }
        ctx.fillStyle = "#111";
        ctx.fillText(", ", sx, sy + 4);
        sx += ctx.measureText(", ").width;
      }
      y += rowH + 4;
    });
    y += 12;
  }

  return canvas;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function captureScreenshot() {
  const renderBlob = async () => {
    if (state.listViewMode && window.__captureCache) {
      const canvas = drawListViewCanvas(window.__captureCache);
      return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
    }
    // 사진 화면(그리드 뷰)은 기존 html2canvas 방식 사용
    const target = document.getElementById("printable-area");
    if (!target) throw new Error("캡처할 화면을 찾지 못했어요");
    if (typeof window.html2canvas === "undefined") {
      for (let i = 0; i < 25 && typeof window.html2canvas === "undefined"; i++) {
        await new Promise((r) => setTimeout(r, 200));
      }
    }
    if (typeof window.html2canvas === "undefined") throw new Error("캡쳐 기능을 불러오지 못했어요");
    const canvas = await window.html2canvas(target, { backgroundColor: "#F7F5EF", scale: 2, useCORS: true });
    return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
  };

  showToast("캡쳐 중이에요...");
  const canTryClipboard = !!(navigator.clipboard && window.ClipboardItem);

  if (canTryClipboard) {
    try {
      // 캡쳐(렌더링)에 시간이 걸리면 클릭한 순간과 너무 멀어져 브라우저가 클립보드 쓰기를 막을 수 있어서,
      // 실제 이미지가 준비되기 전에 "곧 이 내용을 클립보드에 쓸게" 라고 먼저 약속(Promise)해두는 방식으로 처리함
      const blobPromise = renderBlob().then((b) => {
        if (!b) throw new Error("이미지 생성 실패");
        return b;
      });
      await navigator.clipboard.write([new window.ClipboardItem({ "image/png": blobPromise })]);
      showToast("클립보드에 복사했어요! 카카오톡 등에 Ctrl+V(붙여넣기) 하시면 돼요.");
      return;
    } catch (e) {
      console.error("클립보드 복사 실패:", e);
      showToast(`클립보드 복사에 실패했어요 (${e && e.message ? e.message : "알 수 없는 오류"}). 파일로 대신 저장할게요.`, "error");
    }
  } else {
    showToast("이 브라우저는 클립보드 이미지 복사를 지원하지 않아요. 파일로 저장할게요.");
  }

  try {
    const blob = await renderBlob();
    if (!blob) { showToast("캡쳐에 실패했어요", "error"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    a.href = url;
    a.download = `등원현황_${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    showToast(`캡쳐에 실패했어요: ${err && (err.message || err.name) ? (err.message || err.name) : "알 수 없는 오류"}. 대신 인쇄 기능을 이용해 보세요.`, "error");
  }
}

function openUploadModalForKey(rosterKey) {
  let student = window.__studentsIndex && window.__studentsIndex.get(rosterKey);
  if (!student) {
    const p = state.photos[rosterKey];
    if (p) {
      student = { key: rosterKey, name: p.name, phone: p.phone, age: null, startDate: null };
    } else {
      const addition = Object.values(state.additions).find((a) => a.studentKey === rosterKey);
      student = addition
        ? { key: rosterKey, name: addition.name, phone: addition.phone, age: addition.age, registeredAt: addition.registeredAt }
        : { key: rosterKey, name: "", phone: "" };
    }
  }
  const photoKey = resolvePhotoKey(student.phone, student.name);
  state.uploadStudent = { ...student, _photoKey: photoKey };
  render();
}

function computeBirthYear(age) {
  if (age === null || age === undefined || age === "") return null;
  const n = Number(age);
  return isNaN(n) ? null : new Date().getFullYear() - n;
}

async function saveUploadedPhotoFile(file) {
  if (!file || !state.uploadStudent) return;
  try {
    const dataUrl = await resizeImageFile(file);
    const student = state.uploadStudent;
    const photoKey = student._photoKey || resolvePhotoKey(student.phone, student.name);
    const existing = state.photos[photoKey];
    const birthYear = student.age !== undefined && student.age !== null && student.age !== "" ? computeBirthYear(student.age) : existing?.birthYear ?? null;
    const startDate = student.startDate || existing?.startDate || null;
    await savePhotoForKey(photoKey, student.name, student.phone, dataUrl, birthYear, startDate);
    state.uploadStudent = null; render();
  } catch (err) {
    showToast("이미지를 처리하지 못했어요", "error");
  }
}

document.addEventListener("change", async (e) => {
  const action = e.target.dataset?.action;
  if (action === "roster-file") {
    const file = e.target.files?.[0]; e.target.value = "";
    if (file) {
      const confirmMsg = `"${file.name}" 파일로 반 배정을 업데이트할까요?\n반 배정(시간표) 데이터만 이 파일 내용으로 전부 대체돼요.\n(결석/반이동/보강/신규/대체/샘플 등 날짜별 기록은 전부 그대로 유지돼요.)`;
      if (confirm(confirmMsg)) {
        handleRosterFile(file);
      }
    }
  } else if (action === "single-file") {
    const file = e.target.files?.[0]; e.target.value = "";
    await saveUploadedPhotoFile(file);
  } else if (action === "schedule-import-file") {
    const file = e.target.files?.[0]; e.target.value = "";
    if (!file || !state.scheduleImportFlow) return;
    const targetDateISO = state.scheduleImportFlow.targetDateISO;
    state.scheduleImportFlow = { step: "preview", targetDateISO, loading: true, error: null, entries: [] };
    render();
    try {
      const result = await parseScheduleImportFile(file, targetDateISO);
      if (result.error) {
        state.scheduleImportFlow = { step: "preview", targetDateISO, loading: false, error: result.error, entries: [] };
      } else {
        state.scheduleImportFlow = { step: "preview", targetDateISO, loading: false, error: null, entries: result.entries, dayLetter: result.dayLetter };
      }
    } catch (err) {
      console.error(err);
      state.scheduleImportFlow = { step: "preview", targetDateISO, loading: false, error: "파일을 읽는 중 문제가 발생했어요. 형식을 확인해 주세요.", entries: [] };
    }
    render();
  } else if (action === "schedule-import-date") {
    const f = state.scheduleImportFlow;
    if (!f) return;
    f.targetDateISO = e.target.value;
    render();
  } else if (action === "bulk-file") {
    handleBulkFiles(e.target.files); e.target.value = "";
  } else if (action === "backup-import-file") {
    const file = e.target.files?.[0]; e.target.value = "";
    if (file) importPhotoBackup(file);
  } else if (action === "resolve-bulk") {
    const id = e.target.dataset.id;
    state.pendingBulk = state.pendingBulk.map((p) => (p.id === id ? { ...p, resolvedKey: e.target.value } : p));
    render();
  } else if (action === "toggle-select") {
    const key = e.target.dataset.key;
    if (e.target.checked) state.registrySelected.add(key);
    else state.registrySelected.delete(key);
    render();
  } else if (action === "toggle-sms-select") {
    const key = e.target.dataset.key;
    if (e.target.checked) {
      state.smsSelected.set(key, { name: e.target.dataset.name, phone: e.target.dataset.phone, day: e.target.dataset.day, time: e.target.dataset.time });
    } else {
      state.smsSelected.delete(key);
    }
    render();
  } else if (action === "sms-cfg-dayoffset") {
    if (state.smsConfigDraft) state.smsConfigDraft.defaultDayOffset = Number(e.target.value);
  } else if (action === "att-log-date") {
    const d = state.attendanceDraft;
    const l = d && d.logs.find((x) => x.id === e.target.dataset.logid);
    if (l) l.date = e.target.value;
  } else if (action === "counseling-new-date") {
    if (state.counselingDraft) state.counselingDraft.newDate = e.target.value;
  } else if (action === "counseling-day-view-date") {
    state.counselingDayViewDate = e.target.value;
    render();
  } else if (action === "auto-open-start-date") {
    if (state.autoOpenModal) { state.autoOpenModal.startDate = e.target.value; state.autoOpenModal.previewed = false; render(); }
  } else if (action === "auto-open-end-date") {
    if (state.autoOpenModal) { state.autoOpenModal.endDate = e.target.value; state.autoOpenModal.previewed = false; render(); }
  } else if (action === "booking-blockconsecutive") {
    if (state.bookingSettingsDraft) state.bookingSettingsDraft.blockConsecutive = e.target.checked;
  } else if (action === "booking-allowed-toggle") {
    const d = state.bookingSettingsDraft;
    if (!d) return;
    const day = e.target.dataset.day, time = e.target.dataset.time;
    const set = new Set(d.allowed[day] || []);
    if (e.target.checked) set.add(time); else set.delete(time);
    d.allowed = { ...d.allowed, [day]: [...set] };
  } else if (action === "att-log-type") {
    const d = state.attendanceDraft;
    const l = d && d.logs.find((x) => x.id === e.target.dataset.logid);
    if (l) l.type = e.target.value;
    render();
  } else if (action === "att-archive-log-date") {
    const ad = state.attendanceArchiveDraft;
    const l = ad && ad.logs.find((x) => x.id === e.target.dataset.logid);
    if (l) l.date = e.target.value;
  } else if (action === "att-archive-log-type") {
    const ad = state.attendanceArchiveDraft;
    const l = ad && ad.logs.find((x) => x.id === e.target.dataset.logid);
    if (l) l.type = e.target.value;
    render();
  } else if (action === "pick-view-date") {
    const v = e.target.value;
    if (v) {
      state.viewDate = v;
      state.selectedDay = getViewTodayLetter();
      render();
    }
  }
});

document.addEventListener("paste", async (e) => {
  if (e.target && e.target.closest && e.target.closest("#schedule-paste-area") && state.scheduleImportFlow) {
    e.preventDefault();
    const html = e.clipboardData?.getData("text/html") || "";
    const plain = e.clipboardData?.getData("text/plain") || "";
    state.scheduleImportFlow.pasteBuffer = html || esc(plain).replace(/\n/g, "<br/>");
    state.scheduleImportFlow.pasteBufferPlain = plain;
    render();
    return;
  }
  if (!state.uploadStudent) return;
  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();
      e.preventDefault();
      await saveUploadedPhotoFile(file);
      break;
    }
  }
});

document.addEventListener("dragover", (e) => {
  if (e.target.closest && e.target.closest("#dropzone")) { e.preventDefault(); e.target.closest("#dropzone").classList.add("drag"); }
});
document.addEventListener("dragleave", (e) => {
  if (e.target.closest && e.target.closest("#dropzone")) { e.target.closest("#dropzone").classList.remove("drag"); }
});
document.addEventListener("drop", async (e) => {
  const zone = e.target.closest && e.target.closest("#dropzone");
  if (!zone || !state.uploadStudent) return;
  e.preventDefault(); zone.classList.remove("drag");
  const file = e.dataTransfer.files?.[0];
  await saveUploadedPhotoFile(file);
});

/* ---------- boot ---------- */

if (!CENTER_PICKED) {
  // 센터를 아직 선택하지 않았으면 render()가 센터 선택 화면을 보여주고,
  // 로그인/데이터 로딩은 센터를 고른 뒤 페이지가 새로고침되면서 시작됩니다.
} else if (TEST_MODE) {
  state.user = { email: "테스트 모드" };
  state.authReady = true;
  loadAll();
} else {
  onAuthStateChanged(auth, (user) => {
    if (user && !isGoogleUserAllowed(user)) {
      // 이전에 로그인해둔 세션이 있어도, 허용 목록에서 빠졌다면 여기서 즉시 로그아웃시킴.
      signOut(auth);
      state.loginError = "이 구글 계정은 허용되지 않았어요. 담당자에게 문의해 주세요.";
      state.user = null;
      state.authReady = true;
      render();
      return;
    }
    state.user = user;
    state.authReady = true;
    render();
    if (user) startRealtimeListeners();
    else stopRealtimeListeners();
  });
}

render();
</script>
