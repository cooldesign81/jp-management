function renderClassroomGrid(items, dayLetter) {
  const photoIdx = photoLookupIndex();
  const dateISO = toISODate(getWeekDates(getViewBaseDate())[dayLetter]);
  // group: time -> classroom(classNo+teacher) -> students
  const byTime = new Map();
  for (const it of items) {
    const t = it.cls.time;
    if (!byTime.has(t)) byTime.set(t, new Map());
    const roomKey = `${it.cls.classNo}__${it.cls.teacher}`;
    const rooms = byTime.get(t);
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: it.cls.classNo, teacher: it.cls.teacher, students: [] });
    rooms.get(roomKey).students.push(it.student);
  }
  // 정규 시간표는 학생이 없어도 항상 표시
  for (const t of getTemplateTimesForDay(dayLetter)) {
    if (!byTime.has(t)) byTime.set(t, new Map());
  }
  // "+" 로 수동 추가된 빈 교실도 반영
  for (const mr of Object.values(state.manualRooms)) {
    if (mr.dateISO !== dateISO) continue;
    if (state.teacherFilter.size > 0 && !state.teacherFilter.has(mr.teacher)) continue;
    if (!byTime.has(mr.time)) byTime.set(mr.time, new Map());
    const rooms = byTime.get(mr.time);
    const roomKey = `${mr.classNo}__${mr.teacher}`;
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: mr.classNo, teacher: mr.teacher, students: [] });
  }
  // 원래 반이 반배정 변경 등으로 화면에서 사라졌더라도, 그 반에 보강/신규/대체/샘플/단기로
  // 등록된 학생이 남아있으면 반을 계속 표시해서 눈에 보이고 지울 수 있게 함 (고아 기록 방지)
  for (const a of Object.values(state.additions)) {
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate) continue;
    if (state.teacherFilter.size > 0 && !state.teacherFilter.has(a.teacher)) continue;
    if (!byTime.has(a.time)) byTime.set(a.time, new Map());
    const rooms = byTime.get(a.time);
    const roomKey = `${a.classNo}__${a.teacher}`;
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: a.classNo, teacher: a.teacher, students: [] });
  }
  const times = Array.from(byTime.keys()).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));
  if (times.length === 0) return "";
  return times.map((t) => {
    const rooms = Array.from(byTime.get(t).values()).sort((a, b) => a.classNo.localeCompare(b.classNo, "ko"));
    const roomCards = rooms.map((r) => {
      const chips = r.students
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, "ko"))
        .map((s) => {
          const photoKey = resolvePhotoKey(s.phone, s.name, photoIdx);
          const ov = state.overrides[`${dateISO}::${s.key}`];
          const ovMeta = ov ? OVERRIDE_META[ov.type] : null;
          const borderCss = ovMeta ? ovMeta.border : null;
          const badgeHtml = ovMeta ? `<span class="avatar-flag-badge" style="color:${ovMeta.color};">${esc(ovMeta.badge)}</span>` : "";
          return `
          <div class="student-chip">
            <div class="avatar-wrap">
              ${state.smsMode === "absence" ? `<input type="checkbox" class="sms-checkbox" data-action="toggle-sms-select" data-key="${esc(s.key)}" data-name="${esc(s.name)}" data-phone="${esc(s.phone)}" data-day="${esc(dayLetter)}" data-time="${esc(t)}" ${state.smsSelected.has(s.key) ? "checked" : ""} />` : ""}
              <div class="avatar-clickable" data-dblaction="open-upload" data-key="${esc(s.key)}" title="더블클릭해서 사진 등록/변경">

            <div class="s-name" data-action="open-override" data-key="${esc(s.key)}" data-date="${esc(dateISO)}" title="클릭해서 결석/반이동 표시">${esc(s.name)}${s.age ? ` <span class="s-age-inline">· ${esc(s.age)}세</span>` : ""}</div>
            ${(() => {
              const dur = enrollDurationLabel(s.registeredAt);

              if (!dur && !needsPay) return "";
              return `<div class="s-meta-line muted">${esc(dur)}${needsPay ? `${dur ? " · " : ""}<span class="s-pay-flag">결제</span>` : ""}</div>`;
            })()}
          </div>`;
        }).join("");

      // 보강/신규/대체/반이동in/단기로 이 시간대에 추가된 학생들
      // 단기(recurring)는 시작일 이후 매주 같은 요일/시간에 계속 표시됨 (수동으로 지우기 전까지)
      const extraEntries = Object.entries(state.additions).filter(([, a]) => {
        if (a.classNo !== r.classNo || a.teacher !== r.teacher || a.time !== t) return false;

      const extraChips = extraEntries.map(([docKey, a]) => {

          : "";
        if (meta.isSample) {
          return `

const ALL_DAY = "전체";

// 사진 없이 텍스트로만 간단히 보는 리스트 뷰 (오늘 실제로 등원/등록된 것만, 빈 정규 시간표는 생략)
// 리스트 뷰의 시간/반/학생 구조를 데이터로 만듦 (HTML 렌더링과 캡쳐용 캔버스 렌더링이 같이 씀)
function buildListViewData(items, dayLetter) {
  const dateISO = toISODate(getWeekDates(getViewBaseDate())[dayLetter]);
  const byTime = new Map();
  for (const it of items) {
    const t = it.cls.time;
    if (!byTime.has(t)) byTime.set(t, new Map());
    const roomKey = `${it.cls.classNo}__${it.cls.teacher}`;
    const rooms = byTime.get(t);
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: it.cls.classNo, teacher: it.cls.teacher, students: [] });
    rooms.get(roomKey).students.push(it.student);
  }
  for (const mr of Object.values(state.manualRooms)) {
    if (mr.dateISO !== dateISO) continue;
    if (state.teacherFilter.size > 0 && !state.teacherFilter.has(mr.teacher)) continue;
    if (!byTime.has(mr.time)) byTime.set(mr.time, new Map());
    const rooms = byTime.get(mr.time);
    const roomKey = `${mr.classNo}__${mr.teacher}`;
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: mr.classNo, teacher: mr.teacher, students: [] });
  }
  for (const a of Object.values(state.additions)) {
    const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
    if (!matchesDate) continue;
    if (state.teacherFilter.size > 0 && !state.teacherFilter.has(a.teacher)) continue;
    if (!byTime.has(a.time)) byTime.set(a.time, new Map());
    const rooms = byTime.get(a.time);
    const roomKey = `${a.classNo}__${a.teacher}`;
    if (!rooms.has(roomKey)) rooms.set(roomKey, { classNo: a.classNo, teacher: a.teacher, students: [] });
  }
  const times = Array.from(byTime.keys()).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

  // 오늘 이미 수업이 있는 선생님은, 다른 정규 시간대에 수업이 없어도 빈 줄로 표시해줌
  // (예: 허재홍 선생님이 3:10/4:50엔 수업이 있는데 1:30엔 없으면 1:30에도 빈 줄로 보이게).
  // 빈 줄의 반 이름은 그날 그 선생님의 첫 번째(가장 이른 시간) 반 이름을 그대로 씀.
  const templateTimes = getTemplateTimesForDay(dayLetter);
  const teacherDefaultRoom = new Map(); // teacher -> 그날 처음 나온 classNo
  for (const t of times) {
    for (const room of byTime.get(t).values()) {
      if (!teacherDefaultRoom.has(room.teacher)) teacherDefaultRoom.set(room.teacher, room.classNo);
    }
  }
  for (const t of templateTimes) {
    if (!byTime.has(t)) byTime.set(t, new Map());
    const rooms = byTime.get(t);
    for (const [teacher, classNo] of teacherDefaultRoom) {
      const alreadyHasThisTeacher = Array.from(rooms.values()).some((r) => r.teacher === teacher);
      if (alreadyHasThisTeacher) continue;
      rooms.set(`${classNo}__${teacher}__blank`, { classNo, teacher, students: [] });
    }
  }
  const finalTimes = Array.from(byTime.keys()).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

  const studentEntry = (s) => {
    const ov = state.overrides[`${dateISO}::${s.key}`];
    const tagType = ov && OVERRIDE_META[ov.type] ? ov.type : null;
    return { kind: "regular", key: s.key, name: s.name, age: s.age || "", tagType, tag: tagType ? OVERRIDE_META[tagType].label : "" };
  };

  return finalTimes.map((t) => {
    const rooms = Array.from(byTime.get(t).values()).sort((a, b) => a.classNo.localeCompare(b.classNo, "ko"));
    const extraByRoom = new Map();
    for (const [docKey, a] of Object.entries(state.additions)) {
      const matchesDate = additionMatchesDate(a, dateISO, dayLetter);
      if (!matchesDate || a.time !== t) continue;
      if (state.teacherFilter.size > 0 && !state.teacherFilter.has(a.teacher)) continue;
      const roomKey = `${a.classNo}__${a.teacher}`;
      if (!extraByRoom.has(roomKey)) extraByRoom.set(roomKey, []);
      extraByRoom.get(roomKey).push([docKey, a]);
    }
    const roomRows = rooms.map((r) => {
      const roomKey = `${r.classNo}__${r.teacher}`;
      const regular = r.students.slice().sort((a, b) => a.name.localeCompare(b.name, "ko")).map(studentEntry);
      const extras = (extraByRoom.get(roomKey) || []).map(([docKey, a]) => {
        const meta = TYPE_META[a.type] || { badge: "?" };
        const isMakeupAbsent = a.type === "makeup" && a.attendanceStatus === "absent";
        const tagType = isMakeupAbsent ? "makeupAbsent" : a.type;
        return {
          kind: a.type === "makeup" ? "makeup" : "addition", docKey, studentKey: a.studentKey,
          name: a.name, age: a.age || "", tagType, tag: isMakeupAbsent ? "보강결석" : meta.badge,
        };
      });
      const students = [...regular, ...extras];
      return { classNo: r.classNo, teacher: r.teacher, count: students.length, students };
    });
    return { time: t, timeLabel: formatTimeKorean(t), rooms: roomRows, dateISO, dayLetter };
  });
}

function renderClassroomListView(items, dayLetter) {
  const blocks = buildListViewData(items, dayLetter);
  if (blocks.length === 0) return "";
  const sections = blocks.map((block) => {
    const timeMemoKey = `${block.dateISO}::t::${block.time}`;
    const rows = block.rooms.map((r, idx) => {
      const roomMemoKey = `${block.dateISO}::r::${block.time}::${r.classNo}__${r.teacher}`;
      const names = r.students.map((s) => {
        const nameColor = s.tagType ? (LIST_NAME_COLOR_OVERRIDE[s.tagType] || "var(--ink)") : "var(--ink)";
        const nameHtml = `<span style="color:${nameColor};font-weight:700;">${esc(s.name)}${esc(s.age)}</span>`;
        const tagColor = s.tagType ? (LIST_TAG_COLOR[s.tagType] || "#111") : null;
        const tagHtml = s.tag ? `<span style="color:${tagColor};font-weight:800;">(${esc(s.tag)})</span>` : "";
        if (s.kind === "regular") {
          return `<span class="list-student-click" data-action="open-override" data-key="${esc(s.key)}" data-date="${esc(block.dateISO)}" title="클릭해서 결석/반이동 표시">${nameHtml}${tagHtml}</span>`;
        }
        if (s.kind === "makeup") {
          return `<span class="list-student-click" data-action="open-makeup-attendance" data-key="${esc(s.docKey)}" data-studentkey="${esc(s.studentKey)}" data-date="${esc(block.dateISO)}" data-name="${esc(s.name)}" title="클릭해서 보강결석/취소 선택">${nameHtml}${tagHtml}</span>`;
        }
        return `<span class="list-student-click" data-action="open-addition-remove" data-key="${esc(s.docKey)}" data-name="${esc(s.name)}" title="클릭해서 등록 취소">${nameHtml}${tagHtml}</span>`;
      }).join(", ");
      return `
        <div class="row gap2 list-room-row ${idx % 2 === 1 ? "list-room-row-alt" : ""}" style="align-items:flex-start;">
          <div class="row gap2" style="align-items:center;flex-shrink:0;">
            <div class="room-title list-room-title">${esc(r.classNo)} · ${esc(r.teacher)} <span class="muted" style="font-weight:600;font-size:11px;">(${r.count}명)</span></div>
            <button class="add-student-btn" style="width:20px;height:20px;font-size:13px;" data-action="open-addition" data-classno="${esc(r.classNo)}" data-teacher="${esc(r.teacher)}" data-time="${esc(block.time)}" data-day="${esc(dayLetter)}" data-date="${esc(block.dateISO)}" title="보강/대체/반이동/단기 등록 추가">+</button>
            <span class="list-room-memo-btn" data-action="toggle-list-memo" data-key="${esc(roomMemoKey)}" title="메모">📝${state.listMemos[roomMemoKey] && state.listMemos[roomMemoKey].text ? "" : "+"}</span>
          </div>
          <div class="list-room-students">${names}</div>
          ${renderListMemoInline(roomMemoKey, "list-memo-inline-room")}
          ${renderListMemoEditBox(roomMemoKey)}
        </div>`;
    }).join("");
    return `
      <div class="time-section">
        <div class="row gap2" style="align-items:center;flex-wrap:wrap;">
          <div class="list-time-heading">🕐 ${esc(block.timeLabel)}
            <button class="add-student-btn" data-action="open-room-picker" data-time="${esc(block.time)}" data-day="${esc(dayLetter)}" data-date="${esc(block.dateISO)}" title="이 시간에 반 추가">+</button>
            <span class="list-memo-btn" data-action="toggle-list-memo" data-key="${esc(timeMemoKey)}" title="메모">📝${state.listMemos[timeMemoKey] && state.listMemos[timeMemoKey].text ? "" : "+"}</span>
          </div>

        </div>
        ${renderListMemoEditBox(timeMemoKey)}
        <div class="card" style="padding:2px 14px;">${rows}</div>
      </div>`;
  }).join("");
  const dayMemoKey = `${blocks[0].dateISO}::day`;
  return sections + renderDayMemoBox(dayMemoKey);
}

function renderTodayTab(studentsIndex) {
  if (state.roster.length === 0) {
    return `<div class="card" style="padding:40px;text-align:center;">
      <div style="font-size:26px;">🌱</div>
      <div style="font-weight:700;margin-top:8px;">아직 반 배정 데이터가 없어요</div>

    </div>`;
  }

  const items = [];
  let unparsed = 0;
  for (const student of studentsIndex.values()) {
    if (student.status && student.status !== "재원") continue;
    for (const cls of student.classes) items.push({ student, cls });
    unparsed += student.parseFailed.length;
  }
  items.sort((a, b) => timeToMinutes(a.cls.time) - timeToMinutes(b.cls.time) || a.student.name.localeCompare(b.student.name, "ko"));
  const allTeachers = Array.from(new Set(items.map((it) => it.cls.teacher))).sort((a, b) => a.localeCompare(b, "ko"));
  const teacherFiltered = state.teacherFilter.size === 0 ? items : items.filter((it) => state.teacherFilter.has(it.cls.teacher));
  const searched = state.search.trim() ? teacherFiltered.filter((it) => it.student.name.includes(state.search.trim())) : teacherFiltered;
  const filtered = state.selectedDay === ALL_DAY ? searched : searched.filter((it) => it.cls.day === state.selectedDay);
  const withPhoto = filtered.filter((it) => state.photos[it.student.key]?.photo).length;

  const weekDates = getWeekDates(getViewBaseDate());
  const dayPills =
    `<button class="pill day-pill ${state.selectedDay === ALL_DAY ? "active" : ""}" data-action="select-day" data-day="${ALL_DAY}">${ALL_DAY}</button>` +
    WEEK_ORDER.map((d) => `<button class="pill day-pill ${state.selectedDay === d ? "active" : ""}" data-action="select-day" data-day="${d}">${d} ${esc(formatMonthDay(weekDates[d]))}</button>`).join("");
  const teacherPills = allTeachers.length > 0
    ? `<button class="pill ${state.teacherFilter.size === 0 ? "active" : ""}" data-action="clear-teacher-filter">전체 선생님</button>` +
      allTeachers.map((t) => `<button class="pill ${state.teacherFilter.has(t) ? "active" : ""}" data-action="toggle-teacher-filter" data-teacher="${esc(t)}">${esc(t)}</button>`).join("")
    : "";

  let listHtml;
  const renderDayContent = state.listViewMode ? renderClassroomListView : renderClassroomGrid;
  if (filtered.length === 0) {
    listHtml = `<div class="card" style="padding:40px;text-align:center;"><span class="muted">${state.selectedDay === ALL_DAY ? "" : esc(state.selectedDay) + "요일에 "}등원하는 학생이 없어요.</span></div>`;
    window.__captureCache = null;
  } else if (state.selectedDay === ALL_DAY) {
    const sections = [];
    listHtml = WEEK_ORDER.map((d) => {
      const dayItems = searched.filter((it) => it.cls.day === d);
      if (dayItems.length === 0) return "";
      if (state.listViewMode) sections.push({ dayTitle: `${d}요일 (${formatMonthDay(weekDates[d])})`, blocks: buildListViewData(dayItems, d) });
      return `
        <div style="margin-bottom:22px;">
          <div style="font-size:16px;font-weight:800;margin-bottom:8px;">${esc(d)}요일 (${esc(formatMonthDay(weekDates[d]))})</div>
          ${renderDayContent(dayItems, d)}
        </div>`;
    }).join("");
    window.__captureCache = state.listViewMode ? { center: state.roster[0]?.center || "", title: "전체 요일", sections } : null;
  } else {
    listHtml = renderDayContent(filtered, state.selectedDay);
    window.__captureCache = state.listViewMode
      ? { center: state.roster[0]?.center || "", title: `${state.selectedDay}요일 (${formatMonthDay(weekDates[state.selectedDay])})`, sections: [{ dayTitle: null, blocks: buildListViewData(filtered, state.selectedDay) }] }
      : null;
  }

  return `
    <div class="row between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px;">
      <div class="row gap2" style="flex-wrap:wrap;">
        <div class="wrap-gap">${dayPills}</div>
        <button class="pill ${state.listViewMode ? "active" : ""}" data-action="toggle-list-view" title="사진 없이 텍스트로만 간단히 보기">📋 리스트 보기</button>
        <div style="font-size:12px;" class="muted"><b style="color:var(--ink);">${filtered.length}</b>명 · 사진 ${withPhoto} · 미등록 <b style="color:${filtered.length - withPhoto > 0 ? "var(--accent)" : "var(--muted)"};">${filtered.length - withPhoto}</b></div>
      </div>
      <div class="row gap2 no-print">
        <button class="btn ${state.smsMode === "absence" ? "btn-primary" : ""}" data-action="toggle-sms-absence">📩 미등원 SMS</button>
        <button class="btn" data-action="open-group-sms">📢 단체 SMS</button>
        <button class="btn" data-action="open-sms-settings" title="Aligo API 설정 및 예약 발송 기본값">⚙️ SMS 설정</button>
        <button class="btn" data-action="open-sms-queue" title="예약/대기 중인 문자 확인 및 취소">📋 문자 대기열</button>
      </div>
    </div>
    <div class="row gap3 no-print" style="margin-bottom:16px;flex-wrap:wrap;align-items:center;">
      ${teacherPills ? `<div class="wrap-gap">${teacherPills}</div>` : ""}
      <div class="row gap2" style="margin-left:auto;flex-wrap:nowrap;">
        <div class="search-wrap"><span class="search-icon">🔍</span><input id="search-input" data-action="search" value="${esc(state.search)}" placeholder="이름 검색" /></div>
        <button class="btn" data-action="print-view">🖨️ 인쇄</button>
        <button class="btn" data-action="capture-screen">📋 클립보드</button>
      </div>
    </div>
    ${unparsed > 0 ? `<div class="banner-warn">⚠️ 반 형식을 인식하지 못한 항목이 ${unparsed}건 있어요. 원본 엑셀의 "반" 열 형식을 확인해 주세요.</div>` : ""}
    <div id="printable-area" class="${state.listViewMode ? "list-mode" : ""}">
      <div class="print-title" style="display:none;">${esc(state.roster[0]?.center || "자라다")} 등원 현황 · ${esc(state.selectedDay === ALL_DAY ? "전체" : state.selectedDay + "요일")} ${state.selectedDay === ALL_DAY ? "" : esc(formatMonthDay(weekDates[state.selectedDay] || new Date()))}</div>
      ${listHtml}
    </div>
    ${state.selectedDay !== ALL_DAY ? renderDailyReportSection(toISODate(weekDates[state.selectedDay]), state.selectedDay) : ""}
    ${state.smsMode === "absence" ? `
      <div class="sms-float-bar no-print">
        <span>${state.smsSelected.size}명 선택됨</span>
        <button data-action="sms-absence-send" ${state.smsSelected.size === 0 ? "disabled" : ""}>보내기</button>
        <button class="ghost" data-action="toggle-sms-absence">취소</button>
      </div>` : ""}
  `;
}

function renderMakeupTab() {
  const s = getBookingSettings();
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const now = new Date();
  const base = state.makeupCalendarMonth ? new Date(state.makeupCalendarMonth + "-01T00:00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = `${year}년 ${month + 1}월`;
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayISO = toISODate(now);
  const studentsIndex = window.__studentsIndex || buildStudentsIndex();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const weekdayHeader = days.map((w, i) => `<div class="cal-weekday" style="${i === 0 ? "color:var(--danger);" : i === 6 ? "color:var(--flag-blue);" : ""}">${w}</div>`).join("");

  const dayCells = cells.map((d, i) => {
    if (d === null) return `<div class="mk-cal-cell mk-cal-cell-empty"></div>`;
    const dateISO = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const jsDay = i % 7;
    const isToday = dateISO === todayISO;
    const openForDay = Object.values(state.makeupOpenings)
      .filter((o) => o.date === dateISO && o.open)
      .sort((a, b) => a.time.localeCompare(b.time) || a.roomNo - b.roomNo);
    const candidatesForDay = s.configured ? computeOpeningCandidates(dateISO, studentsIndex) : [];
    const extraOpenCount = Math.max(0, openForDay.length - 2);
    const chips = [
      ...openForDay.slice(0, 2).map((o) => `<div class="mk-chip mk-chip-open" data-action="open-makeup-day-cell" data-date="${dateISO}" data-time="${esc(o.time)}" data-room="${o.roomNo}">${esc(o.time)}·${o.roomNo}반</div>`),
      ...(extraOpenCount > 0 ? [`<div class="mk-chip mk-chip-open" data-action="open-makeup-day" data-date="${dateISO}">+${extraOpenCount}개 더</div>`] : []),
      ...candidatesForDay.slice(0, 2).map((c) => `<div class="mk-chip mk-chip-candidate" data-action="open-makeup-day-cell" data-date="${dateISO}" data-time="${esc(c.time)}" data-room="${c.roomNo}">${esc(c.time)}·${c.roomNo}반 (${c.vacancy})</div>`),
    ];
    return `
      <div class="mk-cal-cell ${isToday ? "mk-cal-cell-today" : ""}" data-action="open-makeup-day" data-date="${dateISO}" style="${jsDay === 0 ? "color:var(--danger);" : jsDay === 6 ? "color:var(--flag-blue);" : ""}">
        <div class="mk-cal-cell-num">${d}</div>
        <div class="mk-cal-cell-chips">${chips.join("")}</div>
      </div>`;
  }).join("");

  return `
  <div>
    ${!s.configured ? `
      <div class="banner-warn" style="margin-bottom:16px;">
        아직 보강 예약 설정이 안 되어 있어요. 먼저 <b>"⚙️ 예약 설정"</b>에서 수업 시간·반·허용 요일 등을 설정해 주세요.
      </div>` : ""}
    <div class="row between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div style="font-weight:800;font-size:16px;">🪑 보강 예약 관리</div>
      <div class="row gap2">
        <button class="btn" data-action="open-auto-open-modal">🤖 자동 보강 자리 열기</button>
        <button class="btn" data-action="open-booking-settings">⚙️ 예약 설정</button>
      </div>
    </div>
    <div class="card" style="padding:16px;">
      <div class="row between" style="margin-bottom:12px;align-items:center;">
        <button class="btn" data-action="makeup-cal-prev">◀</button>
        <div style="font-weight:800;font-size:16px;">${esc(monthLabel)}</div>
        <button class="btn" data-action="makeup-cal-next">▶</button>
      </div>
      <div class="wrap-gap" style="margin-bottom:10px;font-size:11px;">
        <span style="color:var(--accent);">■ 오픈된 보강</span>
        <span class="muted">□ 오픈 취소됨</span>
        <span style="color:#1a7f37;">▧ 오픈 가능(빈자리)</span>
      </div>
      <div class="cal-grid cal-grid-header">${weekdayHeader}</div>
      <div class="cal-grid">${dayCells}</div>
      <div class="muted" style="font-size:11px;margin-top:10px;text-align:center;">날짜를 클릭하면 그날 시간표를 보고 보강을 열거나 관리할 수 있어요.</div>
    </div>
  </div>`;
}

function renderMakeupDayModal() {
  const dm = state.makeupDayModal;
  const s = getBookingSettings();
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const dayLetter = days[new Date(dm.date + "T00:00:00").getDay()];
  const studentsIndex = window.__studentsIndex || buildStudentsIndex();
  const d = new Date(dm.date + "T00:00:00");
  const templateTimesForDay = new Set(getTemplateTimesForDay(dayLetter));
  const rowTimes = s.times.filter((t) => templateTimesForDay.has(t));

  const gridHeader = `<div class="mk-tt-row mk-tt-head"><div class="mk-tt-timecol"></div>${s.rooms.map((r) => `<div class="mk-tt-cell mk-tt-headcell">${r}반</div>`).join("")}</div>`;
  const gridRows = rowTimes.map((time) => {
    const cells = s.rooms.map((roomNo) => {
      const opening = Object.values(state.makeupOpenings).find((o) => o.date === dm.date && o.time === time && o.roomNo === roomNo);
      const vacancy = s.configured ? computeSlotVacancy(dm.date, dayLetter, time, roomNo, studentsIndex) : 0;
      const students = getSlotStudents(dm.date, dayLetter, time, roomNo, studentsIndex);
      const selected = dm.selectedTime === time && dm.selectedRoom === roomNo;
      const allowed = centerAllowsTime(s, dm.date, time);
      return `
        <div class="mk-tt-cell mk-tt-slot ${selected ? "mk-tt-slot-selected" : ""} ${opening ? (opening.open ? "mk-tt-slot-open" : "mk-tt-slot-closed") : ""}" data-action="select-makeup-cell" data-time="${esc(time)}" data-room="${roomNo}">
          ${opening ? `<div class="mk-tt-badge ${opening.open ? "mk-tt-badge-open" : "mk-tt-badge-closed"}">${opening.open ? "오픈중" : "오픈취소"}</div>` : vacancy > 0 ? `<div class="mk-tt-badge mk-tt-badge-vacancy">빈자리 ${vacancy}</div>` : !allowed ? `<div class="mk-tt-badge mk-tt-badge-muted">보강불가</div>` : ""}
          <div class="mk-tt-students">${students.map((st) => `<div class="${st.isProblem ? "mk-tt-student-problem" : st.isBooking ? "mk-tt-student-booking" : ""}">${esc(st.name)}${st.age ? `(${esc(st.age)})` : ""}${st.status !== "출석 예정" ? ` · ${esc(st.status)}` : ""}</div>`).join("")}${students.length === 0 ? `<div class="muted">배정 없음</div>` : ""}</div>
        </div>`;
    }).join("");
    return `<div class="mk-tt-row"><div class="mk-tt-timecol">${esc(time)}</div>${cells}</div>`;
  }).join("");

  const selectedOpening = dm.selectedTime ? Object.values(state.makeupOpenings).find((o) => o.date === dm.date && o.time === dm.selectedTime && o.roomNo === dm.selectedRoom) : null;
  const selectedStudents = dm.selectedTime ? getSlotStudents(dm.date, dayLetter, dm.selectedTime, dm.selectedRoom, studentsIndex) : [];
  const selectedAllowed = dm.selectedTime ? centerAllowsTime(s, dm.date, dm.selectedTime) : false;
  const selectedVacancy = dm.selectedTime ? computeSlotVacancy(dm.date, dayLetter, dm.selectedTime, dm.selectedRoom, studentsIndex) : 0;

  let panel = `<div class="muted" style="padding:20px 0;text-align:center;font-size:13px;">시간표에서 반을 선택해 주세요.</div>`;
  if (dm.selectedTime) {
    const uploadedAtForYears = state.rosterMeta ? state.rosterMeta.uploadedAt : Date.now();
    const yearOptions = [];
    for (let age = MAKEUP_MIN_AGE; age <= MAKEUP_MAX_AGE; age++) {
      const y = rosterBirthYearClient(age, uploadedAtForYears);
      if (y !== null) yearOptions.push(y);
    }
    if (selectedOpening) {
      const booked = computeBookedCount(selectedOpening);
      const bookingStudents = selectedStudents.filter((st) => st.isBooking);
      panel = `
        <div style="font-weight:800;font-size:14px;margin-bottom:8px;">${esc(dm.selectedTime)} · ${dm.selectedRoom}반 — ${selectedOpening.open ? "오픈된 보강" : "오픈 취소된 보강"}</div>
        <div class="row gap2" style="margin-bottom:10px;">
          <div class="muted" style="font-size:12px;">대상 연령: ${formatBirthYearsAsAges(selectedOpening.birthYears, state.rosterMeta ? state.rosterMeta.uploadedAt : 0)}</div>
        </div>
        <div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;">
          <div class="muted" style="font-size:12px;margin-bottom:6px;">총 보강 자리 (예약 ${booked}명)</div>
          <div class="row gap2" style="align-items:center;">
            <button class="btn" data-action="makeup-detail-capacity-dec" ${dm.detailCapacity <= booked ? "disabled" : ""}>−</button>
            <div style="font-weight:800;font-size:15px;min-width:40px;text-align:center;">${dm.detailCapacity}자리</div>
            <button class="btn" data-action="makeup-detail-capacity-inc">+</button>
            <button class="btn btn-primary" data-action="save-makeup-capacity" ${dm.detailCapacity === selectedOpening.capacity ? "disabled" : ""}>자리 수 저장</button>
          </div>
        </div>
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;">보강 예약자 ${bookingStudents.length}명</div>
        ${bookingStudents.length === 0 ? `<div class="muted" style="font-size:12px;margin-bottom:12px;">아직 예약자가 없어요.</div>` : bookingStudents.map((st) => `
          <div class="row between" style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;">
            <div style="font-size:13px;">${esc(st.name)}${st.age ? `(${esc(st.age)})` : ""}</div>
            <button class="btn btn-danger" data-action="cancel-makeup-booking" data-dockey="${esc(st.docKey)}" data-name="${esc(st.name)}">예약 취소</button>
          </div>`).join("")}
        ${selectedOpening.open
          ? `<button class="btn btn-danger" style="width:100%;justify-content:center;margin-top:6px;" data-action="close-makeup-opening" data-id="${esc(selectedOpening.id)}">신규 예약 닫기</button>`
          : `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" data-action="reopen-makeup-opening" data-id="${esc(selectedOpening.id)}" ${!selectedAllowed ? "disabled" : ""}>다시 오픈</button>`}
      `;
    } else {
      const cb = dm.createBirthYears || [];
      panel = `
        <div style="font-weight:800;font-size:14px;margin-bottom:8px;">${esc(dm.selectedTime)} · ${dm.selectedRoom}반 — 새 보강 열기</div>
        ${!selectedAllowed ? `<div class="banner-warn" style="margin-bottom:10px;">이 요일·시간에는 보강 예약 설정상 허용되지 않아요.</div>` :
          selectedVacancy > 0 ? `<div style="background:var(--accent-light);color:#1a7f37;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px;">결석 등으로 확인된 빈자리가 ${selectedVacancy}개 있어요.</div>`
          : `<div class="muted" style="font-size:12px;margin-bottom:10px;">현재 자동으로 확인된 빈자리는 없지만, 직접 자리를 만들 수 있어요.</div>`}
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">예약 가능 연령</div>
        <div class="wrap-gap" style="margin-bottom:12px;">
          ${yearOptions.slice().sort((a, b) => b - a).map((y) => {
            const age = birthYearToAgeClient(y, state.rosterMeta ? state.rosterMeta.uploadedAt : 0);
            return `<label style="display:flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:5px 8px;cursor:pointer;${cb.includes(y) ? "background:var(--accent-light);border-color:var(--accent);" : ""}"><input type="checkbox" data-action="toggle-create-birthyear" data-year="${y}" ${cb.includes(y) ? "checked" : ""} />${age !== null ? age + "세" : y + "년생"}</label>`;
          }).join("")}
        </div>
        <div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;">
          <div class="muted" style="font-size:12px;margin-bottom:6px;">오픈할 자리 수</div>
          <div class="row gap2" style="align-items:center;">
            <button class="btn" data-action="makeup-create-seats-dec" ${dm.createSeats <= 0 ? "disabled" : ""}>−</button>
            <div style="font-weight:800;font-size:15px;min-width:40px;text-align:center;">${dm.createSeats}자리</div>
            <button class="btn" data-action="makeup-create-seats-inc">+</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="submit-create-makeup" ${!selectedAllowed || dm.createSeats < 1 || !cb.length ? "disabled" : ""}>보강 열기</button>
      `;
    }
  }

  return `
  <div class="modal-overlay" data-action="close-makeup-day-overlay">
    <div class="modal-box" style="max-width:760px;padding:18px;max-height:90vh;overflow-y:auto;">
      <div class="row between" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">${d.getMonth() + 1}월 ${d.getDate()}일(${dayLetter}) 보강 관리</div>
        <span style="cursor:pointer;" data-action="close-makeup-day">✕</span>
      </div>
      <div class="mk-timetable">${gridHeader}${gridRows}</div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">${panel}</div>
    </div>
  </div>`;
}

function renderAutoOpenModal() {
  const m = state.autoOpenModal;
  const days = ["일", "월", "화", "수", "목", "금", "토"];

  const rows = m.candidates.map((c, i) => {
    const d = new Date(c.date + "T00:00:00");
    const checked = m.selected.has(i);
    return `
      <label style="display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;">
        <input type="checkbox" data-action="toggle-auto-open-candidate" data-idx="${i}" ${checked ? "checked" : ""} style="margin-top:3px;" />
        <div style="font-size:13px;">
          <b>${c.date}(${days[d.getDay()]}) ${esc(c.time)} · ${c.roomNo}반</b>
          <div class="muted" style="font-size:12px;margin-top:2px;">
            현재 인원 ${c.occupied}/${AUTO_OPEN_FULL_SIZE} (남은 ${c.remaining}) → <b style="color:var(--brand);">보강 ${c.seatsToOpen}자리 오픈</b>
            · 평균 ${c.avgAge.toFixed(1)}세 → 대상 연령 ${formatBirthYearsAsAges(c.birthYears, state.rosterMeta ? state.rosterMeta.uploadedAt : 0)}
          </div>
        </div>
      </label>`;
  }).join("");

  return `
  <div class="modal-overlay" data-action="close-auto-open-modal-overlay">
    <div class="modal-box" style="max-width:600px;padding:18px;max-height:85vh;overflow-y:auto;">
      <div class="row between" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">🤖 자동 보강 자리 열기</div>
        <span style="cursor:pointer;" data-action="close-auto-open-modal">✕</span>
      </div>

      <div class="muted" style="font-size:12px;margin-bottom:12px;">
        한 반 정원을 ${AUTO_OPEN_FULL_SIZE}명으로 가정하고, 정규생·보강·대체·반이동in·신규는 +1, 결석·휴원은 -1로 계산해서
        그 시간에 실제 수업하는 인원 수에 따라 자동으로 보강 자리를 엽니다 (인원 1명 → 2자리 / 인원 2명 → 1자리 / 인원 3명 → 1자리).
        대상 연생은 그 반 학생들의 평균 나이 ±1년(평균 10세 이상이면 ±1.5년)으로 자동 설정돼요.
      </div>

      <div class="row gap2" style="margin-bottom:14px;flex-wrap:wrap;align-items:center;">
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--muted);">시작일</label><br/>
          <input type="date" id="auto-open-start-date" data-action="auto-open-start-date" value="${esc(m.startDate)}" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);font-size:13px;margin-top:4px;" />
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--muted);">종료일</label><br/>
          <input type="date" id="auto-open-end-date" data-action="auto-open-end-date" value="${esc(m.endDate)}" style="padding:7px 9px;border-radius:8px;border:1px solid var(--border);font-size:13px;margin-top:4px;" />
        </div>
        <button class="btn btn-primary" data-action="preview-auto-open" style="align-self:flex-end;">미리보기</button>
      </div>

      ${m.previewed ? `
        <div class="row between" style="margin-bottom:8px;align-items:center;">

            <span class="top-link-btn" style="font-size:12px;cursor:pointer;color:var(--flag-blue);" data-action="select-all-auto-open">전체 선택</span>
            <span style="font-size:12px;cursor:pointer;color:var(--muted);" data-action="deselect-all-auto-open">전체 해제</span>
          </div>
        </div>
        ${m.candidates.length === 0 ? `<div class="muted" style="padding:16px 0;text-align:center;font-size:13px;">이 기간엔 자동으로 열 만한 보강 후보가 없어요.</div>` : rows}
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px;" data-action="apply-auto-open" ${m.selected.size === 0 ? "disabled" : ""}>선택한 ${m.selected.size}건 보강 오픈하기</button>

    </div>
  </div>`;
}

function renderCalendarTab() {
  const now = new Date();
  const base = state.calendarMonth ? new Date(state.calendarMonth + "-01T00:00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = `${year}년 ${month + 1}월`;
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay(); // 0=일
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayISO = toISODate(now);

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const weekdayHeader = ["일", "월", "화", "수", "목", "금", "토"]
    .map((w, i) => `<div class="cal-weekday" style="${i === 0 ? "color:var(--danger);" : i === 6 ? "color:var(--flag-blue);" : ""}">${w}</div>`).join("");

  const dayCells = cells.map((d, i) => {
    if (d === null) return `<div class="cal-cell cal-cell-empty"></div>`;
    const dateISO = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const jsDay = i % 7;
    const isToday = dateISO === todayISO;
    const isViewing = state.viewDate === dateISO;
    const hasMemo = !!(state.listMemos[`${dateISO}::day`] && state.listMemos[`${dateISO}::day`].text);
    const hasLog = !!state.dayLogs[dateISO];
    const weekday = KOREAN_BY_JSDAY[jsDay];
    const clickable = weekday !== "일"; // 월~토만 클릭 가능 (일요일은 수업 없음)
    return `
      <div class="cal-cell ${isToday ? "cal-cell-today" : ""} ${isViewing ? "cal-cell-viewing" : ""} ${clickable ? "cal-cell-clickable" : ""}"
           ${clickable ? `data-action="pick-calendar-date" data-date="${dateISO}"` : ""}
           style="${jsDay === 0 ? "color:var(--danger);" : jsDay === 6 ? "color:var(--flag-blue);" : ""}">
        <div class="cal-cell-num">${d}</div>
        <div class="cal-cell-dot">${hasMemo ? "📝" : ""}${hasLog ? "📌" : ""}</div>
      </div>`;
  }).join("");

  return `
    <div class="card" style="max-width:520px;margin:0 auto;padding:20px;">
      <div class="row between" style="margin-bottom:14px;align-items:center;">
        <button class="btn" data-action="calendar-prev">◀</button>
        <div style="font-weight:800;font-size:17px;">${esc(monthLabel)}</div>
        <button class="btn" data-action="calendar-next">▶</button>
      </div>
      <div class="cal-grid cal-grid-header">${weekdayHeader}</div>
      <div class="cal-grid">${dayCells}</div>
      <div class="muted" style="font-size:12px;margin-top:14px;text-align:center;">
        날짜를 클릭하면 그날 기준으로 "오늘 등원" 화면을 볼 수 있어요.
        ${state.viewDate ? `<br/>지금 <b>${esc(state.viewDate)}</b> 날짜를 보는 중이에요. <span style="cursor:pointer;color:var(--flag-blue);text-decoration:underline;" data-action="reset-view-date">오늘로 돌아가기</span>` : ""}
      </div>
    </div>`;
}

function renderRegistryTab(studentsIndex) {
  const photoIdx = photoLookupIndex();
  const claimedPhotoKeys = new Set();
  const map = new Map();
  for (const s of studentsIndex.values()) {
    const photoKey = resolvePhotoKey(s.phone, s.name, photoIdx);
    claimedPhotoKeys.add(photoKey);
    const meta = state.photos[photoKey] || null;
    map.set(s.key, { ...s, photoKey, photo: meta?.photo || null, birthYear: meta?.birthYear || null, startDate: meta?.startDate || null });
  }
  for (const key of Object.keys(state.photos)) {
    if (claimedPhotoKeys.has(key)) continue;
    const p = state.photos[key];
    map.set(key, { key, photoKey: key, name: p.name, phone: p.phone, classes: [], photo: p.photo, birthYear: p.birthYear || null, startDate: p.startDate || null, noRoster: true });
  }
  // 사진도 없고 반 배정에도 없지만, 출결·상담 기록만 남아있는 학생도 찾아서 보여줌 (완전삭제로 정리할 수 있게)
  const counselingKeysWithRecords = Object.keys(state.counseling).filter((k) => (state.counseling[k].records || []).length > 0);
  for (const key of new Set([...Object.keys(state.attendance), ...counselingKeysWithRecords])) {
    if (map.has(key)) continue;
    const sepIdx = key.indexOf("__");
    if (sepIdx === -1) continue;
    const phone = key.slice(0, sepIdx);
    const name = key.slice(sepIdx + 2);
    if (!name) continue;
    map.set(key, { key, photoKey: key, name, phone, classes: [], photo: null, birthYear: null, startDate: null, noRoster: true, attendanceOnly: true });
  }
  const allList = Array.from(map.values()).map((s) => ({ ...s, inactive: s.noRoster || (s.status && s.status !== "재원") }));
  const inactiveCount = allList.filter((s) => s.inactive).length;
  const activeCount = allList.length - inactiveCount;
  const activeWithPhotoCount = allList.filter((s) => !s.inactive && s.photo).length;

  let list = allList;
  if (state.registryFilter === "active") list = list.filter((s) => !s.inactive);
  else if (state.registryFilter === "inactive") list = list.filter((s) => s.inactive);
  if (state.search.trim()) list = list.filter((s) => s.name.includes(state.search.trim()));
  if (state.registrySort === "missing_first") list.sort((a, b) => Number(!!a.photo) - Number(!!b.photo) || a.name.localeCompare(b.name, "ko"));
  else list.sort((a, b) => a.name.localeCompare(b.name, "ko"));

  const selectableKeys = list.map((s) => s.key);
  window.__registryVisibleKeys = selectableKeys; // for select-all handler
  window.__registryPhotoKeyByKey = Object.fromEntries(list.map((s) => [s.key, s.photoKey]));
  window.__registryNameByKey = Object.fromEntries(list.map((s) => [s.key, s.name]));
  const selectedCount = selectableKeys.filter((k) => state.registrySelected.has(k)).length;
  const allSelected = selectableKeys.length > 0 && selectedCount === selectableKeys.length;

  const rows = list.map((s) => {
    const meta = [];
    if (s.birthYear) meta.push(`${s.birthYear}년생(${new Date().getFullYear() - s.birthYear}세)`);
    if (s.startDate) { const d = parseDateValue(s.startDate); if (d) meta.push(`${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")} 시작`); }
    if (s.sessionsLeft !== null && s.sessionsLeft !== undefined) meta.push(`남은 ${s.sessionsLeft}회`);
    const scheduleText = (s.classes && s.classes.length)
      ? s.classes.map((c) => `${c.day} ${esc(c.time)} · ${esc(c.teacher)}`).join(", ")
      : "";
    const isOpen = state.attendanceOpenKey === s.key;
    return `
    <div class="card row gap3" style="margin-top:6px;${s.inactive ? "opacity:.7;" : ""}">
      <input type="checkbox" data-action="toggle-select" data-key="${esc(s.key)}" ${state.registrySelected.has(s.key) ? "checked" : ""} style="width:16px;height:16px;cursor:pointer;" />
      ${avatarHtml(s.name, s.photo, 54)}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:15px;">${esc(s.name)} ${meta.length ? `<span class="muted" style="font-weight:500;font-size:12px;">· ${esc(meta.join(" · "))}</span>` : ""}</div>
        <div class="muted" style="font-size:12px;">${esc(maskPhone(s.phone))} ${s.attendanceOnly ? "· ⚠️ 사진·반배정 없이 출결·상담 기록만 남아있음" : s.noRoster ? "· 현재 반 배정 없음" : s.status && s.status !== "재원" ? `· ${esc(s.status)}` : ""}</div>
        ${scheduleText ? `<div class="muted" style="font-size:12px;margin-top:2px;">🗓️ ${scheduleText}</div>` : ""}
      </div>
      <button class="btn ${isOpen ? "btn-primary" : ""}" data-action="toggle-attendance" data-key="${esc(s.key)}" data-name="${esc(s.name)}">📋 출결관리</button>
      <button class="btn" data-action="open-upload" data-key="${esc(s.key)}">📷 ${s.photo ? "변경" : "등록"}</button>
      ${s.photo ? `<button class="btn btn-danger" data-action="delete-photo" data-key="${esc(s.photoKey)}" data-name="${esc(s.name)}">🗑️</button>` : ""}
      ${s.inactive ? `<button class="btn btn-danger" data-action="open-delete-student" data-key="${esc(s.key)}" data-photokey="${esc(s.photoKey || s.key)}" data-name="${esc(s.name)}" title="사진·출결·상담 기록 전체 완전 삭제 (되돌릴 수 없음)">❌ 완전삭제</button>` : ""}
    </div>
    ${isOpen ? renderAttendancePanel() : ""}`;
  }).join("");

  return `
    <div class="row gap3" style="margin-bottom:12px;flex-wrap:wrap;">
      <div class="search-wrap-wide"><span class="search-icon">🔍</span><input id="search-input" data-action="search" value="${esc(state.search)}" placeholder="이름으로 검색" /></div>
      <button class="pill" data-action="toggle-sort">${state.registrySort === "missing_first" ? "미등록 우선 정렬" : "이름순 정렬"}</button>
      <button class="btn btn-primary" data-action="open-bulk-input">⬆️ 사진 일괄 업로드</button>
      <button class="btn" data-action="open-key-migration" title="학생 전화번호가 바뀌어 출결·상담 기록과 사진이 끊겼을 때 옛 기록을 새 번호로 옮겨줍니다">🔀 학생 기록 이전</button>
      <button class="btn" data-action="export-counseling-excel" title="상담 기록이 있는 학생만, 기록 건별로 한 줄씩 내보냅니다">📥 상담 내보내기</button>
      <button class="btn" data-action="export-all-counseling-excel" title="반배정에 있는 전체 학생 명단 기준으로, 학생당 한 줄로 상담내용을 모아 내보냅니다">📥 전체 상담 내보내기</button>
      <button class="btn" data-action="open-counseling-day-view" title="특정 날짜에 등록된 상담 내역을 모두 모아서 보여줍니다">📋 일일 상담 보고</button>
      <button class="btn" data-action="backup-export" title="지금까지 등록된 모든 사진·정보를 파일로 저장">💾 백업</button>
      <button class="btn" data-action="open-backup-import" title="백업 파일에서 사진·정보 불러오기">📤 복원</button>
    </div>
    <div class="wrap-gap" style="margin-bottom:10px;">
      <button class="pill ${state.registryFilter === "all" ? "active" : ""}" data-action="registry-filter" data-filter="all">전체 (${allList.length})</button>
      <button class="pill ${state.registryFilter === "active" ? "active" : ""}" data-action="registry-filter" data-filter="active">재원 중 (${activeCount})</button>
      <button class="pill ${state.registryFilter === "inactive" ? "active" : ""}" data-action="registry-filter" data-filter="inactive">퇴원·미배정 (${inactiveCount})</button>
      <span class="pill" style="cursor:default;background:var(--bg);">📷 재원 중 사진 등록 ${activeWithPhotoCount}/${activeCount}</span>
    </div>
    <div class="row gap3" style="margin-bottom:10px;flex-wrap:wrap;">
      <label class="row gap2" style="font-size:12px;cursor:pointer;">
        <input type="checkbox" data-action="toggle-select-all" ${allSelected ? "checked" : ""} ${selectableKeys.length === 0 ? "disabled" : ""} style="width:16px;height:16px;cursor:pointer;" />
        전체 선택
      </label>
      <div class="muted" style="font-size:12px;">전화번호+이름을 고유 키로 저장돼요. ${list.length}명 표시 중</div>
      ${selectedCount > 0 ? `<button class="btn btn-danger" data-action="bulk-delete">❌ 선택 완전삭제 (${selectedCount})</button>` : ""}
    </div>
    ${rows || `<div class="card" style="padding:30px;text-align:center;" class="muted">해당하는 학생이 없어요.</div>`}
  `;
}

function renderAttendancePanel() {
  const d = state.attendanceDraft;
  if (!d) return "";
  const lastYear = Number(d.lastYearInput) || 0;
  const adj = Number(d.adjInput) || 0;
  const remaining = computeRemainingMakeup({ logs: d.logs, lastYearRemaining: lastYear, adminAdjustment: adj });
  const counts = ATT_TYPE_ORDER.map((t) => ({ type: t, label: ATT_TYPE_LABELS[t], count: countAttType(d.logs, t) }));
  const sortedLogs = d.logs.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const att = getAttendance(d.key);
  const archiveYears = Object.keys(att.archives || {}).sort((a, b) => b - a);

  const logRow = (l) => {
    if (d.editingLogs) {
      return `

    return `<div style="font-size:13px;margin-top:4px;"><b>${esc(l.date)}</b> · ${esc(ATT_TYPE_LABELS[l.type] || l.type)}${detail ? ` <span class="muted" style="font-size:12px;">(${esc(detail)})</span>` : ""}</div>`;

      </div>
      ${counts.map((c) => `

    ${archiveYears.length ? `

        ${archiveYears.map((y) => {
          const isExpanded = state.attendanceExpandedYear === y;

          const remainingDisplay = isEditing ? ad.remainingAtEnd : att.archives[y].remainingAtEnd;

              <span class="muted" style="font-size:12px;">${esc(y)}년 · 마감 시 남은 보강 ${remainingDisplay} · 기록 ${yearLogs.length}건</span>
            </div>
            ${isExpanded ? `
              <div style="margin-left:18px;margin-top:4px;">
                <div style="max-height:220px;overflow-y:auto;">
                  ${yearLogs.length ? yearLogs.map((l) => {
                    if (isEditing) {
                      return `
                      <div class="row gap2" style="margin-top:6px;flex-wrap:wrap;">
                        <input id="att-arch-log-date-${esc(l.id)}" type="date" value="${esc(l.date)}" data-action="att-archive-log-date" data-logid="${esc(l.id)}" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12px;" />
                        <select id="att-arch-log-type-${esc(l.id)}" data-action="att-archive-log-type" data-logid="${esc(l.id)}" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12px;">
                          ${ATT_TYPE_ORDER.map((t) => `<option value="${t}" ${l.type === t ? "selected" : ""}>${ATT_TYPE_LABELS[t]}</option>`).join("")}
                        </select>
                        <input id="att-arch-log-note-${esc(l.id)}" data-action="att-archive-log-note" data-logid="${esc(l.id)}" value="${esc(l.note || "")}" placeholder="메모(선택)" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12px;width:140px;" />
                        <button class="btn btn-danger" data-action="att-archive-remove-log" data-logid="${esc(l.id)}" style="padding:4px 8px;">×</button>
                      </div>`;
                    }
                    { const detail = [l.teacher ? `${l.teacher}` : "", l.time ? formatTimeKorean(l.time) : "", l.by ? `👤${l.by}` : "", l.note ? `📝${l.note}` : ""].filter(Boolean).join(" · ");
                      return `<div style="font-size:12px;margin-top:3px;"><b>${esc(l.date)}</b> · ${esc(ATT_TYPE_LABELS[l.type] || l.type)}${detail ? ` <span class="muted">(${esc(detail)})</span>` : ""}</div>`; }
                  }).join("") : `<div class="muted" style="font-size:12px;">기록 없음</div>`}
                </div>
                ${isEditing ? `
                  <div style="margin-top:8px;">
                    <label class="muted" style="font-size:11px;font-weight:700;">마감 시 남은 보강</label><br/>
                    <input id="att-arch-remaining-input" value="${esc(ad.remainingAtEnd)}" data-action="att-archive-remaining-input" inputmode="numeric" style="width:80px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;margin-top:4px;" />
                  </div>
                  <div class="row gap2" style="margin-top:8px;">
                    <button class="btn" data-action="att-archive-add-log" style="padding:4px 10px;font-size:12px;">+ 로그 추가</button>
                    <button class="btn btn-primary" data-action="att-save-archive" style="padding:4px 10px;font-size:12px;">저장</button>
                    <button class="btn" data-action="att-cancel-archive-edit" style="padding:4px 10px;font-size:12px;">취소</button>
                  </div>
                ` : `<button class="btn" data-action="att-edit-archive" data-year="${esc(y)}" style="padding:4px 10px;font-size:12px;margin-top:8px;">수정</button>`}
              </div>` : ""}
          </div>`;
        }).join("")}
      </div>` : ""}

    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;">
      <div class="muted" style="font-size:11px;">연말 정산은 사람이 누르는 버튼 없이, 매년 1월 1일 밤 10시에 서버에서 전체 학생을 자동으로 처리해요. 마감 이후 특정 학생만 수정이 필요하면, 아래 "지난 연도 로그"에서 그 학생만 "수정"으로 직접 고치면 돼요.</div>

const IMPORT_TYPE_LABEL = {
  absent: "결석", moveIn: "반이동 IN", moveOut: "반이동 OUT", leave: "휴원", withdrawn: "퇴원",
  makeup: "보강", substitute: "대체", newStudent: "신규",
};

function renderScheduleImportModal() {
  const f = state.scheduleImportFlow;

  if (f.step === "collect") {
    const dateObj = new Date(f.targetDateISO + "T00:00:00");
    const dayLetter = KOREAN_BY_JSDAY[dateObj.getDay()];
    const times = IMPORT_DAY_TIMES[dayLetter] || [];
    const roomCount = importRoomCount();

    return `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:520px;max-height:85vh;overflow-y:auto;padding:20px;">
        <div class="row between" style="margin-bottom:10px;">
          <div style="font-weight:800;font-size:16px;">📥 스케줄 가져오기</div>
          <span style="cursor:pointer;" data-action="close-schedule-import">✕</span>
        </div>
        <p class="muted" style="font-size:12px;margin-bottom:10px;">엑셀에서 그 요일의 "선생님+학생" 두 열 전체(하루치, 위에서 아래로 시간대 순서대로)를 선택해서 복사(Ctrl+C)한 뒤, 아래 칸을 클릭하고 Ctrl+V 하세요. 몇 번째 줄인지로 시간대를 자동으로 계산해요.</p>

        <label style="font-size:12px;font-weight:700;">날짜</label>
        <input id="schedule-import-date" type="date" value="${esc(f.targetDateISO)}" data-action="schedule-import-date" style="width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);font-size:13px;margin:4px 0 10px;" />

        <div class="muted" style="font-size:12px;margin-bottom:10px;">
          ${esc(dayLetter)}요일 · 교실 ${roomCount}개 × ${times.length}개 시간대(${times.map((t) => esc(formatTimeKorean(t))).join(", ")}) = 총 ${roomCount * times.length}줄을 붙여넣으시면 돼요.
        </div>

        <label style="font-size:12px;font-weight:700;">붙여넣기 영역 (여기 클릭 후 Ctrl+V)</label>
        <div id="schedule-paste-area" contenteditable="true" data-action="schedule-paste-target"
             style="min-height:140px;max-height:280px;overflow-y:auto;border:2px dashed var(--accent);border-radius:10px;padding:10px;font-size:13px;margin:4px 0 14px;background:#FFFDF5;"
        >${f.pasteBuffer || `<span style="color:#999;">여기를 클릭하고 Ctrl+V로 붙여넣으세요...</span>`}</div>

        <button class="btn btn-primary" data-action="schedule-import-parse-paste" style="width:100%;justify-content:center;padding:10px;" ${times.length === 0 ? "disabled" : ""}>파싱해서 미리보기</button>
      </div>
    </div>`;
  }

  if (f.loading) {
    return `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:380px;padding:30px;text-align:center;">
        <div class="muted">파싱 중이에요...</div>
      </div>
    </div>`;
  }

  if (f.error) {
    return `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:380px;padding:20px;">
        <div class="row between" style="margin-bottom:14px;">
          <div style="font-weight:800;font-size:16px;">오류</div>
          <span style="cursor:pointer;" data-action="close-schedule-import">✕</span>
        </div>
        <p style="color:var(--danger);font-size:13px;">${esc(f.error)}</p>
      </div>
    </div>`;
  }

  // preview 단계
  const entries = f.entries;
  const grouped = {};
  for (const e of entries) {
    const key = e.type;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(e);
  }
  const needsPhoneCount = entries.filter((e) => e.include && e.kind === "addition" && !e.matchedKey && !e.manualPhone.trim()).length;
  const readyCount = entries.filter((e) => e.include).length;

  const rows = Object.entries(grouped).map(([type, list]) => `
    <div style="margin-top:16px;">
      <div style="font-weight:800;font-size:15px;margin-bottom:8px;color:${LIST_TAG_COLOR[type] || "var(--ink)"};">${esc(IMPORT_TYPE_LABEL[type] || type)} (${list.length}건)</div>
      ${list.map((e) => {
        const needsClassNo = e.kind === "addition" && !e.classNo;
        const needsStudent = e.kind === "override" && !e.matchedKey;
        const needsPhone = e.kind === "addition" && !e.matchedKey;
        return `
        <div class="row gap3" style="align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;">
          <input type="checkbox" data-action="schedule-import-toggle" data-id="${esc(e.id)}" ${e.include ? "checked" : ""} style="width:18px;height:18px;flex-shrink:0;" />
          <div style="min-width:150px;font-size:15px;">
            <span style="font-weight:700;color:var(--ink);">${esc(e.name)}${esc(e.age)}세</span>
            <span style="font-weight:800;color:${LIST_TAG_COLOR[type] || "var(--ink)"};">(${esc(IMPORT_TYPE_LABEL[type] || type)})</span>
          </div>
          <div class="muted" style="font-size:13px;min-width:170px;">${esc(e.teacher)} · ${esc(formatTimeKorean(e.time))}${e.classNo ? ` · ${esc(e.classNo)}반` : ""}</div>
          ${needsClassNo ? `<span style="color:var(--danger);font-size:13px;">⚠️ 반 번호를 못 찾았어요(제외됨)</span>` : ""}
          ${needsStudent ? `<span style="color:var(--danger);font-size:13px;">⚠️ DB에서 학생을 못 찾았어요(제외됨)</span>` : ""}
          ${e.alreadyRegular ? `<span style="color:var(--accent);font-size:13px;">⚠️ 이미 이 반 정규생이에요 — 추가하면 중복 표시돼요 (기본 체크 해제됨)</span>` : ""}
          ${needsPhone ? `
            <span class="muted" style="font-size:13px;">DB에 없는 학생 · 전화번호</span>
            <input id="schedule-import-phone-${esc(e.id)}" data-action="schedule-import-phone" data-id="${esc(e.id)}" value="${esc(e.manualPhone)}" placeholder="010-0000-0000" style="width:150px;padding:6px 9px;border-radius:8px;border:1px solid var(--border);font-size:13px;" />
          ` : e.matchedKey ? `<span class="muted" style="font-size:13px;">✅ ${esc(maskPhone(e.matchedPhone))}</span>` : ""}
        </div>`;
      }).join("")}
    </div>`).join("");

  return `
  <div class="modal-overlay">
    <div class="modal-box" style="max-width:820px;max-height:85vh;overflow-y:auto;padding:22px;">
      <div class="row between" style="margin-bottom:6px;">
        <div style="font-weight:800;font-size:17px;">📥 스케줄 가져오기 · ${esc(f.targetDateISO)} (${esc(f.dayLetter)}요일)</div>
        <span style="cursor:pointer;" data-action="close-schedule-import">✕</span>
      </div>
      <p class="muted" style="font-size:13px;margin-bottom:8px;">적용하면 이렇게 바뀌어요. 확인하고, DB에 없는 신규/보강/대체 학생은 전화번호를 입력해 주세요. 필요 없는 항목은 체크 해제하면 적용에서 빠져요.</p>
      ${entries.length === 0 ? `<div class="muted" style="padding:20px;text-align:center;">${esc(f.targetDateISO)}에 해당하는 항목을 찾지 못했어요.</div>` : rows}
      ${entries.length > 0 ? `
        <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
          ${needsPhoneCount > 0 ? `<div style="color:var(--danger);font-size:13px;margin-bottom:8px;">⚠️ 전화번호가 필요한 항목이 ${needsPhoneCount}건 남아있어요.</div>` : ""}
          <button class="btn btn-primary" data-action="schedule-import-apply" style="padding:11px 22px;font-size:14px;" ${needsPhoneCount > 0 ? "disabled" : ""}>✅ 선택한 ${readyCount}건 적용</button>
        </div>` : ""}
    </div>
  </div>`;
}

function computeGroupRecipients(category) {
  const day = state.selectedDay && state.selectedDay !== ALL_DAY ? state.selectedDay : getViewTodayLetter();
  const dateISO = toISODate(getWeekDates(getViewBaseDate())[day]);
  const list = [];
  for (const a of Object.values(state.additions)) {
    if (a.type !== category) continue;
    if (additionMatchesDate(a, dateISO, day)) list.push(a);
  }
  return list.map((a) => ({ key: a.studentKey, name: a.name, phone: a.phone, day: a.day, time: a.time, dateISO: a.recurring ? dateISO : a.dateISO }));
}

function openGroupSms(category) {
  state.smsCompose = {
    mode: "group", category,
    recipients: computeGroupRecipients(category),
    message: getSmsTemplateText(category),
    subject: getSmsTemplateTitle(category),
    scheduleAt: defaultScheduleAtValue(), manualAddOpen: false, manualName: "", manualPhone: "", previewIndex: 0,
  };
  render();
}

const SMS_QUEUE_STATUS_META = {
  pending: { label: "대기중", color: "#b8860b", bg: "#fff7e0" },
  sent: { label: "발송완료", color: "#1a7f37", bg: "#e9f9ee" },
  failed: { label: "실패", color: "#c0392b", bg: "#fdecea" },
  cancelled: { label: "취소됨", color: "#666", bg: "#f0f0f0" },
};

function formatQueueDateTime(ts) {
  if (!ts) return "즉시 발송";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]}) ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function renderSmsQueueModal() {
  const q = (state.smsQueueSearch || "").trim();
  const statusFilter = state.smsQueueStatusFilter || "all";
  const allEntries = Object.entries(state.smsQueue || {}).map(([docKey, v]) => ({ docKey, ...v }));
  const counts = { all: allEntries.length, pending: 0, sent: 0, failed: 0, cancelled: 0 };
  for (const e of allEntries) counts[e.status] = (counts[e.status] || 0) + 1;

  const entries = allEntries
    .filter((e) => statusFilter === "all" || e.status === statusFilter)
    .filter((e) => {
      if (!q) return true;
      const recipients = e.recipients || [];
      const inRecipients = recipients.some((r) => (r.name || "").includes(q) || (r.phone || "").includes(q));
      const inMessage = (recipients[0]?.message || e.messageTemplate || "").includes(q);
      return inRecipients || inMessage;
    })
    .sort((a, b) => {
      // 대기중인 것을 먼저, 그 다음은 예약 시각(빠른 순), 예약 없는 즉시발송은 맨 뒤로
      const rank = (s) => (s === "pending" ? 0 : 1);
      if (rank(a.status) !== rank(b.status)) return rank(a.status) - rank(b.status);
      const t = (s) => (s ? new Date(s).getTime() : Infinity);
      return t(a.scheduleAt) - t(b.scheduleAt) || (b.createdAt || 0) - (a.createdAt || 0);
    });

  const filterTab = (key, label) => `<button class="pill ${statusFilter === key ? "active" : ""}" data-action="sms-queue-filter" data-status="${key}">${label}${counts[key] ? ` (${counts[key]})` : ""}</button>`;

  const rows = entries.length === 0
    ? `<div class="muted" style="padding:24px 0;text-align:center;font-size:13px;">${q ? "검색 결과가 없어요." : "해당하는 문자가 없어요."}</div>`
    : entries.map((e) => {
        const meta = SMS_QUEUE_STATUS_META[e.status] || SMS_QUEUE_STATUS_META.pending;
        const names = (e.recipients || []).map((r) => r.name).join(", ") || "(수신자 없음)";
        const preview = (e.recipients && e.recipients[0]?.message) || e.messageTemplate || "";
        const shortPreview = preview.length > 40 ? preview.slice(0, 40) + "…" : preview;
        const isExpanded = state.smsQueueExpanded === e.docKey;

        // 서버가 처리 후 붙여주는 추가 정보(있을 때만 표시) — 보낸 사람, 처리 시각, 실패 사유 등
        const extraLines = [];
        if (e.createdBy) extraLines.push(`보낸 사람: ${esc(e.createdBy)}`);
        if (e.processedAt) extraLines.push(`처리 시각: ${esc(formatQueueDateTime(e.processedAt))}`);
        if (e.errorReason || e.error) extraLines.push(`실패 사유: ${esc(e.errorReason || e.error)}`);

        const detail = !isExpanded ? "" : `
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
            <div style="font-size:12px;font-weight:700;margin-bottom:6px;">수신자 ${(e.recipients || []).length}명</div>
            ${(e.recipients || []).map((r) => `
              <div style="font-size:12px;margin-bottom:6px;">
                <b>${esc(r.name)}</b> · ${esc(r.phone || "번호 없음")}
                <div class="muted" style="white-space:pre-wrap;margin-top:2px;">${esc(r.message || "")}</div>
              </div>`).join("")}
            ${extraLines.length > 0 ? `<div class="muted" style="font-size:11px;margin-top:6px;">${extraLines.join(" · ")}</div>` : ""}
          </div>`;

        return `
        <div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;" data-action="toggle-sms-queue-detail" data-key="${esc(e.docKey)}">
          <div class="row between" style="align-items:flex-start;">
            <div style="flex:1;min-width:0;">
              <div class="row gap2" style="align-items:center;flex-wrap:wrap;">
                <span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;color:${meta.color};background:${meta.bg};">${meta.label}</span>
                <span style="font-size:12px;font-weight:700;">${esc(formatQueueDateTime(e.scheduleAt))}</span>
              </div>
              <div style="font-size:13px;font-weight:700;margin-top:6px;">${esc(names)} <span class="muted" style="font-weight:500;">(${(e.recipients || []).length}명)</span></div>
              ${!isExpanded ? `<div class="muted" style="font-size:12px;margin-top:2px;white-space:pre-wrap;">${esc(shortPreview)}</div>` : ""}
            </div>
            ${e.status === "pending" ? `<button class="btn" style="flex-shrink:0;margin-left:8px;" data-action="cancel-sms-queue-item" data-key="${esc(e.docKey)}">취소</button>` : ""}
          </div>
          ${detail}
        </div>`;
      }).join("");

  return `
  <div class="modal-overlay" data-action="close-sms-queue-overlay">
    <div class="modal-box" style="max-width:440px;padding:18px;max-height:80vh;overflow-y:auto;">
      <div class="row between" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">문자 대기열</div>
        <span style="cursor:pointer;" data-action="close-sms-queue">✕</span>
      </div>
      <div class="wrap-gap" style="margin-bottom:10px;">
        ${filterTab("all", "전체")}${filterTab("pending", "대기중")}${filterTab("sent", "발송완료")}${filterTab("failed", "실패")}${filterTab("cancelled", "취소됨")}
      </div>
      <div class="search-wrap-wide" style="margin-bottom:12px;"><span class="search-icon">🔍</span><input id="sms-queue-search-input" data-action="sms-queue-search" value="${esc(state.smsQueueSearch || "")}" placeholder="이름 또는 전화번호로 검색" /></div>
      ${rows}
      <div class="muted" style="font-size:11px;margin-top:6px;">※ "대기중"인 문자만 취소할 수 있어요. 항목을 눌러 수신자별 상세(전화번호·전체 메시지)를 볼 수 있어요.</div>
    </div>
  </div>`;
}

/* ---------- bulk matching logic ---------- */

async function handleBulkFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const allStudents = Array.from(buildStudentsIndex().values());
  state.bulkAllStudents = allStudents;
  const queue = [];
  for (const file of files) {
    const guess = guessNameFromFilename(file.name);
    const matches = allStudents.filter((s) => s.name === guess);
    let preview = null;
    try { preview = await resizeImageFile(file, 160, 0.75); } catch (e) {}
    queue.push({ id: `${file.name}-${file.lastModified}-${Math.random().toString(36).slice(2, 7)}`, file, preview, guess, matches, resolvedKey: matches.length === 1 ? matches[0].key : "" });
  }
  state.pendingBulk = queue;
  render();
}

async function confirmBulkSave() {
  const resolved = state.pendingBulk.filter((p) => p.resolvedKey);
  for (const p of resolved) {
    const student = state.bulkAllStudents.find((s) => s.key === p.resolvedKey) || (() => {
      const [phone, name] = p.resolvedKey.split("__");
      return { key: p.resolvedKey, name, phone };
    })();
    try {
      const dataUrl = await resizeImageFile(p.file);
      await savePhotoForKey(student.key, student.name, student.phone, dataUrl);
    } catch (e) {}
  }
  showToast(`${resolved.length}건 등록 완료`);
  state.pendingBulk = [];
  render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "tab") { state.tab = el.dataset.tab; state.search = ""; state.registrySelected.clear(); render(); }
  else if (action === "select-day") { state.selectedDay = el.dataset.day; render(); }
  else if (action === "reset-view-date") {
    state.viewDate = null;
    state.selectedDay = getViewTodayLetter();
    render();
  }
  else if (action === "pick-calendar-date") {
    state.viewDate = el.dataset.date;
    state.selectedDay = getViewTodayLetter();
    state.tab = "today";
    render();
  }
  else if (action === "calendar-prev" || action === "calendar-next") {
    const now = new Date();
    const base = state.calendarMonth ? new Date(state.calendarMonth + "-01T00:00:00") : new Date(now.getFullYear(), now.getMonth(), 1);
    base.setMonth(base.getMonth() + (action === "calendar-prev" ? -1 : 1));
    state.calendarMonth = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, "0")}`;
    render();
  }
  else if (action === "toggle-list-view") { state.listViewMode = !state.listViewMode; render(); }
  else if (action === "toggle-teacher-filter") {
    const t = el.dataset.teacher;
    if (state.teacherFilter.has(t)) state.teacherFilter.delete(t); else state.teacherFilter.add(t);
    render();
  }
  else if (action === "clear-teacher-filter") { state.teacherFilter.clear(); render(); }
  else if (action === "open-day-report") {
    const dateISO = el.dataset.date, dayLetter = el.dataset.day;
    const saved = state.dayLogs[dateISO];
    state.dayReportDraft = saved ? saved.text : buildDailyReportDraft(dateISO, dayLetter);
    state.dayReportEditing = dateISO;
    state.dayLogExpanded = true;
    render();
  }
  else if (action === "cancel-day-report") { state.dayReportEditing = null; render(); }
  else if (action === "save-day-report") { saveDayLogText(el.dataset.date, state.dayReportDraft); }
  else if (action === "toggle-day-log") { state.dayLogExpanded = !state.dayLogExpanded; render(); }
  else if (action === "delete-day-log") {
    if (confirm("저장된 기록을 삭제할까요? 되돌릴 수 없어요.")) deleteDayLog(el.dataset.date);
  }
  else if (action === "toggle-list-memo") {
    const key = el.dataset.key;
    if (state.listMemoEditingKey === key) { state.listMemoEditingKey = null; }
    else { state.listMemoEditingKey = key; state.listMemoDraftText = (state.listMemos[key] && state.listMemos[key].text) || ""; }
    render();
  }
  else if (action === "cancel-list-memo") { state.listMemoEditingKey = null; render(); }
  else if (action === "save-list-memo") { saveListMemo(el.dataset.key, state.listMemoDraftText); }
  else if (action === "refresh") { if (TEST_MODE) loadAll(); else { showToast("실시간으로 자동 갱신되고 있어요"); render(); } }
  else if (action === "print-view") { window.print(); }
  else if (action === "capture-screen") { captureScreenshot(); }
  else if (action === "logout") { signOut(auth); }
  else if (action === "select-center") {
    localStorage.setItem(CENTER_STORAGE_KEY, el.dataset.center);
    location.reload();
  }
  else if (action === "change-center") {
    if (confirm("사용 중인 원을 변경할까요? 페이지가 새로고침되며, 변경 후 다시 로그인해야 해요.")) {
      localStorage.removeItem(CENTER_STORAGE_KEY);
      location.reload();
    }
  }
  else if (action === "google-login") {
    (async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (!isGoogleUserAllowed(result.user)) {
          await signOut(auth);
          state.loginError = "이 구글 계정은 허용되지 않았어요. 담당자에게 문의해 주세요.";
          render();
          return;
        }
        state.loginError = "";
      } catch (err) {
        console.error(err);
        if (err.code !== "auth/popup-closed-by-user") {
          state.loginError = "구글 로그인에 실패했어요. 다시 시도해 주세요.";
          render();
        }
      }
    })();
  }
  else if (action === "toggle-sort") { state.registrySort = state.registrySort === "missing_first" ? "name" : "missing_first"; render(); }
  else if (action === "toggle-attendance") {
    const key = el.dataset.key, name = el.dataset.name;
    if (state.attendanceOpenKey === key) {
      state.attendanceOpenKey = null; state.attendanceDraft = null; state.counselingDraft = null;
      state.attendanceExpandedYear = null; state.attendanceArchiveDraft = null;
    } else {
      openAttendancePanel(key, name);
    }
    render();
  }
  else if (action === "goto-attendance") {
    const key = el.dataset.key, name = el.dataset.name;
    state.overrideStudent = null;
    state.makeupAttendanceFlow = null;
    state.tab = "registry";
    state.registryFilter = "all";
    state.search = name; // 검색창에 이름을 채워서 그 학생만 바로 보이게 함 (스크롤 안 해도 되게)
    openAttendancePanel(key, name);
    render();
  }
  else if (action === "toggle-archive-year") {
    const y = el.dataset.year;
    state.attendanceExpandedYear = state.attendanceExpandedYear === y ? null : y;
    state.attendanceArchiveDraft = null; // 다른 연도로 옮기면 수정 중이던 내용은 취소
    render();
  }
  else if (action === "att-edit-archive") {
    const y = el.dataset.year;
    const att = getAttendance(state.attendanceOpenKey);
    const arch = (att.archives && att.archives[y]) || { logs: [], remainingAtEnd: 0 };
    state.attendanceArchiveDraft = {
      year: y,
      logs: JSON.parse(JSON.stringify(arch.logs || [])),
      remainingAtEnd: String(arch.remainingAtEnd || 0),
    };
    render();
  }
  else if (action === "att-cancel-archive-edit") { state.attendanceArchiveDraft = null; render(); }
  else if (action === "att-archive-add-log") {
    state.attendanceArchiveDraft.logs.push({ id: `new_${Math.random().toString(36).slice(2, 8)}`, type: "absent", date: toISODate(new Date()) });
    render();
  }
  else if (action === "att-archive-remove-log") {
    state.attendanceArchiveDraft.logs = state.attendanceArchiveDraft.logs.filter((l) => l.id !== el.dataset.logid);
    render();
  }
  else if (action === "att-save-archive") {
    (async () => {
      const ad = state.attendanceArchiveDraft;
      const key = state.attendanceOpenKey;
      const att = { ...defaultAttendance(), ...getAttendance(key) };
      const archives = { ...(att.archives || {}) };
      archives[ad.year] = { logs: ad.logs, remainingAtEnd: Number(ad.remainingAtEnd) || 0 };
      att.archives = archives;
      await saveAttendanceDoc(key, att);
      state.attendanceArchiveDraft = null;
      render();
      showToast(`${ad.year}년 기록을 저장했어요`);

    if (p.sameKey || !p.oldExists) return;
    const what = [p.oldAttExists ? `출결 ${p.oldLogCount}건` : "", p.oldCounselingExists ? `상담 ${p.oldCounselingCount}건` : "", p.oldPhotoExists ? "사진" : ""].filter(Boolean).join(" · ");
    if (confirm(`"${m.oldName}(${m.oldPhone})"의 기록(${what})을 "${m.newName}(${m.newPhone})"으로 옮길까요? 이 작업은 되돌릴 수 없어요.`)) {
      executeKeyMigration(m);
    }
  }
  else if (action === "switch-sms-category") { openGroupSms(el.dataset.category); }
  else if (action === "close-sms-compose" || action === "close-sms-compose-overlay") {
    if (action === "close-sms-compose-overlay" && e.target !== el) return;
    state.smsCompose = null; render();
  }
  else if (action === "remove-sms-recipient") {
    state.smsCompose.recipients.splice(Number(el.dataset.index), 1);

    render();
  }
  else if (action === "sms-preview-prev") {
    const c = state.smsCompose;
    c.previewIndex = ((c.previewIndex || 0) - 1 + c.recipients.length) % c.recipients.length;
    render();
  }
  else if (action === "sms-preview-next") {
    const c = state.smsCompose;
    c.previewIndex = ((c.previewIndex || 0) + 1) % c.recipients.length;
    render();
  }
  else if (action === "open-sms-manual-add") { state.smsCompose.manualAddOpen = true; render(); }

  }

  }
  else if (action === "reset-sms-template") {
    if (!confirm("이 유형의 문구를 원래 기본값으로 되돌릴까요? (지금 저장된 내용은 사라져요)")) return;
    const c = state.smsCompose;

    showToast("기본값으로 초기화했어요. 저장하려면 '템플릿 저장'을 눌러주세요.");

  else if (action === "send-sms-now" || action === "send-sms-scheduled") {

    if (action === "send-sms-scheduled" && !c.scheduleAt) { showToast("예약 시각을 선택해 주세요", "error"); return; }

    const maxBytes = Math.max(...c.recipients.map((r) => smsByteLength(renderSmsTokens(c.message, r))));
    if (maxBytes > 90 && !c.subject.trim()) {
      showToast("90바이트가 넘는 장문 문자예요. 제목을 입력해 주세요.", "error");
      return;
    }
    queueSms(c.recipients, c.message, c.subject, action === "send-sms-scheduled" ? c.scheduleAt : null);
    state.smsCompose = null;
    render();
  }
  else if (action === "delete-photo") { deletePhotoForKey(el.dataset.key, el.dataset.name); }
  else if (action === "sms-absence-send") {
    const recipients = Array.from(state.smsSelected.entries()).map(([k, meta]) => ({
      key: k, name: meta.name, phone: meta.phone, day: meta.day, time: meta.time,

    state.smsCompose = { mode: "absence", category: "absence", recipients, message: getSmsTemplateText("absence"), subject: getSmsTemplateTitle("absence"), scheduleAt: defaultScheduleAtValue(), manualAddOpen: false, manualName: "", manualPhone: "", previewIndex: 0 };

  else if (action === "bulk-delete") {

    if (keys.length === 0) return;
    const pw = prompt(`선택한 학생 ${keys.length}명을 완전히 삭제합니다.\n사진·출결·상담 기록이 모두 사라지고 되돌릴 수 없어요.\n계속하려면 비밀번호를 입력하세요.`);
    if (pw === null) return;

    if (!confirm(`정말 ${keys.length}명을 완전히 삭제할까요? 되돌릴 수 없어요.`)) return;
    (async () => {
      for (const key of keys) {

        const name = (window.__registryNameByKey && window.__registryNameByKey[key]) || "";

  else if (action === "cancel-bulk") { state.pendingBulk = []; render(); }
  else if (action === "confirm-bulk") { confirmBulkSave(); }
});

const TEXT_INPUT_ACTIONS = new Set([
  "search", "addition-search", "addition-manual-name", "addition-manual-age", "addition-manual-phone",
  "sms-message", "sms-manual-name", "sms-manual-phone", "sms-schedule", "sms-subject",

  "att-lastyear-input", "att-adj-input", "att-memo-input", "delete-student-pin", "att-archive-remaining-input", "list-memo-input", "day-report-input", "att-log-note", "att-archive-log-note", "schedule-import-phone", "counseling-new-content",

// 어떤 입력창이든(로그인 폼, 붙여넣기 영역 포함) 조합이 시작되면 화면 갱신을 멈춤
document.addEventListener("compositionstart", () => { isComposing = true; });
function finishComposition(target) {
  isComposing = false;
  const action = target && target.dataset && target.dataset.action;
  const tracked = !!(action && TEXT_INPUT_ACTIONS.has(action));
  if (tracked) applyTextInput(action, target.value, target);
  // 조합이 완전히 끝난 직후 바로 다시 그리면 브라우저가 정리를 끝내기 전에
  // 입력창이 재생성되면서 마지막 글자가 깨질 수 있어, 한 박자 늦춰서 다시 그림
  if (tracked || renderPending) scheduleRender();
}
document.addEventListener("compositionend", (e) => finishComposition(e.target));
// 조합 중에 포커스가 다른 곳으로 옮겨가면(창 전환 등) compositionend가 안 올 수도 있어,
// 플래그가 영영 안 풀려 화면이 멈추는 일이 없게 안전장치
document.addEventListener("focusout", (e) => { if (isComposing) finishComposition(e.target); });
let pendingFlushTimer = null;
function flushPendingRender() { clearTimeout(pendingFlushTimer); if (renderPending) scheduleRender(); }
document.addEventListener("pointerdown", () => { pointerDownAt = Date.now(); }, true);
function releasePointer() {
  pointerDownAt = 0;
  // click까지 다 끝난 뒤에 밀린 render를 실행함. click이 안 오는 경우(스크롤·드래그 등)를 위해 타이머로도 보장
  clearTimeout(pendingFlushTimer);
  pendingFlushTimer = setTimeout(flushPendingRender, 300);
}
document.addEventListener("pointerup", releasePointer, true);
document.addEventListener("pointercancel", releasePointer, true);
document.addEventListener("click", flushPendingRender); // 위의 위임 click 핸들러(먼저 등록됨)가 처리를 끝낸 뒤 실행됨
document.addEventListener("input", (e) => {
  const action = e.target.dataset && e.target.dataset.action;
  if (!action || !TEXT_INPUT_ACTIONS.has(action)) return;
  applyTextInput(action, e.target.value, e.target);
  // 브라우저 네이티브 e.isComposing을 우선 신뢰 (우리가 직접 추적하는 변수보다 타이밍이 정확함).
  // 빠르게 연타할 때 우리 쪽 compositionstart/end 처리가 한 박자 늦게 따라오는 경우가 있어서 이 값도 같이 확인함.
  if (!e.isComposing && !isComposing) scheduleRender(); // skip re-render mid-composition so 한글 조합이 끊기지 않음
});
// 브라우저가 Enter로 줄바꿈을 넣거나 커서를 옮기는 등 자기 할 일을 먼저 다 끝내게 한 박자
// 미룬 뒤 화면을 다시 그림 (동기적으로 바로 다시 그리면 그 처리와 겹치면서 줄바꿈이 씹힐 수 있음)
let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    render(); // 아직 조합 중이면 render()가 알아서 미뤄둠
  });
}
function applyTextInput(action, value, el) {

// 리스트 뷰 데이터를 캔버스에 직접 그림 (외부 캡쳐 라이브러리에 의존하지 않아 훨씬 안정적)
const LIST_TAG_HEX = {
  absent: "#C0533B", sickLeave: "#C0533B", noshow: "#C0533B", makeupAbsent: "#C0533B",
  moveIn: "#218A4E", moveOut: "#218A4E",

const LIST_NAME_HEX_OVERRIDE = {
  newStudent: "#7C4DBE",
  makeup: "#2E9BD6",
  moveIn: "#218A4E",
  substitute: "#8B5E34",
  leave: "#D6336C",
