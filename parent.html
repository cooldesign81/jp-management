<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#FECD3F" />
<title>자라다 보강 예약</title>
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --brand-orange:#DE8619; --brand-yellow:#FECD3F; --ink:#222222; --ink-deep:#161616;
    --text:#4E4E4E; --text-sub:#767676; --bg:#F5F5F5; --line:#EEEEEE; --danger:#D1182A; --blue:#1968A1; --ok:#1a7f37;
    --font:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font); background:var(--bg); color:var(--text); font-size:15px; -webkit-text-size-adjust:100%; }
  button{ font-family:inherit; }
  .top{ background:var(--ink-deep); color:#fff; font-size:12px; padding:6px 16px; display:flex; justify-content:space-between; }
  .bar{ background:var(--brand-yellow); color:var(--ink); padding:14px 16px; display:flex; align-items:center; gap:10px; }
  .bar .logo{ width:34px; height:34px; border-radius:8px; background:var(--ink); color:var(--brand-yellow); display:grid; place-items:center; font-weight:900; }
  .bar h1{ margin:0; font-size:18px; font-weight:800; }
  .bar small{ display:block; font-size:12px; font-weight:600; opacity:.75; }
  main{ max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  h2{ font-size:16px; font-weight:800; color:var(--ink); margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .kid{ display:flex; align-items:center; gap:12px; }
  .kid .av{ width:48px; height:48px; border-radius:50%; background:#fff4e5; color:var(--brand-orange); display:grid; place-items:center; font-weight:900; font-size:20px; flex:none; }
  .kid b{ font-size:18px; color:var(--ink); }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .stat{ background:var(--bg); border-radius:8px; padding:10px 12px; }
  .stat span{ font-size:12px; color:var(--text-sub); display:block; }
  .stat b{ font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .muted{ color:var(--text-sub); font-size:13px; }
  .rules{ margin:0; padding-left:18px; font-size:13px; line-height:1.7; }
  .agree{ display:flex; gap:8px; align-items:flex-start; background:#fff8ef; border:1px solid #f6d7a8; border-radius:8px; padding:10px 12px; margin-top:10px; font-size:14px; cursor:pointer; }
  .agree input{ width:18px; height:18px; margin-top:1px; accent-color:var(--brand-orange); flex:none; }
  .btn{ border:1px solid var(--line); background:#fff; color:var(--text); border-radius:8px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--brand-orange); border-color:var(--brand-orange); color:#fff; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-sm{ padding:6px 10px; font-size:13px; }
  .item{ display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
  .item .when{ font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .tag{ display:inline-block; font-size:11px; font-weight:800; border-radius:4px; padding:2px 6px; margin-left:4px; vertical-align:1px; }
  .t-ok{ background:#e9f9ee; color:var(--ok); } .t-wait{ background:#fff4e5; color:#9a5b0a; } .t-no{ background:#fdecea; color:var(--danger); } .t-gray{ background:#eee; color:#666; }
  .quick{ display:flex; flex-direction:column; gap:6px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-head b{ font-size:16px; color:var(--ink); }
  .nav{ border:1px solid var(--line); background:#fff; border-radius:8px; width:38px; height:34px; cursor:pointer; font-size:14px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .wd{ text-align:center; font-size:12px; font-weight:700; color:var(--text-sub); padding:4px 0; }
  .d{ aspect-ratio:1/1.05; border:1px solid var(--line); border-radius:8px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; padding:0; position:relative; }
  .d.empty{ visibility:hidden; }
  .d.off{ color:#c4c4c4; background:#fafafa; cursor:default; }
  .d.sun, .d.hol{ color:var(--danger); } .d.sat{ color:var(--blue); }
  .d.off{ color:#c4c4c4 !important; }
  .d.sel{ outline:2px solid var(--brand-orange); outline-offset:-2px; background:#fff8ef; }
  .d.today::after{ content:""; position:absolute; top:4px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--brand-orange); }
  .d .n{ font-size:11px; font-weight:800; color:#fff; background:var(--ok); border-radius:999px; padding:0 6px; margin-top:2px; }
  .d .mine{ font-size:10px; color:var(--blue); }
  .d .h{ font-size:9px; color:var(--danger); font-weight:700; }
  .slot{ display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:6px; }
  .slot b{ font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .slot .why{ font-size:12px; color:var(--text-sub); }
  .seats{ font-size:12px; font-weight:800; color:var(--ok); }
  .empty-msg{ text-align:center; padding:18px 8px; color:var(--text-sub); font-size:14px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font-size:14px; font-weight:700; z-index:9; max-width:90vw; text-align:center; }
  .err{ text-align:center; padding:48px 16px; }
  .err b{ display:block; font-size:18px; color:var(--ink); margin-bottom:8px; }
  details summary{ cursor:pointer; font-size:13px; color:var(--text-sub); }
  .demo{ background:#e7f1fb; color:#1a5fb4; font-size:12px; font-weight:700; padding:8px 16px; text-align:center; }
  .foot{ text-align:center; font-size:11px; color:var(--text-sub); margin-top:16px; line-height:1.6; }
</style>
</head>
<body>
<div id="app"><div class="err"><b>불러오는 중…</b></div></div>
<script type="module">
/* 자라다 학부모 보강 예약 (개인 링크)
   - 주소: parent.html?c=원&t=토큰  (스케줄 매니저 → 보강관리 → 🔗 학부모 예약 링크에서 학생마다 만듦)
   - 서버 없이 Firestore 세 곳만 씀: parentLinks/{토큰}(내 아이 자료, 읽기) · parentPublic/current(열린 보강·규정, 읽기) · makeupRequests(신청, 추가만)
   - 신청은 원에서 확인한 뒤 확정돼요. 확정되면 보강 1회가 차감돼요. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CENTERS = {
  pyeongchon: { name: "평촌원", config: { apiKey: "AIzaSyCloEOVFM8x1WPYXc0xcL175zBfWkq9NCg", authDomain: "jarada-pyeongchon.firebaseapp.com", projectId: "jarada-pyeongchon", storageBucket: "jarada-pyeongchon.firebasestorage.app", messagingSenderId: "486231973508", appId: "1:486231973508:web:0f7ec0eb9e44786af3acd1" } },
  banpo: { name: "반포원", config: { apiKey: "AIzaSyALml0ro7SvDL7awn9UlMiFjisx9OiSuXQ", authDomain: "jarada-banpo.firebaseapp.com", projectId: "jarada-banpo", storageBucket: "jarada-banpo.firebasestorage.app", messagingSenderId: "259819249661", appId: "1:259819249661:web:d5ff6db57196b3f225c394" } },
  daechi: { name: "대치원", config: { apiKey: "AIzaSyByg6Wr45wtraJ-uUS0-kLeGRUhiocZ_zo", authDomain: "jarada-daechi.firebaseapp.com", projectId: "jarada-daechi", storageBucket: "jarada-daechi.firebasestorage.app", messagingSenderId: "456067871093", appId: "1:456067871093:web:90bd5be807ea4942cfa33c" } },
};
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const P = new URLSearchParams(location.search);
const centerKey = P.get("c"), token = (P.get("t") || "").trim();
const DEMO = P.get("demo") === "1";
const S = { link: null, linkErr: "", pub: null, month: null, sel: null, busy: false, toast: "" };
const $app = document.getElementById("app");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const dayOf = (s) => DAYS[new Date(s + "T00:00:00").getDay()];
const label = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getMonth() + 1}월 ${d.getDate()}일(${DAYS[d.getDay()]})`; };
const startMs = (date, time) => Date.parse(`${date}T${time}:00+09:00`);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const SENT_KEY = `jp_parent_sent_${token}`, AGREE_KEY = `jp_parent_agree_${token}`;
function toast(t) { S.toast = t; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ""; render(); }, 3200); }

// ── 예약 가능 여부 (원에서 확정할 때 한 번 더 확인해요) ──
function myState() {
  const v = S.link.view || {}, set = S.pub.settings || {};
  const sent = lsGet(SENT_KEY, []).filter((x) => !(v.requests || []).some((r) => r.id === x.id) && x.date >= todayISO());
  const pending = [...(v.requests || []).filter((r) => r.status === "pending"), ...sent.map((x) => ({ ...x, status: "pending" }))];
  const booked = (v.bookings || []).filter((b) => !b.absent);
  return { v, set, pending, booked };
}
function whyNot(o) {
  const { v, set, pending, booked } = myState();
  if (!v.enrolled) return "원에 확인이 필요해요";
  if (startMs(o.date, o.time) - (set.openingLeadMinutes || 0) * 60000 <= Date.now()) return "예약 마감";
  if (S.pub.closed && S.pub.closed[o.date]) return "휴원일";
  if (o.ages && o.ages.length) { if (v.birthYear == null) return "나이 확인 필요"; if (!o.ages.includes(v.birthYear)) return "다른 연령 수업"; }
  if (o.capacity - o.booked <= 0) return "자리 마감";
  const same = (x) => x.date === o.date && x.time === o.time;
  if (booked.some(same)) return "예약한 수업";
  if (pending.some((x) => same(x) && x.kind !== "cancel")) return "신청한 수업";
  if ((v.regular || []).some((r) => r.day === dayOf(o.date) && r.time === o.time)) return "정규수업 시간";
  if (set.blockConsecutive && set.times) {
    const ti = set.times.indexOf(o.time);
    if ([...booked, ...pending.filter((x) => x.kind !== "cancel")].some((x) => x.date === o.date && Math.abs(set.times.indexOf(x.time) - ti) === 1)) return "연속 교시 불가";
  }
  const all = [...booked, ...pending.filter((x) => x.kind !== "cancel")];
  const dow = new Date(o.date + "T00:00:00").getDay(), ws = addDays(o.date, -((dow + 6) % 7)), we = addDays(ws, 6);
  if (set.weeklyLimit && all.filter((x) => x.date >= ws && x.date <= we).length >= set.weeklyLimit) return `주 ${set.weeklyLimit}회 초과`;
  if (set.monthlyLimit && all.filter((x) => x.date.slice(0, 7) === o.date.slice(0, 7)).length >= set.monthlyLimit) return `월 ${set.monthlyLimit}회 초과`;
  if ((v.remaining || 0) - pending.filter((x) => x.kind !== "cancel").length <= 0) return "남은 보강 없음";
  return "";
}
function canCancel(b) {
  const set = S.pub.settings || {};
  if (set.parentCancellationMode === "dayBefore") return todayISO() < b.date;
  return Date.now() < startMs(b.date, b.time) - (set.parentCancellationLeadMinutes || 0) * 60000;
}

async function sendRequest(kind, o) {
  if (S.busy) return;
  const { set } = myState();
  if (kind === "book" && !lsGet(AGREE_KEY, false)) { toast("먼저 보강 규정을 확인하고 체크해 주세요"); document.getElementById("agree")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const msg = kind === "book" ? `${label(o.date)} ${o.time} ${o.room}번 반\n보강을 신청할까요?\n\n원에서 확인한 뒤 확정돼요. 확정되면 보강 1회가 차감돼요.` : `${label(o.date)} ${o.time} 보강을 취소 신청할까요?\n원에서 확인하면 취소되고 보강 1회가 돌아와요.`;
  if (!confirm(msg)) return;
  const data = { token, kind, openingId: o.id || "", date: o.date, time: o.time, roomNo: Number(o.room) || 0, status: "pending" };
  const id = `${token}_${kind}_${o.date}_${o.time.replace(":", "")}_${data.roomNo}`;
  S.busy = true; render();
  try {
    if (!DEMO) await setDoc(doc(db, "makeupRequests", id), { ...data, createdAt: serverTimestamp() });
    lsSet(SENT_KEY, [...lsGet(SENT_KEY, []).filter((x) => x.id !== id), { id, kind, date: o.date, time: o.time, room: data.roomNo }]);
    toast(kind === "book" ? "신청했어요. 원에서 확인하면 확정돼요." : "취소를 신청했어요.");
  } catch (e) {
    console.warn(e);
    toast(e && e.code === "permission-denied" ? "이미 신청한 수업이거나 링크가 꺼졌어요. 원에 문의해 주세요." : "신청하지 못했어요. 인터넷 연결을 확인해 주세요.");
  }
  S.busy = false; render();
}

// ── 화면 ──
function render() {
  if (!centerKey || !CENTERS[centerKey] || token.length < 20) { $app.innerHTML = errHTML("링크가 올바르지 않아요", "원에서 받은 문자의 링크를 다시 눌러 주세요."); return; }
  if (S.linkErr) { $app.innerHTML = errHTML(S.linkErr, "원에 새 예약 링크를 요청해 주세요."); return; }
  if (!S.link || !S.pub) { $app.innerHTML = shell(`<div class="err"><b>불러오는 중…</b></div>`); return; }
  const { v, set, pending, booked } = myState();
  const now = todayISO();
  const upcoming = booked.filter((b) => startMs(b.date, b.time) > Date.now() - 3600000);
  const pendingCancel = (b) => pending.some((x) => x.kind === "cancel" && x.date === b.date && x.time === b.time);
  const rejected = (v.requests || []).filter((r) => r.status === "rejected" && r.date >= now);
  const past = (v.bookings || []).filter((b) => startMs(b.date, b.time) <= Date.now() - 3600000).reverse();
  const openings = (S.pub.openings || []).slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.room - b.room);
  const ok = openings.filter((o) => !whyNot(o));
  const agreed = lsGet(AGREE_KEY, false);
  if (!S.month) S.month = (ok[0] ? ok[0].date : now).slice(0, 7);
  const kid = `<div class="card">
      <div class="kid"><div class="av">${esc((v.name || "?").length >= 3 ? v.name.slice(1, 2) : (v.name || "?").slice(0, 1))}</div><div><b>${esc(v.name || "")}</b>${v.age ? ` <span class="muted">${esc(v.age)}세</span>` : ""}<div class="muted">${esc(S.pub.center || CENTERS[centerKey].name)} · ${v.regular && v.regular.length ? `정규 ${v.regular.map((r) => `${r.day} ${r.time}`).join(", ")}` : "정규수업 확인 필요"}</div></div></div>
      <div class="stats"><div class="stat"><span>남은 보강</span><b>${Math.max(0, (v.remaining || 0))}</b>회</div><div class="stat"><span>예약·신청</span><b>${upcoming.length + pending.filter((x) => x.kind !== "cancel").length}</b>건</div></div>
      ${!v.enrolled ? `<p class="muted" style="color:var(--danger);">재원 정보를 찾지 못했어요. 원에 문의해 주세요.</p>` : ""}
    </div>`;
  const mine = `<div class="card"><h2>내 보강</h2>
      ${upcoming.map((b) => `<div class="item"><div><span class="when">${label(b.date)} ${esc(b.time)}</span><span class="tag t-ok">확정</span>${pendingCancel(b) ? `<span class="tag t-wait">취소 확인 중</span>` : ""}<div class="muted">${b.room}번 반</div></div>
        ${pendingCancel(b) ? "" : canCancel(b) ? `<button class="btn btn-sm" data-act="cancel" data-date="${b.date}" data-time="${esc(b.time)}" data-room="${b.room}">취소 신청</button>` : `<span class="muted" style="font-size:12px;">취소 마감</span>`}</div>`).join("")}
      ${pending.filter((x) => x.kind !== "cancel").map((x) => `<div class="item"><div><span class="when">${label(x.date)} ${esc(x.time)}</span><span class="tag t-wait">확인 중</span><div class="muted">${x.room}번 반 · 원에서 확인하면 확정돼요</div></div></div>`).join("")}
      ${rejected.map((x) => `<div class="item"><div><span class="when">${label(x.date)} ${esc(x.time)}</span><span class="tag t-no">${x.kind === "cancel" ? "취소 불가" : "예약 안 됨"}</span><div class="muted">${esc(x.reason || "원에 문의해 주세요")}</div></div></div>`).join("")}
      ${!upcoming.length && !pending.length && !rejected.length ? `<div class="empty-msg">예약한 보강이 없어요.</div>` : ""}
      ${past.length ? `<details><summary>지난 보강 ${past.length}건</summary>${past.map((b) => `<div class="item"><div><span class="when">${label(b.date)} ${esc(b.time)}</span><span class="tag ${b.absent ? "t-no" : "t-gray"}">${b.absent ? "보강 결석" : "수업 끝"}</span></div></div>`).join("")}</details>` : ""}
    </div>`;
  const rules = `<div class="card" id="agree"><h2>보강 예약 규정</h2>
      <ul class="rules">${(set.policies || []).map((p) => `<li>${esc(p)}</li>`).join("")}
        <li>취소: ${set.parentCancellationMode === "dayBefore" ? "수업 전날까지 (당일 취소 불가)" : set.parentCancellationLeadMinutes ? `수업 ${set.parentCancellationLeadMinutes}분 전까지` : "수업 시작 전까지"}</li></ul>
      <label class="agree"><input type="checkbox" data-act="agree" ${agreed ? "checked" : ""} /> 보강 규정을 확인했고, 규정에 따라 예약하겠습니다.</label>
    </div>`;
  const quick = `<div class="card"><h2>빠른 보강 찾기 <span class="muted" style="font-weight:600;">우리 아이가 갈 수 있는 수업</span></h2>
      <div class="quick">${ok.slice(0, 4).map((o) => slotHTML(o, agreed)).join("") || `<div class="empty-msg">지금 신청할 수 있는 보강이 없어요.<br>자리가 열리면 이 화면에 나타나요.</div>`}</div></div>`;
  $app.innerHTML = shell(kid + mine + (set.configured ? rules + quick + calendarHTML(openings, agreed) : `<div class="card empty-msg">원에서 보강 예약을 준비하고 있어요.</div>`)
    + `<div class="foot">이 링크는 ${esc(v.name || "")} 학생 전용이에요. 다른 분께 전달하지 말아 주세요.<br>휴대폰 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</div>`);
}
function slotHTML(o, agreed, showDate = true) {
  const why = whyNot(o);
  const left = o.capacity - o.booked;
  return `<div class="slot"><div><b>${showDate ? `${label(o.date)} ` : ""}${esc(o.time)}</b> <span class="muted">${o.room}번 반</span>
      <div>${why ? `<span class="why">${esc(why)}</span>` : `<span class="seats">남은 ${left}자리</span>`}</div></div>
      <button class="btn ${why ? "" : "btn-primary"}" data-act="book" data-id="${esc(o.id)}" ${why || S.busy ? "disabled" : ""}>${why ? "신청 불가" : "신청"}</button></div>`;
}
function calendarHTML(openings, agreed) {
  const [y, m] = S.month.split("-").map(Number);
  const first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate(), now = todayISO();
  const byDate = new Map();
  for (const o of openings) { if (!byDate.has(o.date)) byDate.set(o.date, []); byDate.get(o.date).push(o); }
  const { booked } = myState();
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(`<div class="d empty"></div>`);
  for (let d = 1; d <= n; d++) {
    const s = `${S.month}-${String(d).padStart(2, "0")}`, w = new Date(s + "T00:00:00").getDay();
    const list = byDate.get(s) || [], can = list.filter((o) => !whyNot(o)).length, hol = S.pub.closed && S.pub.closed[s];
    const mineN = booked.filter((b) => b.date === s).length;
    cells.push(`<button type="button" class="d ${s < now ? "off" : ""} ${w === 0 ? "sun" : w === 6 ? "sat" : ""} ${hol ? "hol" : ""} ${S.sel === s ? "sel" : ""} ${s === now ? "today" : ""}" data-act="day" data-date="${s}" ${s < now ? "disabled" : ""} aria-label="${label(s)}${can ? ` 신청 가능 ${can}수업` : ""}">${d}${can ? `<span class="n">${can}</span>` : ""}${mineN ? `<span class="mine">내 예약</span>` : ""}${hol ? `<span class="h">휴원</span>` : ""}</button>`);
  }
  const selList = S.sel ? (byDate.get(S.sel) || []) : [];
  return `<div class="card"><h2>날짜로 찾기</h2>
    <div class="cal-head"><button class="nav" data-act="mon" data-d="-1" aria-label="이전 달">◀</button><b>${y}년 ${m}월</b><button class="nav" data-act="mon" data-d="1" aria-label="다음 달">▶</button></div>
    <div class="grid">${DAYS.map((w, i) => `<div class="wd" style="${i === 0 ? "color:var(--danger)" : i === 6 ? "color:var(--blue)" : ""}">${w}</div>`).join("")}${cells.join("")}</div>
    <p class="muted" style="font-size:12px;margin:8px 0 0;">초록 숫자 = 신청할 수 있는 수업 수</p>
    ${S.sel ? `<div style="margin-top:12px;"><b style="color:var(--ink);">${label(S.sel)}</b>${S.pub.closed && S.pub.closed[S.sel] ? ` <span class="tag t-no">휴원 · ${esc(S.pub.closed[S.sel])}</span>` : ""}
      <div style="margin-top:8px;">${selList.map((o) => slotHTML(o, agreed, false)).join("") || `<div class="empty-msg">이 날은 열린 보강이 없어요.</div>`}</div></div>` : ""}
  </div>`;
}
function shell(inner) {
  return `${DEMO ? `<div class="demo">예시 화면이에요 · 실제 예약은 되지 않아요</div>` : ""}
    <div class="bar"><div class="logo">자</div><div><h1>보강 예약</h1><small>자라다 ${esc(CENTERS[centerKey]?.name || "")} · 학부모 전용</small></div></div>
    <main>${inner}</main>${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
}
function errHTML(t, sub) { return shell(`<div class="err"><b>${esc(t)}</b><p class="muted">${esc(sub)}</p></div>`); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "agree") { lsSet(AGREE_KEY, el.checked); render(); return; }
  if (a === "mon") { const [y, m] = S.month.split("-").map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); S.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; S.sel = null; render(); return; }
  if (a === "day") { S.sel = el.dataset.date; render(); return; }
  if (a === "book") { const o = (S.pub.openings || []).find((x) => x.id === el.dataset.id); if (o) sendRequest("book", o); return; }
  if (a === "cancel") { sendRequest("cancel", { id: "", date: el.dataset.date, time: el.dataset.time, room: Number(el.dataset.room) }); return; }
});

let db = null;
if (DEMO) {
  const t = todayISO(), d = (n) => addDays(t, n), y2 = new Date().getFullYear() - 2000 - 8;
  S.link = { active: true, view: { name: "김자람", age: "8", birthYear: y2, enrolled: true, remaining: 3, regular: [{ day: "화", time: "16:50", room: 4 }], bookings: [{ date: d(3), time: "15:10", room: 2, absent: false }], requests: [] } };
  S.pub = { center: CENTERS[centerKey]?.name || "", closed: { [d(10)]: "원 휴가" }, settings: { configured: true, times: ["09:20", "11:00", "13:30", "15:10", "16:50", "18:30"], weeklyLimit: 2, monthlyLimit: 0, minimumLessons: 8, blockConsecutive: true, parentCancellationMode: "dayBefore", policies: ["보강 예약은 주 최대 2회 가능합니다.", "연속된 두 교시 및 본인의 정규수업과 같은 요일·시간에는 보강을 예약할 수 없습니다."] },
    openings: [[1, "15:10", 1], [2, "16:50", 3], [5, "15:10", 2], [6, "13:30", 1], [9, "16:50", 2]].map(([n, time, room]) => ({ id: `opening_${d(n)}_${time.replace(":", "")}_${room}`, date: d(n), time, room, ages: [y2, y2 - 1, y2 + 1], capacity: 2, booked: n === 6 ? 2 : 0 })) };
  render();
} else if (centerKey && CENTERS[centerKey] && token.length >= 20) {
  db = getFirestore(initializeApp(CENTERS[centerKey].config));
  onSnapshot(doc(db, "parentLinks", token), (snap) => {
    if (!snap.exists() || snap.data().active === false) { S.linkErr = "사용할 수 없는 링크예요"; S.link = null; }
    else { S.linkErr = ""; S.link = snap.data(); }
    render();
  }, () => { S.linkErr = "사용할 수 없는 링크예요"; render(); });
  onSnapshot(doc(db, "parentPublic", "current"), (snap) => { S.pub = snap.exists() ? snap.data() : { settings: {}, openings: [] }; render(); }, () => { S.pub = { settings: {}, openings: [] }; render(); });
} else render();
</script>
</body>
</html>
